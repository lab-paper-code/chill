{{- if .Values.profiler.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.profilerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: profiler
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - edge.dacs.io
    resources:
      - profilingruns
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - edge.dacs.io
    resources:
      - profilingruns/status
    verbs:
      - get
      - patch
  - apiGroups:
      - edge.dacs.io
    resources:
      - batchsaturations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - edge.dacs.io
    resources:
      - batchsaturations/status
    verbs:
      - get
      - patch
  - apiGroups:
      - edge.dacs.io
    resources:
      - nodeactuations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
  {{- if .Values.profiler.leaderElection }}
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chill.profilerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: profiler
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chill.profilerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.profilerName" . }}
  labels:
    app.kubernetes.io/component: profiler
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - edge.dacs.io
    resources:
      - chillsystems
      - deviceclasses
      - modelspecs
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.profilerName" . }}
  labels:
    app.kubernetes.io/component: profiler
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.profilerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
