{{- if .Values.profiler.enabled }}
{{- $workloadObserverKubeAPIServer := include "chill.profilerWorkloadObserverKubernetesAPIServer" . }}
{{- $retention := .Values.profiler.failedJobRetentionSeconds }}
{{- if or (not (regexMatch "^[0-9]+$" (toString $retention))) (lt (int64 $retention) 1) (gt (int64 $retention) 604800) }}
{{- fail "profiler.failedJobRetentionSeconds must be an integer between 1 and 604800" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chill.profilerConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: profiler
    {{- include "chill.labels" . | nindent 4 }}
data:
  {{ .Values.profiler.configMapKey | quote }}: |
    replicas: {{ .Values.profiler.replicaCount }}
    failedJobRetentionSeconds: {{ int64 $retention }}
    image: {{ include "chill.profilerImage" . | quote }}
    imagePullPolicy: {{ .Values.profiler.image.pullPolicy | quote }}
    serviceAccountName: {{ include "chill.profilerServiceAccountName" . | quote }}
    metricsBindAddress: {{ .Values.profiler.metricsBindAddress | quote }}
    healthProbePort: {{ .Values.profiler.healthProbePort }}
    leaderElection: {{ .Values.profiler.leaderElection }}
    leaderElectionID: {{ .Values.profiler.leaderElectionID | quote }}
    factSource:
      configMapName: {{ include "chill.profilerFactSourceName" . | quote }}
      executionFactsKey: {{ .Values.profiler.factSource.executionFactsKey | quote }}
      metricSourcesKey: {{ .Values.profiler.factSource.metricSourcesKey | quote }}
      workloadObservationKey: {{ .Values.profiler.factSource.workloadObservationKey | quote }}
      executionPoliciesKey: {{ .Values.profiler.factSource.executionPoliciesKey | quote }}
      actuationPoliciesKey: {{ .Values.profiler.factSource.actuationPoliciesKey | quote }}
    workloadObserver:
      serviceAccountName: {{ include "chill.profilerWorkloadObserverServiceAccountName" . | quote }}
      kubeAPIServer: {{ $workloadObserverKubeAPIServer | quote }}
    transitionObserver:
      observerNodeName: {{ .Values.profiler.transitionObserver.observerNodeName | quote }}
      serviceAccountName: {{ include "chill.profilerTransitionObserverServiceAccountName" . | quote }}
      activeDeadlineOverheadSeconds: {{ .Values.profiler.transitionObserver.activeDeadlineOverheadSeconds }}
      maximumObjectBytes: {{ int64 .Values.profiler.transitionObserver.maximumObjectBytes }}
    nodeSelector:
{{- toYaml .Values.profiler.nodeSelector | nindent 6 }}
    {{- with .Values.profiler.affinity }}
    affinity:
{{- toYaml . | nindent 6 }}
    {{- end }}
    tolerations:
{{- toYaml .Values.profiler.tolerations | nindent 6 }}
    resources:
{{- toYaml .Values.profiler.resources | nindent 6 }}
    podSecurityContext:
{{- toYaml .Values.profiler.podSecurityContext | nindent 6 }}
    securityContext:
{{- toYaml .Values.profiler.securityContext | nindent 6 }}
{{- end }}
