{{- if .Values.profiler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chill.profilerFactSourceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: profiler
    app.kubernetes.io/part-of: chill
    {{- include "chill.labels" . | nindent 4 }}
data:
  {{ .Values.profiler.factSource.executionFactsKey | quote }}: |
    schemaVersion: chill.dacs.io/profiler-execution-facts.v1alpha8
    metricObserverImage: {{ .Values.profiling.metricObserverImage | quote }}
    declarations:
{{- toYaml .Values.profiling.executionDeclarations | nindent 6 }}
  {{ .Values.profiler.factSource.metricSourcesKey | quote }}: |
    schemaVersion: chill.dacs.io/profiler-metric-sources.v1alpha5
    sources:
{{- toYaml .Values.profiling.metricSources | nindent 6 }}
  {{ .Values.profiler.factSource.workloadObservationKey | quote }}: |
    schemaVersion: chill.dacs.io/profiler-workload-observation.v1alpha2
    image: {{ .Values.profiling.workloadObserverImage | quote }}
  {{ .Values.profiler.factSource.executionPoliciesKey | quote }}: |
    schemaVersion: chill.dacs.io/profiler-execution-policies.v1alpha1
    policies:
{{- $executionPolicies := list }}
{{- range $policy := .Values.profiling.executionPolicies }}
{{- $executionPolicies = append $executionPolicies (mergeOverwrite (deepCopy $.Values.profiling.executionPolicyDefaults) $policy) }}
{{- end }}
{{- toYaml $executionPolicies | nindent 6 }}
  {{ .Values.profiler.factSource.actuationPoliciesKey | quote }}: |
    schemaVersion: chill.dacs.io/profiler-actuation-policies.v1alpha1
    policies:
{{- toYaml .Values.powerActuation.policies | nindent 6 }}
{{- end }}
