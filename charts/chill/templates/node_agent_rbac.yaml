{{- if .Values.nodeAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chill.nodeAgentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: node-agent
    {{- include "chill.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.nodeAgentName" . }}
  labels:
    app.kubernetes.io/component: node-agent
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # patch publishes discovery and online-CPU metadata.
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.nodeAgentName" . }}
  labels:
    app.kubernetes.io/component: node-agent
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.nodeAgentName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.nodeAgentName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.nodeAgent.actuation.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chill.nodeAgentActuationName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: node-agent-actuation
    {{- include "chill.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.nodeAgentActuationName" . }}
  labels:
    app.kubernetes.io/component: node-agent-actuation
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # watch reads its own Node's desired power mode; patch publishes the
    # power-mode state, generation, and read-back.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["edge.dacs.io"]
    resources: ["deviceclasses"]
    # get resolves the desired mode's actuator target.
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.nodeAgentActuationName" . }}
  labels:
    app.kubernetes.io/component: node-agent-actuation
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.nodeAgentActuationName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.nodeAgentActuationName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
