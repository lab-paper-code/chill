{{- if .Values.dashboard.enabled }}
{{- $name := include "chill.dashboardName" . -}}
{{- $namespace := default .Release.Namespace .Values.servingEntrypoint.namespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "chill.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chill.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chill.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
        edge.dacs.io/workload-role: system
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "chill.dashboardImage" . | quote }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | toJson | quote }}
            - name: CHILL_BASE_URL
              value: {{ include "chill.dashboardBaseURL" . | quote }}
            - name: CHILL_NAMESPACE
              value: {{ default $namespace .Values.dashboard.namespace | quote }}
            - name: CHILL_SYSTEM_NAME
              value: {{ default (include "chill.systemName" .) .Values.dashboard.systemName | quote }}
            - name: CHILL_QUERY_TIMEOUT_MS
              value: {{ .Values.dashboard.queryTimeoutMilliseconds | toJson | quote }}
            - name: CHILL_MUTATION_TIMEOUT_MS
              value: {{ .Values.dashboard.mutationTimeoutMilliseconds | toJson | quote }}
            - name: CHILL_INFER_TIMEOUT_MS
              value: {{ .Values.dashboard.inferTimeoutMilliseconds | toJson | quote }}
            - name: CHILL_MAX_REQUEST_BYTES
              value: {{ .Values.dashboard.maxRequestBytes | toJson | quote }}
            - name: CHILL_PAGE_SIZE
              value: {{ .Values.dashboard.pageSize | toJson | quote }}
            - name: CHILL_MAX_PAGE_SIZE
              value: {{ .Values.dashboard.maxPageSize | toJson | quote }}
            - name: CHILL_MAX_WINDOW_HOURS
              value: {{ .Values.dashboard.maxWindowHours | toJson | quote }}
            - name: CHILL_POLL_INTERVAL_MS
              value: {{ .Values.dashboard.pollIntervalMilliseconds | toJson | quote }}
            {{- if .Values.dashboard.caSecretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/chill/ca/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.dashboard.securityContext | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: temporary
              mountPath: /tmp
            {{- if .Values.dashboard.caSecretName }}
            - name: owner-ca
              mountPath: /etc/chill/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
        {{- if .Values.dashboard.caSecretName }}
        - name: owner-ca
          secret:
            secretName: {{ .Values.dashboard.caSecretName | quote }}
            items:
              - key: {{ .Values.dashboard.caSecretKey | quote }}
                path: ca.crt
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.dashboard.nodeSelector | nindent 8 }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.dashboard.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "chill.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "chill.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
{{- if .Values.dashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "chill.labels" . | nindent 4 }}
  {{- with .Values.dashboard.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.dashboard.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - secretName: {{ .Values.dashboard.ingress.tlsSecretName | quote }}
      hosts: [{{ .Values.dashboard.ingress.host | quote }}]
  rules:
    - host: {{ .Values.dashboard.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
