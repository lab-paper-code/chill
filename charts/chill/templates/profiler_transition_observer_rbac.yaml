{{- if .Values.profiler.enabled }}
{{- if .Values.profiler.transitionObserver.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: transition-observer
    {{- include "chill.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: transition-observer
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
  - apiGroups:
      - edge.dacs.io
    resources:
      - nodeactuations
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: transition-observer
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
  labels:
    app.kubernetes.io/component: transition-observer
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
  labels:
    app.kubernetes.io/component: transition-observer
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerTransitionObserverServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
