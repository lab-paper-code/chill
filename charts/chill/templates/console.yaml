{{- if .Values.console.enabled }}
{{- $name := include "chill.consoleName" . -}}
{{- $labels := include "chill.labels" . -}}
{{- if .Values.console.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chill.consoleServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["edge.dacs.io"]
    resources: ["profilingruns", "batchenergyoptimizations"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ printf "%s-evidence-store-credentials" (include "chill.systemName" .) | quote }}
    verbs: ["get"]
  # The Evidence Store resolver reads the allocated Service address.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames:
      - {{ printf "%s-evidence-store" (include "chill.systemName" .) | quote }}
    verbs: ["get"]
  # Preflight reports a missing Profiler fact source as a reason, so the
  # Console must be allowed to attempt that read in every deployment profile.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "chill.profilerFactSourceName" . | quote }}
    verbs: ["get"]
  {{- if .Values.evidenceStore.enabled }}
  # A campaign result is written by the controller rather than by a measurement
  # Job, so its delivery contract is read from the Evidence Store operand
  # configuration instead of being recovered from a Job.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ .Values.evidenceStore.configRef.name | quote }}
    verbs: ["get"]
  {{- end }}
{{- if .Values.evidenceStore.enabled }}
---
# The ChillSystem is cluster-scoped, so reading which Evidence Store a campaign
# result was delivered to needs a cluster-scoped grant. chill-console-viewer is
# the grant an operator binds to a person; it binds to nobody by default and
# carries more than the Console itself needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-system-reader
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["edge.dacs.io"]
    resources: ["chillsystems"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-system-reader
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-system-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.consoleServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Resolving a campaign intent reads its model catalog, device class, and target
# Node; all three authorities are cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-preflight-reader
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["edge.dacs.io"]
    resources: ["modelspecs", "deviceclasses"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: ["edge.dacs.io"]
    resources: ["chillsystems", "deviceclasses", "modelspecs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-preflight-reader
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-preflight-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.consoleServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.consoleServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chill.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chill.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: operator-console
        edge.dacs.io/workload-role: system
    spec:
      serviceAccountName: {{ include "chill.consoleServiceAccountName" . }}
      securityContext:
{{- toYaml .Values.console.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: {{ include "chill.consoleImage" . | quote }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          args:
            - {{ printf "--bind-address=:%v" .Values.console.port | quote }}
            - {{ printf "--system-name=%s" (include "chill.systemName" .) | quote }}
            # The Console starts without the Profiler so preflight can explain
            # an absent fact source instead of making startup depend on it.
            - {{ printf "--fact-source-config-map=%s" (include "chill.profilerFactSourceName" .) | quote }}
            - {{ printf "--execution-facts-key=%s" .Values.profiler.factSource.executionFactsKey | quote }}
            - {{ printf "--metric-sources-key=%s" .Values.profiler.factSource.metricSourcesKey | quote }}
            - {{ printf "--workload-observation-key=%s" .Values.profiler.factSource.workloadObservationKey | quote }}
            - {{ printf "--actuation-policies-key=%s" .Values.profiler.factSource.actuationPoliciesKey | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
              protocol: TCP
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
{{- toYaml .Values.console.securityContext | nindent 12 }}
          volumeMounts:
            - name: evidence-staging
              mountPath: /var/run/chill/evidence
      volumes:
        - name: evidence-staging
          emptyDir:
            sizeLimit: 128Mi
      nodeSelector:
{{- toYaml .Values.console.nodeSelector | nindent 8 }}
      {{- with .Values.console.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
{{- toYaml .Values.console.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator-console
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "chill.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator-console
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
      protocol: TCP
{{- end }}
