{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
    helm.sh/resource-policy: keep
  name: modelspecs.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: ModelSpec
    listKind: ModelSpecList
    plural: modelspecs
    singular: modelspec
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelSpec is the Schema for the modelspecs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpecSpec defines model artifacts and their execution-path
              requirements.
            properties:
              artifacts:
                description: Artifacts contains executable representations of this
                  logical model.
                items:
                  description: ModelArtifact identifies one executable representation.
                  properties:
                    derivation:
                      description: |-
                        Derivation binds a derived executable to its source artifact and conversion settings.
                        It is absent for canonical source artifacts.
                      properties:
                        conversion:
                          description: Conversion binds the converter and recipe used
                            to produce this artifact.
                          properties:
                            tool:
                              description: Tool is the converter family, such as rknn-toolkit2.
                              minLength: 1
                              type: string
                            version:
                              description: Version is the converter's reported version.
                              minLength: 1
                              type: string
                          required:
                          - tool
                          - version
                          type: object
                        declaredBatchSizes:
                          description: |-
                            DeclaredBatchSizes enumerates every batch size value this artifact can execute.
                            A runtime that consumes batch as a call argument declares no derivation
                            and therefore no declared batch sizes.
                          items:
                            format: int32
                            minimum: 1
                            type: integer
                          minItems: 1
                          type: array
                        sourceArtifact:
                          description: |-
                            SourceArtifact references the source ModelArtifact name in this ModelSpec.
                            Reference resolution is semantic validation, not OpenAPI structure.
                          minLength: 1
                          type: string
                        targetPlatform:
                          description: TargetPlatform is the converter target, such
                            as rk3588.
                          minLength: 1
                          type: string
                      required:
                      - conversion
                      - declaredBatchSizes
                      - sourceArtifact
                      - targetPlatform
                      type: object
                    format:
                      description: Format names the artifact representation, such
                        as onnx.
                      minLength: 1
                      type: string
                    input:
                      description: Input declares this artifact's input tensor contract
                        without its batch axis.
                      properties:
                        dataType:
                          minLength: 1
                          type: string
                        inputSampleShape:
                          description: |-
                            InputSampleShape is the input tensor shape without its batch axis. The
                            selected measurement batch supplies that axis.
                          items:
                            format: int32
                            minimum: 1
                            type: integer
                          minItems: 1
                          type: array
                        layout:
                          minLength: 1
                          type: string
                      required:
                      - dataType
                      - inputSampleShape
                      - layout
                      type: object
                    name:
                      description: Name is unique within one ModelSpec and is referenced
                        by execution paths.
                      minLength: 1
                      type: string
                    source:
                      description: |-
                        Source identifies the immutable OCI artifact carrier used to deliver this
                        representation to a measurement worker.
                      properties:
                        architecture:
                          description: Architecture is the Kubernetes architecture
                            supported by the carrier.
                          minLength: 1
                          type: string
                        image:
                          description: Image is an immutable OCI image reference containing
                            the artifact.
                          minLength: 1
                          type: string
                        path:
                          description: Path is the clean absolute path of the artifact
                            in the carrier image.
                          pattern: ^/[A-Za-z0-9._/-]+$
                          type: string
                      required:
                      - architecture
                      - image
                      - path
                      type: object
                  required:
                  - format
                  - input
                  - name
                  - source
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              executionPaths:
                description: ExecutionPaths binds artifacts to required runtime families
                  and backends.
                items:
                  description: ModelExecutionPath describes one stable artifact/runtime
                    requirement.
                  properties:
                    artifact:
                      description: |-
                        Artifact references a ModelArtifact name in this ModelSpec.
                        Reference resolution is semantic validation, not OpenAPI structure.
                      minLength: 1
                      type: string
                    name:
                      description: Name is unique within one ModelSpec.
                      minLength: 1
                      type: string
                    runtime:
                      description: Runtime contains the software path required to
                        consume the artifact.
                      properties:
                        backend:
                          description: Backend names the required backend within the
                            runtime-family context.
                          minLength: 1
                          type: string
                        family:
                          description: Family names the required runtime family, such
                            as onnxruntime.
                          minLength: 1
                          type: string
                      required:
                      - backend
                      - family
                      type: object
                  required:
                  - artifact
                  - name
                  - runtime
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - artifacts
            - executionPaths
            type: object
          status:
            description: ModelSpecStatus defines the observed state of ModelSpec
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
