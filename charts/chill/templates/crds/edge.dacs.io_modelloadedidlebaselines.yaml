{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
    helm.sh/resource-policy: keep
  name: modelloadedidlebaselines.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: ModelLoadedIdleBaseline
    listKind: ModelLoadedIdleBaselineList
    plural: modelloadedidlebaselines
    shortNames:
    - idlebase
    singular: modelloadedidlebaseline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.completedRuns
      name: Completed
      type: integer
    - jsonPath: .status.attemptedRuns
      name: Attempts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelLoadedIdleBaseline owns the idle-only ProfilingRuns contributing to one
          measured aggregate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelLoadedIdleBaselineSpec requests one measured idle-power
              aggregate.
            properties:
              attemptLimit:
                description: AttemptLimit bounds all terminal child Runs, including
                  measured Runs.
                format: int32
                maximum: 100
                minimum: 2
                type: integer
              batch:
                format: int32
                minimum: 1
                type: integer
              cpuAffinity:
                description: CPUAffinity selects explicit firstfloor CPU IDs for every
                  owned idle Run.
                items:
                  format: int32
                  minimum: 0
                  type: integer
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              cpuQuota:
                anyOf:
                - type: integer
                - type: string
                description: CPUQuota fixes the whole-core runtime quota for each
                  owned idle Run.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              pointPolicy:
                description: ModelLoadedIdleBaselinePointPolicySpec fixes the aggregate
                  estimator inputs.
                properties:
                  confidenceLevel:
                    description: ConfidenceLevel is a decimal string in the interval
                      (0, 1).
                    pattern: ^0\.[0-9]*[1-9][0-9]*$
                    type: string
                  minimumRuns:
                    format: int32
                    minimum: 2
                    type: integer
                  version:
                    description: Version identifies the complete point-estimation
                      rule.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                required:
                - confidenceLevel
                - minimumRuns
                - version
                type: object
              protocol:
                properties:
                  durationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                  durationToleranceSeconds:
                    default: 0.5
                    minimum: 0
                    type: number
                  metricObservation:
                    description: ProfilingRunMetricObservationSpec contains policy
                      only, never an endpoint.
                    properties:
                      durationSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                      intervalMilliseconds:
                        format: int32
                        minimum: 1
                        type: integer
                      timeoutMilliseconds:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - durationSeconds
                    - intervalMilliseconds
                    - timeoutMilliseconds
                    type: object
                    x-kubernetes-validations:
                    - message: timeoutMilliseconds must be less than intervalMilliseconds
                      rule: self.timeoutMilliseconds < self.intervalMilliseconds
                  settlingDurationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - durationSeconds
                - metricObservation
                - settlingDurationSeconds
                type: object
                x-kubernetes-validations:
                - message: duration tolerance must be less than duration
                  rule: '!has(self.durationToleranceSeconds) || self.durationToleranceSeconds
                    < double(self.durationSeconds)'
                - message: metricObservation.durationSeconds must cover durationSeconds
                  rule: self.metricObservation.durationSeconds >= self.durationSeconds
              state:
                description: |-
                  MeasurementStateSpec fixes the execution state every trial of one
                  measurement shares.
                properties:
                  candidate:
                    description: Candidate selects one static catalog execution path.
                    properties:
                      deviceClass:
                        description: DeviceClass names the cluster-scoped DeviceClass.
                        maxLength: 253
                        minLength: 1
                        type: string
                      executionPath:
                        description: ExecutionPath selects one path declared by ModelSpec.
                        maxLength: 128
                        minLength: 1
                        type: string
                      modelSpec:
                        description: ModelSpec names the cluster-scoped ModelSpec.
                        maxLength: 253
                        minLength: 1
                        type: string
                      powerMode:
                        description: |-
                          PowerMode selects one mode declared by DeviceClass. Fixed Runs may execute
                          directly; a non-fixed selection requires a selected configured actuation
                          policy and a completed transition that confirms the required state.
                        maxLength: 128
                        minLength: 1
                        type: string
                      preprocessor:
                        description: |-
                          Preprocessor names the cluster-scoped Preprocessor whose artifact for the
                          selected model artifact runs beside the model.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - deviceClass
                    - executionPath
                    - modelSpec
                    - powerMode
                    - preprocessor
                    type: object
                  cpuRequest:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPURequest is the non-exclusive scheduling request
                      for the runtime container.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  targetNode:
                    description: TargetNode names the Kubernetes Node on which the
                      Run is requested.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - candidate
                - cpuRequest
                - targetNode
                type: object
            required:
            - attemptLimit
            - batch
            - cpuQuota
            - pointPolicy
            - protocol
            - state
            type: object
            x-kubernetes-validations:
            - message: attemptLimit must cover minimumRuns
              rule: self.attemptLimit >= self.pointPolicy.minimumRuns
            - message: cpuQuota must be positive
              rule: quantity(self.cpuQuota).compareTo(quantity('0')) > 0
            - message: cpuQuota must be a whole number of CPU cores
              rule: quantity(self.cpuQuota).isInteger()
            - message: state.cpuRequest must not exceed cpuQuota
              rule: quantity(self.state.cpuRequest).compareTo(quantity(self.cpuQuota))
                <= 0
            - message: ModelLoadedIdleBaseline spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              ModelLoadedIdleBaselineStatus is a compact projection of owned Runs and the
              retained aggregate result.
            properties:
              attemptedRuns:
                format: int32
                type: integer
              completedRuns:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Measuring
                - Complete
                - Insufficient
                type: string
              result:
                properties:
                  key:
                    description: Key is opaque to API consumers.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  schemaVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  store:
                    description: Store is the logical CHILL-managed store identity,
                      not an endpoint.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - schemaVersion
                - size
                - store
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 243 characters so the longest generated Run
            name fits
          rule: size(self.metadata.name) <= 243
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
