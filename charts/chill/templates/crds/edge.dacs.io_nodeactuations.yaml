{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
    helm.sh/resource-policy: keep
  name: nodeactuations.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: NodeActuation
    listKind: NodeActuationList
    plural: nodeactuations
    shortNames:
    - nact
    singular: nodeactuation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.node.name
      name: Node
      type: string
    - jsonPath: .spec.powerMode
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeActuation is one durable transition toward a declared Node
          state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeActuationSpec is one immutable durable transition request.
            properties:
              actuator:
                description: Actuator is the exact non-fixed typed target selected
                  from DeviceClass.
                properties:
                  jetsonNVPModel:
                    description: JetsonNVPModel is the target for the Jetson nvpmodel
                      actuator.
                    properties:
                      id:
                        description: ID is passed to the platform nvpmodel interface.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - id
                    type: object
                  kind:
                    description: Kind selects the typed actuator contract.
                    enum:
                    - Fixed
                    - JetsonNVPModel
                    - NvidiaLockedGPUClock
                    type: string
                  nvidiaLockedGPUClock:
                    description: NvidiaLockedGPUClock is the target for the NVIDIA
                      locked GPU clock actuator.
                    properties:
                      maxMHz:
                        description: MaxMHz is the maximum requested locked GPU clock.
                        format: int32
                        minimum: 1
                        type: integer
                      minMHz:
                        description: MinMHz is the minimum requested locked GPU clock.
                        format: int32
                        minimum: 1
                        type: integer
                      mode:
                        description: Mode selects the NVIDIA clock-locking algorithm
                          when declared.
                        enum:
                        - 0
                        - 1
                        format: int32
                        type: integer
                    required:
                    - maxMHz
                    - minMHz
                    type: object
                    x-kubernetes-validations:
                    - message: minMHz must not exceed maxMHz
                      rule: self.minMHz <= self.maxMHz
                required:
                - kind
                type: object
                x-kubernetes-validations:
                - message: NodeActuation requires a mutable actuator target
                  rule: self.kind != 'Fixed'
                - message: Fixed actuator must not declare a target
                  rule: 'self.kind == ''Fixed'' ? !has(self.jetsonNVPModel) && !has(self.nvidiaLockedGPUClock)
                    : true'
                - message: JetsonNVPModel actuator requires only jetsonNVPModel
                  rule: 'self.kind == ''JetsonNVPModel'' ? has(self.jetsonNVPModel)
                    && !has(self.nvidiaLockedGPUClock) : !has(self.jetsonNVPModel)'
                - message: NvidiaLockedGPUClock actuator requires only nvidiaLockedGPUClock
                  rule: 'self.kind == ''NvidiaLockedGPUClock'' ? has(self.nvidiaLockedGPUClock)
                    && !has(self.jetsonNVPModel) : !has(self.nvidiaLockedGPUClock)'
              deadline:
                description: Deadline is the absolute bound for reaching the settled
                  target state.
                format: date-time
                type: string
              deviceClass:
                description: DeviceClass is the frozen class used to select the actuation
                  policy.
                maxLength: 253
                minLength: 1
                type: string
              maxActuationDurationSeconds:
                description: MaxActuationDurationSeconds is the frozen total handoff
                  bound.
                format: int32
                maximum: 86400
                minimum: 2
                type: integer
              node:
                description: Node is the exact cluster-scoped Kubernetes Node identity.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              policyName:
                description: PolicyName identifies the selected configured actuation
                  policy.
                maxLength: 253
                minLength: 1
                type: string
              powerMode:
                description: PowerMode is the stable selected mode name.
                maxLength: 128
                minLength: 1
                type: string
              settlingDurationSeconds:
                description: SettlingDurationSeconds is the frozen post-verification
                  settling period.
                format: int32
                maximum: 86400
                minimum: 1
                type: integer
              stageRequestedAt:
                description: StageRequestedAt records when the transition was requested.
                format: date-time
                type: string
            required:
            - actuator
            - deadline
            - deviceClass
            - maxActuationDurationSeconds
            - node
            - policyName
            - powerMode
            - settlingDurationSeconds
            - stageRequestedAt
            type: object
            x-kubernetes-validations:
            - message: node identity is immutable
              rule: self.node == oldSelf.node
            - message: deviceClass is immutable
              rule: self.deviceClass == oldSelf.deviceClass
            - message: powerMode is immutable
              rule: self.powerMode == oldSelf.powerMode
            - message: actuator target is immutable
              rule: self.actuator == oldSelf.actuator
            - message: settlingDurationSeconds is immutable
              rule: self.settlingDurationSeconds == oldSelf.settlingDurationSeconds
            - message: maxActuationDurationSeconds is immutable
              rule: self.maxActuationDurationSeconds == oldSelf.maxActuationDurationSeconds
            - message: deadline is immutable
              rule: self.deadline == oldSelf.deadline
            - message: maxActuationDurationSeconds must exceed settlingDurationSeconds
              rule: self.maxActuationDurationSeconds > self.settlingDurationSeconds
            - message: deadline must follow stageRequestedAt
              rule: self.deadline > self.stageRequestedAt
            - message: stageRequestedAt is immutable
              rule: self.stageRequestedAt == oldSelf.stageRequestedAt
          status:
            description: NodeActuationStatus is written only by the responsible per-Node
              actuator.
            properties:
              applyStartedAt:
                format: date-time
                type: string
              lease:
                description: Lease names the Node-UID-keyed lock held for this handoff.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              message:
                maxLength: 1024
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: NodeActuationPhase is the NodeActuator-owned observed
                  lifecycle phase.
                enum:
                - Pending
                - AcquiringLease
                - CheckingSafety
                - ObservingPrevious
                - Applying
                - Verifying
                - Settling
                - Ready
                - Failed
                type: string
              previousObservation:
                description: NodeActuationObservation is one independently read typed
                  host state.
                properties:
                  actuator:
                    description: |-
                      PowerModeActuator is a discriminated union. Exactly the target matching Kind
                      is present; Fixed has no target parameters.
                    properties:
                      jetsonNVPModel:
                        description: JetsonNVPModel is the target for the Jetson nvpmodel
                          actuator.
                        properties:
                          id:
                            description: ID is passed to the platform nvpmodel interface.
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - id
                        type: object
                      kind:
                        description: Kind selects the typed actuator contract.
                        enum:
                        - Fixed
                        - JetsonNVPModel
                        - NvidiaLockedGPUClock
                        type: string
                      nvidiaLockedGPUClock:
                        description: NvidiaLockedGPUClock is the target for the NVIDIA
                          locked GPU clock actuator.
                        properties:
                          maxMHz:
                            description: MaxMHz is the maximum requested locked GPU
                              clock.
                            format: int32
                            minimum: 1
                            type: integer
                          minMHz:
                            description: MinMHz is the minimum requested locked GPU
                              clock.
                            format: int32
                            minimum: 1
                            type: integer
                          mode:
                            description: Mode selects the NVIDIA clock-locking algorithm
                              when declared.
                            enum:
                            - 0
                            - 1
                            format: int32
                            type: integer
                        required:
                        - maxMHz
                        - minMHz
                        type: object
                        x-kubernetes-validations:
                        - message: minMHz must not exceed maxMHz
                          rule: self.minMHz <= self.maxMHz
                    required:
                    - kind
                    type: object
                    x-kubernetes-validations:
                    - message: Fixed actuator must not declare a target
                      rule: 'self.kind == ''Fixed'' ? !has(self.jetsonNVPModel) &&
                        !has(self.nvidiaLockedGPUClock) : true'
                    - message: JetsonNVPModel actuator requires only jetsonNVPModel
                      rule: 'self.kind == ''JetsonNVPModel'' ? has(self.jetsonNVPModel)
                        && !has(self.nvidiaLockedGPUClock) : !has(self.jetsonNVPModel)'
                    - message: NvidiaLockedGPUClock actuator requires only nvidiaLockedGPUClock
                      rule: 'self.kind == ''NvidiaLockedGPUClock'' ? has(self.nvidiaLockedGPUClock)
                        && !has(self.jetsonNVPModel) : !has(self.nvidiaLockedGPUClock)'
                  observedAt:
                    format: date-time
                    type: string
                  powerMode:
                    description: |-
                      PowerMode is populated when the observed target maps unambiguously to a
                      stable DeviceClass mode name.
                    maxLength: 128
                    type: string
                required:
                - actuator
                - observedAt
                type: object
              readyAt:
                format: date-time
                type: string
              reason:
                maxLength: 128
                type: string
              safety:
                description: Safety is the latest fail-closed workload coexistence
                  observation.
                properties:
                  blockingPods:
                    items:
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          type: string
                        uid:
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      - uid
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - uid
                    x-kubernetes-list-type: map
                  observedAt:
                    format: date-time
                    type: string
                  verdict:
                    description: NodeActuationSafetyVerdict is the fail-closed workload
                      coexistence result.
                    enum:
                    - Allowed
                    - Blocked
                    type: string
                required:
                - observedAt
                - verdict
                type: object
                x-kubernetes-validations:
                - message: Blocked safety requires blockingPods and Allowed safety
                    forbids them
                  rule: 'self.verdict == ''Allowed'' ? !has(self.blockingPods) ||
                    size(self.blockingPods) == 0 : has(self.blockingPods) && size(self.blockingPods)
                    > 0'
              settlingStartedAt:
                format: date-time
                type: string
              targetObservation:
                description: NodeActuationObservation is one independently read typed
                  host state.
                properties:
                  actuator:
                    description: |-
                      PowerModeActuator is a discriminated union. Exactly the target matching Kind
                      is present; Fixed has no target parameters.
                    properties:
                      jetsonNVPModel:
                        description: JetsonNVPModel is the target for the Jetson nvpmodel
                          actuator.
                        properties:
                          id:
                            description: ID is passed to the platform nvpmodel interface.
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - id
                        type: object
                      kind:
                        description: Kind selects the typed actuator contract.
                        enum:
                        - Fixed
                        - JetsonNVPModel
                        - NvidiaLockedGPUClock
                        type: string
                      nvidiaLockedGPUClock:
                        description: NvidiaLockedGPUClock is the target for the NVIDIA
                          locked GPU clock actuator.
                        properties:
                          maxMHz:
                            description: MaxMHz is the maximum requested locked GPU
                              clock.
                            format: int32
                            minimum: 1
                            type: integer
                          minMHz:
                            description: MinMHz is the minimum requested locked GPU
                              clock.
                            format: int32
                            minimum: 1
                            type: integer
                          mode:
                            description: Mode selects the NVIDIA clock-locking algorithm
                              when declared.
                            enum:
                            - 0
                            - 1
                            format: int32
                            type: integer
                        required:
                        - maxMHz
                        - minMHz
                        type: object
                        x-kubernetes-validations:
                        - message: minMHz must not exceed maxMHz
                          rule: self.minMHz <= self.maxMHz
                    required:
                    - kind
                    type: object
                    x-kubernetes-validations:
                    - message: Fixed actuator must not declare a target
                      rule: 'self.kind == ''Fixed'' ? !has(self.jetsonNVPModel) &&
                        !has(self.nvidiaLockedGPUClock) : true'
                    - message: JetsonNVPModel actuator requires only jetsonNVPModel
                      rule: 'self.kind == ''JetsonNVPModel'' ? has(self.jetsonNVPModel)
                        && !has(self.nvidiaLockedGPUClock) : !has(self.jetsonNVPModel)'
                    - message: NvidiaLockedGPUClock actuator requires only nvidiaLockedGPUClock
                      rule: 'self.kind == ''NvidiaLockedGPUClock'' ? has(self.nvidiaLockedGPUClock)
                        && !has(self.jetsonNVPModel) : !has(self.nvidiaLockedGPUClock)'
                  observedAt:
                    format: date-time
                    type: string
                  powerMode:
                    description: |-
                      PowerMode is populated when the observed target maps unambiguously to a
                      stable DeviceClass mode name.
                    maxLength: 128
                    type: string
                required:
                - actuator
                - observedAt
                type: object
              terminalFailure:
                description: TerminalFailure records the single terminal failure outcome.
                properties:
                  message:
                    maxLength: 1024
                    minLength: 1
                    type: string
                  occurredAt:
                    format: date-time
                    type: string
                  reason:
                    maxLength: 128
                    minLength: 1
                    type: string
                  stage:
                    description: NodeActuationFailureStage identifies the operation
                      that failed terminally.
                    enum:
                    - Lease
                    - Policy
                    - Safety
                    - ObservePrevious
                    - Apply
                    - Verify
                    - Settle
                    type: string
                required:
                - message
                - occurredAt
                - reason
                - stage
                type: object
              transitionCost:
                description: |-
                  TransitionCost records Node-clock duration only after a state change
                  reaches Ready.
                properties:
                  applyAndReadBackMilliseconds:
                    description: |-
                      ApplyAndReadBackMilliseconds measures from the durable pre-mutation fence
                      through independent target read-back and entry into settling. It is
                      controller-path cost, not a device-only measurement: it includes two
                      edge-to-control-plane round trips and two nvpmodel invocations in addition
                      to the device change.
                    format: int64
                    type: integer
                  endToEndMilliseconds:
                    description: |-
                      EndToEndMilliseconds measures from the durable pre-mutation apply fence
                      through terminal Ready.
                    format: int64
                    type: integer
                  settlingMilliseconds:
                    description: |-
                      SettlingMilliseconds measures from the recorded settling start through
                      terminal Ready.
                    format: int64
                    type: integer
                required:
                - applyAndReadBackMilliseconds
                - endToEndMilliseconds
                - settlingMilliseconds
                type: object
              verifiedAt:
                format: date-time
                type: string
            type: object
            x-kubernetes-validations:
            - message: terminalFailure is valid only after failure
              rule: '!has(self.terminalFailure) || has(self.phase) && self.phase ==
                ''Failed'''
            - message: Failed phase requires terminalFailure
              rule: '!has(self.phase) || self.phase != ''Failed'' || has(self.terminalFailure)'
            - message: Ready phase requires previous and target observations plus
                readyAt
              rule: '!has(self.phase) || self.phase != ''Ready'' || has(self.previousObservation)
                && has(self.targetObservation) && has(self.readyAt)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
