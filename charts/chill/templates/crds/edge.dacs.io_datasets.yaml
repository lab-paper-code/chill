{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
    helm.sh/resource-policy: keep
  name: datasets.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: Dataset
    listKind: DatasetList
    plural: datasets
    singular: dataset
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Dataset is the Schema for the datasets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DatasetSpec declares a record carrier and its record fields.
              Records live in <path>/profiling/<recordID>/<field> and <path>/evaluation/<recordID>/<field>.
            properties:
              fields:
                description: Fields declares every record field.
                items:
                  description: RawField declares one size-bounded raw field.
                  properties:
                    format:
                      description: Format is the field content format.
                      enum:
                      - JPEG
                      - UTF8
                      type: string
                    maxBytes:
                      description: MaxBytes is the inclusive upper bound of the field
                        size.
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      minLength: 1
                      type: string
                  required:
                  - format
                  - maxBytes
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              source:
                description: DatasetSource identifies one exact multi-architecture
                  record carrier and its in-container directory.
                properties:
                  image:
                    description: Image is an immutable multi-architecture OCI image
                      index reference.
                    minLength: 1
                    type: string
                  path:
                    description: Path is the clean absolute directory containing the
                      profiling and evaluation subsets.
                    pattern: ^/[A-Za-z0-9._/-]+$
                    type: string
                required:
                - image
                - path
                type: object
            required:
            - fields
            - source
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
{{- end }}
