{{- if .Values.servingEntrypoint.enabled }}
{{- $name := include "chill.servingEntrypointName" . -}}
{{- $servingNamespace := default .Release.Namespace .Values.servingEntrypoint.namespace -}}
{{- $profileNamespaces := default (list $servingNamespace) .Values.servingEntrypoint.profileNamespaces -}}
{{- $actuationNamespace := default .Release.Namespace .Values.servingEntrypoint.actuationNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- include "chill.labels" . | nindent 4 }}
rules:
  # Check cross-namespace shared evidence references before destructive cleanup.
  # This owner-only grant never permits mutation outside profileNamespaces.
  - apiGroups: [edge.dacs.io]
    resources: [batchenergyoptimizations, profilingruns, modelloadedidlebaselines, powermodetransitioncosts, operationcostmeasurements, dispatchoccupancymeasurements]
    verbs: [list]
  - apiGroups: [edge.dacs.io]
    resources: [modelspecs, preprocessors, datasets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [edge.dacs.io]
    resources: [workloads]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [edge.dacs.io]
    resources: [workloads/status]
    verbs: [update]
  - apiGroups: [edge.dacs.io]
    resources: [workloads/finalizers]
    verbs: [update]
  - apiGroups: [edge.dacs.io]
    resources: [deviceclasses]
    verbs: [list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  {{- if .Values.servingEntrypoint.scheduler.configMap }}
  # The budget includes non-serving Pods on every candidate Node.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  {{- end }}
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $servingNamespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Hand-back lists the transition-cost runner Services of a measured Node.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, delete]
  {{- if .Values.servingEntrypoint.scheduler.configMap }}
  - apiGroups: [""]
    resources: [services]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Values.servingEntrypoint.scheduler.configMap | quote }}]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $servingNamespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
{{- $actuationRole := printf "%s-actuation" $name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $actuationRole }}
  namespace: {{ $actuationNamespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [nodeactuations]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $actuationRole }}
  namespace: {{ $actuationNamespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $actuationRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.profiler.enabled }}
{{- $factsRole := printf "%s-profiler-facts" $name }}
---
# Power requests and wall meters are derived from the Profiler facts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $factsRole }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "chill.profilerFactSourceName" . | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $factsRole }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $factsRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- $profileRole := printf "%s-profiles" $name }}
{{- range $namespace := $profileNamespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $profileRole }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chill.labels" $ | nindent 4 }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [batchenergyoptimizations]
    verbs: [get, list, create, delete]
  - apiGroups: [edge.dacs.io]
    resources: [profilingruns]
    verbs: [get]
  # ChillServer admits measurements by annotating them.
  - apiGroups: [edge.dacs.io]
    resources: [batchenergyoptimizations, profilingruns, modelloadedidlebaselines, powermodetransitioncosts, operationcostmeasurements, dispatchoccupancymeasurements]
    verbs: [patch]
  # ChillServer is the only writer of the measurements it runs.
  - apiGroups: [edge.dacs.io]
    resources: [operationcostmeasurements/status, dispatchoccupancymeasurements/status]
    verbs: [patch]
  # Admission and hand-back wait for the power changes measurements request here.
  - apiGroups: [edge.dacs.io]
    resources: [nodeactuations]
    verbs: [list]
  # Power mode transition cost preparations are owned ConfigMaps named after the measurement.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $profileRole }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chill.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $profileRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Unbound caller grants use /chill to exclude Kubernetes' public /api/* discovery grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-serving-manager
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/chill/api/v1/models", "/chill/api/v1/models/*", "/chill/api/v1/preprocessors", "/chill/api/v1/preprocessors/*", "/chill/api/v1/datasets", "/chill/api/v1/datasets/*", "/chill/api/v1/workloads", "/chill/api/v1/workloads/*"]
    verbs: [get, post, put, delete]
  - nonResourceURLs: ["/chill/api/v1/pools", "/chill/api/v1/pools/*", "/chill/api/v1/observations/workloads/*", "/chill/api/v1/observations/load", "/chill/api/v1/observations/scheduler", "/chill/api/v1/observations/power"]
    verbs: [get]
  - nonResourceURLs: ["/chill/api/v1/systems", "/chill/api/v1/inventory"]
    verbs: [get]
  - nonResourceURLs: ["/chill/api/v1/scheduler", "/chill/api/v1/scheduler/settings", "/chill/api/v1/scheduler/state", "/chill/api/v1/scheduler/profiles", "/chill/api/v1/scheduler/capacity"]
    verbs: [get]
  {{- range $namespace := $profileNamespaces | uniq | sortAlpha }}
  - nonResourceURLs:
      - {{ printf "/chill/api/v1/namespaces/%s/batch-energy-optimizations" $namespace | quote }}
      - {{ printf "/chill/api/v1/namespaces/%s/batch-energy-optimizations/*" $namespace | quote }}
      - {{ printf "/chill/api/v1/namespaces/%s/profiling-runs" $namespace | quote }}
      - {{ printf "/chill/api/v1/namespaces/%s/profiling-runs/*" $namespace | quote }}
    verbs: [get]
  - nonResourceURLs:
      - {{ printf "/chill/api/v1/namespaces/%s/batch-energy-optimizations" $namespace | quote }}
      - {{ printf "/chill/api/v1/namespaces/%s/batch-energy-optimizations/preflight" $namespace | quote }}
    verbs: [post]
  - nonResourceURLs:
      - {{ printf "/chill/api/v1/namespaces/%s/batch-energy-optimizations/*" $namespace | quote }}
    verbs: [delete]
  {{- end }}
{{- range $namespace := $profileNamespaces | uniq | sortAlpha }}
---
# Native caller rights are deliberately unbound and separate from the owner SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.fullname" $ }}-serving-manager
  namespace: {{ $namespace }}
  labels:
    {{- include "chill.labels" $ | nindent 4 }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [batchenergyoptimizations]
    verbs: [get, list, create, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-scheduler-editor
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/chill/api/v1/scheduler/settings"]
    verbs: [put]
  - nonResourceURLs: ["/chill/api/v1/scheduler/operations"]
    verbs: [post]
{{- if .Values.servingEntrypoint.scheduler.configMap }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.fullname" . }}-scheduler-editor
  namespace: {{ $servingNamespace }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Values.servingEntrypoint.scheduler.configMap | quote }}]
    verbs: [update]
{{- end }}
{{- end }}
