{{- if and .Values.servingEntrypoint.enabled .Values.servingEntrypoint.scheduler.configMap }}
{{- $root := . }}
{{- $owner := include "chill.servingEntrypointName" . }}
{{- range $index, $source := .Values.servingEntrypoint.scheduler.powerCostSources }}
{{- $name := printf "%s-power-cost-%d" $owner $index }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ required "scheduler powerCostSources namespace is required" $source.namespace | quote }}
  labels:
    {{- include "chill.labels" $root | nindent 4 }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [powermodetransitioncosts]
    resourceNames: [{{ required "scheduler powerCostSources name is required" $source.name | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $source.name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $source.namespace | quote }}
  labels:
    {{- include "chill.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $owner }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
