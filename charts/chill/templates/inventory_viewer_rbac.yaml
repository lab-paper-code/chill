apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-inventory-viewer
  labels:
    app.kubernetes.io/component: operator-console
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - edge.dacs.io
    resources:
      - deviceclasses
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
