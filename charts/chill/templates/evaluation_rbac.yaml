{{- if .Values.evaluation.enabled }}
{{- range $name := list .Values.evaluation.config.actionServiceAccount .Values.evaluation.config.publishServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "chill.labels" $ | nindent 4 }}
automountServiceAccountToken: {{ eq $name $.Values.evaluation.config.actionServiceAccount }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chill-evaluation-action
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [edge.dacs.io]
    resources: [loadscenarios]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [edge.dacs.io]
    resources: [evaluationstages/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chill-evaluation-action
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chill-evaluation-action
subjects:
  - kind: ServiceAccount
    name: {{ .Values.evaluation.config.actionServiceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-evaluation-action
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [edge.dacs.io]
    resources: [workloads, preprocessors, datasets]
    verbs: [get]
  # Same public operator routes whether ChillServer is local or externally provisioned.
  - nonResourceURLs: ["/chill/api/v1/workloads", "/chill/api/v1/workloads/*", "/chill/api/v1/scheduler", "/chill/api/v1/scheduler/settings", "/chill/api/v1/observations/power", "/chill/api/v1/observations/raw", "/chill/api/v1/observations/raw/*"]
    verbs: [get]
  - nonResourceURLs: ["/chill/api/v1/scheduler/settings"]
    verbs: [put]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.fullname" . }}-evaluation-action
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.fullname" . }}-evaluation-action
subjects:
  - kind: ServiceAccount
    name: {{ .Values.evaluation.config.actionServiceAccount }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.servingEntrypoint.enabled }}
{{- if .Values.servingEntrypoint.scheduler.configMap }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chill.fullname" . }}-evaluation-settings-writer
  namespace: {{ default .Release.Namespace .Values.servingEntrypoint.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chill.fullname" . }}-scheduler-editor
subjects:
  - kind: ServiceAccount
    name: {{ .Values.evaluation.config.actionServiceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.profiler.enabled }}
{{- /* The Profiler always registers the evaluation reconcilers, so its informers need watch rights even while evaluation is disabled. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation-watch
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [evaluationruns, evaluationstages, loadscenarios]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation-watch
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chill.profilerName" . }}-evaluation-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.evaluation.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [edge.dacs.io]
    resources: [evaluationstages]
    verbs: [create]
  - apiGroups: [edge.dacs.io]
    resources: [evaluationruns, evaluationstages]
    verbs: [patch]
  - apiGroups: [edge.dacs.io]
    resources: [evaluationruns/status, evaluationstages/status]
    verbs: [get, patch, update]
  - apiGroups: [edge.dacs.io]
    resources: [evaluationruns/finalizers, evaluationstages/finalizers]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  # Existing profiler Role supplies Job, ConfigMap, Secret and leader Lease rights.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chill.profilerName" . }}-evaluation
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation
rules:
  # Fault selection uses live Kubernetes Nodes, never scheduler snapshots.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chill.profilerName" . }}-evaluation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chill.profilerName" . }}-evaluation
subjects:
  - kind: ServiceAccount
    name: {{ include "chill.profilerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
