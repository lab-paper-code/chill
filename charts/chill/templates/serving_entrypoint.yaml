{{- if .Values.servingEntrypoint.enabled }}
{{- $name := include "chill.servingEntrypointName" . -}}
{{- $labels := include "chill.labels" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
data:
  routes.yaml: |
    {{- dict "models" .Values.servingEntrypoint.routes | toYaml | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.servingEntrypoint.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chill.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: serving-entrypoint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chill.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: serving-entrypoint
      annotations:
        checksum/routes: {{ dict "models" .Values.servingEntrypoint.routes | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
{{- toYaml .Values.servingEntrypoint.podSecurityContext | nindent 8 }}
      containers:
        - name: serving-entrypoint
          image: {{ include "chill.servingEntrypointImage" . | quote }}
          imagePullPolicy: {{ .Values.servingEntrypoint.image.pullPolicy }}
          args:
            - {{ printf "--bind-address=:%v" .Values.servingEntrypoint.port | quote }}
            - "--routes=/etc/chill/serving/routes.yaml"
            - {{ printf "--serving-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--serving-port=%v" .Values.servingEntrypoint.servingPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.servingEntrypoint.port }}
              protocol: TCP
          resources:
{{- toYaml .Values.servingEntrypoint.resources | nindent 12 }}
          securityContext:
{{- toYaml .Values.servingEntrypoint.securityContext | nindent 12 }}
          volumeMounts:
            - name: routes
              mountPath: /etc/chill/serving
              readOnly: true
      volumes:
        - name: routes
          configMap:
            name: {{ $name }}
      nodeSelector:
{{- toYaml .Values.servingEntrypoint.nodeSelector | nindent 8 }}
      {{- with .Values.servingEntrypoint.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
{{- toYaml .Values.servingEntrypoint.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
spec:
  type: {{ .Values.servingEntrypoint.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "chill.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: serving-entrypoint
  ports:
    - name: http
      port: {{ .Values.servingEntrypoint.port }}
      targetPort: http
      protocol: TCP
{{- end }}
