{{- if .Values.servingEntrypoint.enabled }}
{{- $name := include "chill.servingEntrypointName" . -}}
{{- $labels := include "chill.labels" . -}}
{{- $servingNamespace := default .Release.Namespace .Values.servingEntrypoint.namespace -}}
{{- $profileNamespaces := default (list $servingNamespace) .Values.servingEntrypoint.profileNamespaces -}}
{{- $storeName := default (printf "%s-evidence-store" (include "chill.systemName" .)) .Values.evidenceStore.connection.name -}}
{{- $storeEndpoint := default (printf "http://%s-evidence-store.%s.svc.cluster.local:9000" (include "chill.systemName" .) .Release.Namespace) .Values.evidenceStore.connection.endpoint -}}
{{- $credentialsSecret := default (printf "%s-evidence-store-credentials" (include "chill.systemName" .)) .Values.evidenceStore.credentialsSecret.name -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.servingEntrypoint.observationStorage.storageClassName nil }}
  storageClassName: {{ .Values.servingEntrypoint.observationStorage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.servingEntrypoint.observationStorage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chill.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: serving-entrypoint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chill.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: serving-entrypoint
        edge.dacs.io/workload-role: system
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.servingEntrypoint.terminationGracePeriodSeconds }}
      securityContext:
{{- toYaml .Values.servingEntrypoint.podSecurityContext | nindent 8 }}
      containers:
        - name: serving-entrypoint
          image: {{ include "chill.servingEntrypointImage" . | quote }}
          imagePullPolicy: {{ .Values.servingEntrypoint.image.pullPolicy }}
          args:
            - {{ printf "--bind-address=:%v" .Values.servingEntrypoint.port | quote }}
            - {{ printf "--serving-namespace=%s" $servingNamespace | quote }}
            {{- with .Values.servingEntrypoint.scheduler.configMap }}
            - {{ printf "--serving-scheduler-configmap=%s" . | quote }}
            - {{ printf "--serving-scheduler-config-key=%s" $.Values.servingEntrypoint.scheduler.key | quote }}
            {{- end }}
            {{- if .Values.profiler.enabled }}
            # Power requests come from the DeviceClass modes the Profiler has policies for.
            - {{ printf "--profiler-facts-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--profiler-facts-configmap=%s" (include "chill.profilerFactSourceName" .) | quote }}
            - {{ printf "--actuation-policies-key=%s" .Values.profiler.factSource.actuationPoliciesKey | quote }}
            - {{ printf "--metric-sources-key=%s" .Values.profiler.factSource.metricSourcesKey | quote }}
            {{- end }}
            - "--tls-cert=/etc/chill/tls/tls.crt"
            - "--tls-key=/etc/chill/tls/tls.key"
            - {{ printf "--observation-directory=%s" .Values.servingEntrypoint.observationStorage.directory | quote }}
            {{- with .Values.servingEntrypoint.diagnostic }}
            {{- if .directory }}
            - {{ printf "--diagnostic-directory=%s" .directory | quote }}
            - {{ printf "--diagnostic-start-delay=%s" .startDelay | quote }}
            - {{ printf "--diagnostic-trace-offset=%s" .traceOffset | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.console.enabled }}
            - {{ printf "--console-url=http://%s.%s.svc.cluster.local:%v" (include "chill.consoleName" .) .Release.Namespace .Values.console.port | quote }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - {{ printf "--dashboard-url=http://%s.%s.svc.cluster.local:%v" (include "chill.dashboardName" .) .Release.Namespace .Values.dashboard.port | quote }}
            {{- end }}
            - {{ printf "--store-name=%s" $storeName | quote }}
            - {{ printf "--store-endpoint=%s" $storeEndpoint | quote }}
            - {{ printf "--store-bucket=%s" .Values.evidenceStore.connection.bucket | quote }}
            - {{ printf "--store-region=%s" .Values.evidenceStore.connection.region | quote }}
            - {{ printf "--store-credentials-secret=%s" $credentialsSecret | quote }}
            - {{ printf "--queue-limit=%s" (.Values.servingEntrypoint.queueLimit | toJson) | quote }}
            - {{ printf "--request-timeout=%s" .Values.servingEntrypoint.requestTimeout | quote }}
            - {{ printf "--drain-timeout=%s" .Values.servingEntrypoint.drainTimeout | quote }}
            - {{ printf "--source-interval=%s" .Values.servingEntrypoint.sourceInterval | quote }}
            - {{ printf "--profile-interval=%s" .Values.servingEntrypoint.profileInterval | quote }}
            - {{ printf "--profile-confidence-level=%v" .Values.servingEntrypoint.profileConfidenceLevel | quote }}
            - {{ printf "--max-request-bytes=%s" (.Values.servingEntrypoint.maxRequestBytes | toJson) | quote }}
            - {{ printf "--max-evidence-bytes=%s" (.Values.servingEntrypoint.maxEvidenceBytes | toJson) | quote }}
            {{- range .Values.servingEntrypoint.observationDefinitions }}
            - {{ printf "--observation-definition=%s" . | quote }}
            {{- end }}
            {{- range .Values.servingEntrypoint.observationOutcomes }}
            - {{ printf "--observation-outcome=%s" . | quote }}
            {{- end }}
            - {{ printf "--max-query-events=%s" (.Values.servingEntrypoint.maxQueryEvents | toJson) | quote }}
            {{- range $profileNamespaces }}
            - {{ printf "--profile-namespace=%s" . | quote }}
            {{- end }}
            - {{ printf "--kube-api-qps=%v" .Values.servingEntrypoint.kubeAPI.qps | quote }}
            - {{ printf "--kube-api-burst=%v" .Values.servingEntrypoint.kubeAPI.burst | quote }}
            {{- with .Values.servingEntrypoint.kubeAPI.apiServer }}
            - {{ printf "--kube-api-server=%s" . | quote }}
            {{- end }}
            {{- with .Values.servingEntrypoint.kubeAPI.tokenFile }}
            - {{ printf "--kube-token-file=%s" . | quote }}
            {{- end }}
            {{- with .Values.servingEntrypoint.kubeAPI.caFile }}
            - {{ printf "--kube-ca-file=%s" . | quote }}
            {{- end }}
            - {{ printf "--load-generator-image=%s:%s" .Values.loadGenerator.image.repository (default .Chart.AppVersion .Values.loadGenerator.image.tag) | quote }}
            - {{ printf "--load-generator-service-account=%s-load-generator" (include "chill.fullname" .) | quote }}
            - {{ printf "--load-generator-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--load-generator-endpoint=https://%s.%s.svc:%v" $name .Release.Namespace .Values.servingEntrypoint.port | quote }}
            - {{ printf "--load-generator-ca-secret=%s" .Values.servingEntrypoint.tls.secretName | quote }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Go 1.22 sizes GOMAXPROCS from host cores; κ capacity rows run GOMAXPROCS-parallel.
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
            # Go soft memory limit below resources.limits.memory; the overload guard compares the live heap against it.
            - name: GOMEMLIMIT
              value: {{ required "servingEntrypoint.goMemLimit is required" .Values.servingEntrypoint.goMemLimit | quote }}
            {{- with .Values.servingEntrypoint.goDebug }}
            - name: GODEBUG
              value: {{ . | quote }}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecret }}
                  key: {{ .Values.evidenceStore.credentialsSecret.accessKeyKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecret }}
                  key: {{ .Values.evidenceStore.credentialsSecret.secretKeyKey | quote }}
            {{- with .Values.evidenceStore.credentialsSecret.sessionTokenKey }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecret }}
                  key: {{ . | quote }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.servingEntrypoint.port }}
              protocol: TCP
          resources:
{{- toYaml .Values.servingEntrypoint.resources | nindent 12 }}
          securityContext:
{{- toYaml .Values.servingEntrypoint.securityContext | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/chill/tls
              readOnly: true
            - name: observations
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.servingEntrypoint.tls.secretName | quote }}
        - name: observations
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
      nodeSelector:
{{- toYaml .Values.servingEntrypoint.nodeSelector | nindent 8 }}
      {{- with .Values.servingEntrypoint.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
{{- toYaml .Values.servingEntrypoint.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: serving-entrypoint
    {{- $labels | nindent 4 }}
spec:
  type: {{ .Values.servingEntrypoint.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "chill.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: serving-entrypoint
  ports:
    - name: https
      port: {{ .Values.servingEntrypoint.port }}
      targetPort: https
      protocol: TCP
{{- end }}
