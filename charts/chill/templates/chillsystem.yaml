{{- if .Values.system.enabled }}
apiVersion: edge.dacs.io/v1alpha1
kind: ChillSystem
metadata:
  name: {{ include "chill.systemName" . }}
  labels:
    {{- include "chill.labels" . | nindent 4 }}
spec:
  managementNamespace: {{ .Release.Namespace | quote }}
  nodeAgent:
    enabled: {{ .Values.nodeAgent.enabled }}
    actuation: {{ .Values.nodeAgent.actuation.enabled }}
    {{- if .Values.nodeAgent.enabled }}
    configRef:
      name: {{ include "chill.nodeAgentConfigName" . | quote }}
    {{- end }}
  profiler:
    enabled: {{ .Values.profiler.enabled }}
    {{- if .Values.profiler.enabled }}
    configRef:
      name: {{ include "chill.profilerConfigName" . | quote }}
    {{- end }}
  evidenceStore:
    enabled: {{ .Values.evidenceStore.enabled }}
    {{- if .Values.evidenceStore.enabled }}
    configRef:
      name: {{ .Values.evidenceStore.configRef.name | quote }}
    {{- end }}
  deviceDiscovery:
    enabled: {{ .Values.discovery.enabled }}
    labelKey: {{ .Values.discovery.labelKey | quote }}
    overwriteManualLabels: {{ .Values.discovery.overwriteManualLabels }}
    nodeLabelSelector: {{ include "chill.discoveryNodeLabelSelector" . | quote }}
    requireCatalogMatch: {{ .Values.discovery.requireCatalogMatch }}
    {{- with .Values.discovery.fallbackPowerModes }}
    fallbackPowerModes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    catalog:
      namespace: {{ .Release.Namespace | quote }}
      name: {{ include "chill.discoveryCatalogName" . | quote }}
      key: {{ include "chill.discoveryCatalogKey" . | quote }}
{{- end }}
