apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-console-viewer
  labels:
    app.kubernetes.io/component: operator-console
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - edge.dacs.io
    resources:
      - chillsystems
      - deviceclasses
      - modelspecs
      - profilingruns
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - {{ printf "%s:http" (include "chill.consoleName" .) }}
    verbs:
      - get
