apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chill.fullname" . }}-console-viewer
  labels:
    app.kubernetes.io/component: operator-console
    {{- include "chill.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - edge.dacs.io
    resources:
      - chillsystems
      - deviceclasses
      - modelspecs
      - profilingruns
      - batchenergyoptimizations
    verbs:
      - get
      - list
  # Curve-plan preflight resolves these cluster-scoped candidate inputs by name.
  - apiGroups:
      - edge.dacs.io
    resources:
      - preprocessors
      - datasets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - {{ printf "%s:http" (include "chill.consoleName" .) }}
    verbs:
      - get
  - nonResourceURLs:
      - {{ printf "/chill/api/v1/namespaces/%s/measurement-coverage" .Release.Namespace | quote }}
    verbs:
      - get
