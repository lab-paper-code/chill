# Opt-in Profiler facts for the current CHILL testbed arm64 execution paths.
# The runtime, artifact, and observer images are runnable arm64 child manifests;
# Node-specific metric sources remain explicit entries in the same frozen facts.
#
# The Operator image is pinned here even though this file is about Profiler
# facts. Applying this file without that pin resolves the chart default
# daclab/chill-operator, which rolls the cluster back to a published release
# that predates the Profiler and Evidence Store operands. The rolled-back
# Operator still runs, so the symptom is a missing EvidenceStoreAvailable
# condition rather than a missing Pod.
operator:
  image:
    repository: "155.230.35.213:5000/chill/chill-operator"
    tag: "sha-643e9b5"
    pullPolicy: Always

# Pin Node discovery here because an unpinned operand silently resolves the
# published image from the chart default.
nodeDiscovery:
  image:
    repository: "155.230.35.213:5000/chill/chill-node-discovery"
    tag: "sha-643e9b5"
    pullPolicy: Always

evidenceStore:
  enabled: true
  configRef:
    name: chill-evidence-store-config

# The Node actuator is pinned and enabled here for the same reason as the
# Operator above: this file is the only committed description of the testbed,
# and applying it without this block leaves the chart default
# nodeActuator.enabled=false. The AGX Orin actuated rows then become
# unreachable, and the failure is silent because every other operand stays
# healthy. The DaemonSet still lands only on Nodes carrying the
# edge.dacs.io/node-actuation=enabled opt-in label.
nodeActuator:
  enabled: true
  image:
    repository: "155.230.35.213:5000/chill/chill-node-actuator"
    tag: "sha-643e9b5"
    pullPolicy: Always
  # Every actuatable Node in this testbed is a KubeEdge edge Node carrying
  # node-role.kubernetes.io/edge:NoSchedule. The chart default
  # nodeActuator.tolerations is empty, which silently yields a DaemonSet with
  # DESIRED=0 rather than a scheduling error, so the toleration is explicit here.
  tolerations:
    - key: node-role.kubernetes.io/edge
      operator: Exists
      effect: NoSchedule
  # The workload-safety adapter is fail-closed: any Pod on the target Node
  # outside these namespaces blocks Node-wide actuation. The chart default is
  # kube-system alone, which no KubeEdge edge Node can ever satisfy — each one
  # permanently runs edgemesh-agent and edge-eclipse-mosquitto, the monitoring
  # DaemonSets, and CHILL's own node-discovery. Note that
  # edge-metrics-exporter-jetson lives in monitoring: without that namespace the
  # Node cannot be actuated without also refusing the exporter that supplies the
  # power metric being measured.
  allowedNamespaces:
    - kube-system
    - kubeedge
    - monitoring
    - chill-system

profiler:
  enabled: true
  image:
    repository: "155.230.35.213:5000/chill/chill-profiler"
    tag: "sha-2afadbe"
    pullPolicy: Always
  transitionObserver:
    observerNodeName: genesis1

profiling:
  metricObserverImage: "155.230.35.213:5000/chill/chill-metric-observer-arm64@sha256:b0f57109e39f30066745b23c0547093d3ed040e2439177281f968c6745b5b4ba"
  workloadObserverImage: "155.230.35.213:5000/chill/chill-workload-observer-arm64@sha256:bf0bc04bad6c2981e371e9471cae1ce054764b0b47091321ec8a8b0f45f398ea"
  executionDeclarations:
    - modelSpec: mobilenet-v2-050
      deviceClass: raspberry-pi-5-8g
      executionPath: ort-cpu
      runtime:
        payload: '{"architecture":"arm64","image":"155.230.35.213:5000/chill/chill-measurement-worker@sha256:b1b75a644ecd5240284019d9b2f4a7a2f2793decc22ccbaab68de408225c2062","runtime":{"backends":["CPUExecutionProvider"],"family":"onnxruntime"},"schemaVersion":"chill.dacs.io/runtime-declaration.v1alpha2","verification":"exact-image-runtime-inspection-v1"}'
      artifact:
