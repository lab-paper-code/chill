nodeDiscovery:
  enabled: true
  hostNetwork: true
  configMapKey: config.yaml
  interval: 10m
  hostRoot: /host
  signatureFile: /etc/chill/node-discovery/signatures.yaml
  kubernetesClient:
    apiServer: ""
    discoverFromDefaultEndpoint: true
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  sources:
    - paths:
        - proc/device-tree/model
        - sys/firmware/devicetree/base/model
    - paths:
        - proc/device-tree/compatible
        - sys/firmware/devicetree/base/compatible
    - paths:
        - etc/nv_tegra_release
    - paths:
        - sys/devices/virtual/dmi/id/sys_vendor
        - sys/class/dmi/id/sys_vendor
    - paths:
        - sys/devices/virtual/dmi/id/product_name
        - sys/class/dmi/id/product_name
  signatures:
    - contains: ["nvidia jetson", "orin nano"]
      facts:
        vendor: nvidia
        family: jetson
        model: orin-nano
        accelerator: nvidia-jetson-orin-nano
    - contains: ["agx orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: agx-orin
        accelerator: nvidia-jetson-agx-orin
    - contains: ["nvidia jetson", "agx orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: agx-orin
        accelerator: nvidia-jetson-agx-orin
    - contains: ["xavier nx"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier-nx
        accelerator: nvidia-jetson-xavier-nx
    - contains: ["nvidia jetson", "xavier nx"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier-nx
        accelerator: nvidia-jetson-xavier-nx
    - contains: ["jetson nano"]
      facts:
        vendor: nvidia
        family: jetson
        model: jetson-nano
        accelerator: nvidia-jetson-nano
    - contains: ["nvidia jetson", "orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: orin
        accelerator: nvidia-jetson-orin
    - contains: ["nvidia jetson", "xavier"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier
        accelerator: nvidia-jetson-xavier
    - contains: ["nv_tegra"]
      facts:
        vendor: nvidia
        family: jetson
        model: jetson
        accelerator: nvidia-jetson
    - contains: ["raspberry pi 5"]
      facts:
        vendor: raspberrypi
        family: raspberry-pi
        model: raspberry-pi-5
        accelerator: none
    - contains: ["orange pi 5 plus"]
      facts:
        vendor: xunlong
        family: orangepi
        model: orange-pi-5-plus
        accelerator: rk3588-npu
    - contains: ["lattepanda 3 delta"]
      facts:
        vendor: lattepanda
        family: lattepanda
        model: lattepanda-3-delta
        accelerator: none
    - contains: ["gigabyte technology", "z370 aorus gaming 7"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z370-aorus-gaming-7
        accelerator: nvidia-geforce-rtx-2080-ti
    - contains: ["gigabyte technology", "z370 aorus gaming 3"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z370-aorus-gaming-3
        accelerator: nvidia-geforce-rtx-2080-ti
    - contains: ["gigabyte technology", "z390 gaming x"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z390-gaming-x
        accelerator: nvidia-geforce-rtx-2080-ti
  image:
    repository: daclab/chill-node-discovery
    tag: ""
    pullPolicy: IfNotPresent
  nodeSelector: {}
  excludeNodeNames: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "100%"
  hostPaths:
    - name: host-proc
      hostPath: /proc
      mountPath: /proc
    - name: host-sys
      hostPath: /sys
      mountPath: /sys
    - name: host-etc
      hostPath: /etc
      mountPath: /etc
  tolerations:
    - key: node-role.kubernetes.io/edge
      operator: Exists
      effect: NoSchedule
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    name: ""
