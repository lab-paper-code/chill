          edge.dacs.io/device-vendor: raspberrypi
          edge.dacs.io/device-family: raspberry-pi
          edge.dacs.io/device-model: raspberry-pi-5
        architecture: arm64
        memory: 8Gi
        accelerator: none
        powerModes:
          - name: fixed
            actuator: {kind: Fixed}
      - name: lattepanda-3-delta-8g
        matchLabels:
          edge.dacs.io/device-vendor: lattepanda
          edge.dacs.io/device-family: lattepanda
          edge.dacs.io/device-model: lattepanda-3-delta
        architecture: amd64
        memory: 8Gi
        accelerator: none
        powerModes:
          - name: fixed
            actuator: {kind: Fixed}
      - name: edge-server-rtx-2080-ti-64g
        matchLabels:
          edge.dacs.io/device-family: edge-server
          edge.dacs.io/accelerator: nvidia-geforce-rtx-2080-ti
        architecture: amd64
        memory: 64Gi
        accelerator: nvidia-geforce-rtx-2080-ti
        powerModes:
          - name: fixed
            actuator: {kind: Fixed}

# One node-agent image runs two DaemonSets. The agent on every Node publishes
# hardware signature and online-CPU metadata without privilege. The actuation
# agent applies the power mode the chill.dacs.io/power-mode Node label names on
# the Nodes selected by the nodeSelector of each DeviceClass named in
# powerActuation.policies.
nodeAgent:
  enabled: true
  hostNetwork: true
  # Online CPUs follow a power mode switch within one interval.
  interval: 10s
  hostRoot: /host
  signatureFile: /etc/chill/node-agent/signatures.yaml
  kubernetesClient:
    apiServer: ""
    discoverFromDefaultEndpoint: true
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  sources:
    - paths:
        - proc/device-tree/model
        - sys/firmware/devicetree/base/model
    - paths:
        - proc/device-tree/compatible
        - sys/firmware/devicetree/base/compatible
    - paths:
        - etc/nv_tegra_release
    - paths:
        - sys/devices/virtual/dmi/id/sys_vendor
        - sys/class/dmi/id/sys_vendor
    - paths:
        - sys/devices/virtual/dmi/id/product_name
        - sys/class/dmi/id/product_name
  signatures:
    - contains: ["nvidia jetson", "orin nano"]
      facts:
        vendor: nvidia
        family: jetson
        model: orin-nano
        accelerator: nvidia-jetson-orin-nano
    - contains: ["agx orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: agx-orin
        accelerator: nvidia-jetson-agx-orin
    - contains: ["nvidia jetson", "agx orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: agx-orin
        accelerator: nvidia-jetson-agx-orin
    - contains: ["xavier nx"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier-nx
        accelerator: nvidia-jetson-xavier-nx
    - contains: ["nvidia jetson", "xavier nx"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier-nx
        accelerator: nvidia-jetson-xavier-nx
    - contains: ["jetson nano"]
      facts:
        vendor: nvidia
        family: jetson
        model: jetson-nano
        accelerator: nvidia-jetson-nano
    - contains: ["nvidia jetson", "orin"]
      facts:
        vendor: nvidia
        family: jetson
        model: orin
        accelerator: nvidia-jetson-orin
    - contains: ["nvidia jetson", "xavier"]
      facts:
        vendor: nvidia
        family: jetson
        model: xavier
        accelerator: nvidia-jetson-xavier
    - contains: ["nv_tegra"]
      facts:
        vendor: nvidia
        family: jetson
        model: jetson
        accelerator: nvidia-jetson
    - contains: ["raspberry pi 5"]
      facts:
        vendor: raspberrypi
        family: raspberry-pi
        model: raspberry-pi-5
        accelerator: none
    - contains: ["orange pi 5 plus"]
      facts:
        vendor: xunlong
        family: orangepi
        model: orange-pi-5-plus
        accelerator: rk3588-npu
    - contains: ["lattepanda 3 delta"]
      facts:
        vendor: lattepanda
        family: lattepanda
        model: lattepanda-3-delta
        accelerator: none
    - contains: ["gigabyte technology", "z370 aorus gaming 7"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z370-aorus-gaming-7
        accelerator: nvidia-geforce-rtx-2080-ti
    - contains: ["gigabyte technology", "z370 aorus gaming 3"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z370-aorus-gaming-3
        accelerator: nvidia-geforce-rtx-2080-ti
    - contains: ["gigabyte technology", "z390 gaming x"]
      facts:
        vendor: gigabyte
        family: edge-server
        model: z390-gaming-x
        accelerator: nvidia-geforce-rtx-2080-ti
  image:
    repository: daclab/chill-node-agent
    tag: ""
    pullPolicy: IfNotPresent
  nodeSelector: {}
  excludeNodeNames: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "100%"
  hostPaths:
    - name: host-proc
      hostPath: /proc
      mountPath: /proc
    - name: host-sys
      hostPath: /sys
      mountPath: /sys
    - name: host-etc
      hostPath: /etc
      mountPath: /etc
  tolerations:
    - key: node-role.kubernetes.io/edge
      operator: Exists
      effect: NoSchedule
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  actuation:
    enabled: false
    metricsBindAddress: "0"
    healthProbePort: 8081
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    jetsonNVPModel:
      command:
        - /host/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
        - --library-path
        - /host/lib/aarch64-linux-gnu:/host/usr/lib/aarch64-linux-gnu/tegra
        - /host/usr/sbin/nvpmodel
      commandTimeout: 30s
      hostPaths:
        - name: host-nvpmodel
          hostPath: /usr/sbin/nvpmodel
          mountPath: /host/usr/sbin/nvpmodel
          type: File
          readOnly: true
        - name: host-lib
          hostPath: /lib/aarch64-linux-gnu
          mountPath: /host/lib/aarch64-linux-gnu
          type: Directory
          readOnly: true
        - name: host-tegra-lib
          hostPath: /usr/lib/aarch64-linux-gnu/tegra
          mountPath: /host/usr/lib/aarch64-linux-gnu/tegra
          type: Directory
          readOnly: true
        - name: host-nvpmodel-config-dir
          hostPath: /etc/nvpmodel
          mountPath: /etc/nvpmodel
          type: Directory
          readOnly: true
        - name: host-nvpmodel-config
          hostPath: /etc/nvpmodel.conf
          mountPath: /etc/nvpmodel.conf
          type: File
          readOnly: true
        - name: host-nvpmodel-state
          hostPath: /var/lib/nvpmodel
          mountPath: /var/lib/nvpmodel
          type: Directory
          readOnly: false
        - name: host-sys
          hostPath: /sys
          mountPath: /sys
          type: Directory
          readOnly: false
      # An init container orders nvidia-cdi-refresh.service after nvpmodel.service
      # on Nodes that have that unit, by writing
      # /etc/systemd/system/nvidia-cdi-refresh.service.d/10-after-nvpmodel.conf.
      # Otherwise the unit creates the GPU golden context first and the
      # boot-time power-mode apply fails. systemd reads the drop-in at the next
      # boot, so no daemon-reload is needed. Nodes without the unit are unchanged.
      ensureBootOrdering: true
    # Every actuatable Node in this testbed is a KubeEdge edge Node carrying
    # node-role.kubernetes.io/edge:NoSchedule.
    tolerations:
      - key: node-role.kubernetes.io/edge
        operator: Exists
        effect: NoSchedule
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    podSecurityContext:
      runAsUser: 0
      runAsNonRoot: false
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        # A power mode the device establishes at boot is reached by restarting
        # the Node. This is the only capability the actuation agent may hold.
        add:
          - SYS_BOOT
