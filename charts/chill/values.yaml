  serviceAccount:
    create: true
    name: ""
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 65532
    capabilities:
      drop:
        - ALL

nodeSelection:
  labelSelector: kubernetes.io/os=linux
  nodeSelector:
    kubernetes.io/os: linux

