nameOverride: ""
fullnameOverride: ""

system:
  enabled: true
  name: ""

evidenceStore:
  enabled: false
  configRef:
    name: ""
  # Gateway delivery binding. Match the existing operand config's bucket/region.
  # Empty name/endpoint/credentialsSecret.name use ChillSystem operand names.
  connection:
    name: ""
    endpoint: ""
    bucket: ""
    region: us-east-1
  # Owner measurement cleanup requires DeleteObject on owned evidence keys in this bucket.
  # The chart does not modify S3/IAM policies or expose these credentials to callers.
  credentialsSecret:
    name: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
    sessionTokenKey: ""

crds:
  enabled: true

operator:
  replicaCount: 1
  image:
    repository: daclab/chill-operator
    tag: ""
    pullPolicy: IfNotPresent
  metricsBindAddress: "0"
  healthProbeBindAddress: ":8081"
  leaderElection: true
  leaderElectionID: 1ba2121f.dacs.io
  nodeAgentReconcileInterval: 30s
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    name: ""

profiler:
  enabled: false
  replicaCount: 1
  configMapKey: config.yaml
  image:
    repository: daclab/chill-profiler
    tag: ""
    pullPolicy: IfNotPresent
  metricsBindAddress: "0"
  healthProbePort: 8081
  leaderElection: true
  leaderElectionID: profiler.edge.dacs.io
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    name: ""
  workloadObserver:
    serviceAccount:
      create: true
      name: ""
    kubernetesClient:
      apiServer: ""
      discoverFromDefaultEndpoint: true
  transitionObserver:
    observerNodeName: ""
    activeDeadlineOverheadSeconds: 180
    maximumObjectBytes: 67108864
    serviceAccount:
      create: true
      name: ""
  factSource:
    executionFactsKey: execution-facts.yaml
    metricSourcesKey: metric-sources.yaml
    workloadObservationKey: workload-observation.yaml
    executionPoliciesKey: execution-policies.yaml
    actuationPoliciesKey: actuation-policies.yaml

profiling:
  metricObserverImage: ""
  workloadObserverImage: ""
  executionDeclarations: []
  metricSources: []
  executionPolicyDefaults:
    activeDeadlineOverheadSeconds: 180
    attemptTimeoutOverheadSeconds: 150
    observerReadyTimeoutSeconds: 30
    observerStartOverheadSeconds: 120
    metricResultOverheadSeconds: 30
    workloadEndFenceTimeoutSeconds: 15
    workloadResultTimeoutSeconds: 30
    maxLatencySamples: 1000000
    maxInputBytes: 67108864
    maxRuntimeResultBytes: 33554432
    maxMetricResultBytes: 8388608
    maxMetricEvents: 50000
    maxWorkloadEvents: 10000
    maxWorkloadResultBytes: 8388608
    runtimeMemoryRequestBytes: 134217728
    # SmolVLM2-500M fp32 under ORT 1.27 CPU peaks at 5.2 GB resident for one
    # sample and 12.7 GB for four, so the limit admits the sample maxBatchSize.
    # The limit reserves nothing; the request above is what scheduling sees.
    runtimeMemoryLimitBytes: 17179869184
    observerCPURequest: 5m
    observerCPULimit: 100m
    observerMemoryRequestBytes: 16777216
    observerMemoryLimitBytes: 67108864
    workloadObserverCPURequest: 5m
    workloadObserverCPULimit: 100m
    workloadObserverMemoryRequestBytes: 33554432
    workloadObserverMemoryLimitBytes: 134217728
    coordinationReserveBytes: 1048576
    workspaceBytes: 134217728
  # The runtime CPU quota is not part of these envelopes: the AllocatableCPUQuota
  # policy derives it from the measured Node at run time, for every path alike.
  # A CUDA envelope selects nothing on its own; the measured Node also needs its
  # own CUDA declaration, which names the Node and carries its GPU UUID and the
  # nvidia.com/gpu resource.
  executionPolicies:
    - name: cpu-ort-arm64-active-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cpu-ort-arm64-idle-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-arm64
      workloadMode: idle-model-loaded
    - name: cpu-ort-amd64-active-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-amd64
      workloadMode: saturated-serial-fixed-batch
    - name: cpu-ort-amd64-idle-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-amd64
      workloadMode: idle-model-loaded
    - name: cuda-ort-nano-active-v1
      deviceClass: jetson-nano-4g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-nano-idle-v1
      deviceClass: jetson-nano-4g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: idle-model-loaded
    - name: cpu-ort-int8-arm64-active-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-int8-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cpu-ort-int8-arm64-idle-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-int8-arm64
      workloadMode: idle-model-loaded
    - name: cpu-ort-int8-amd64-active-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-int8-amd64
      workloadMode: saturated-serial-fixed-batch
    - name: cpu-ort-int8-amd64-idle-v1
      deviceClass: "*"
      executionPath: firstfloor-ort-cpu-int8-amd64
      workloadMode: idle-model-loaded
    - name: cuda-ort-agx-orin-active-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-agx-orin-idle-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: idle-model-loaded
    - name: cuda-ort-orin-nano-active-v1
      deviceClass: jetson-orin-nano-8g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-orin-nano-idle-v1
      deviceClass: jetson-orin-nano-8g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: idle-model-loaded
    - name: cuda-ort-xavier-active-v1
      deviceClass: jetson-xavier-nx-8g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-xavier-idle-v1
      deviceClass: jetson-xavier-nx-8g
      executionPath: firstfloor-ort-cuda-arm64
      workloadMode: idle-model-loaded
    # PLC's LSTM graph has its own arm64 CUDA path: on jetson-xavier-nx-8g (sm_72,
    # JetPack 5.1.2) ORT 1.16 and 1.18 CUDA scores differ from CPU and change with
    # the batch size, so that class has no policy for it.
    - name: cuda-ort-rnn-nano-active-v1
      deviceClass: jetson-nano-4g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-rnn-nano-idle-v1
      deviceClass: jetson-nano-4g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: idle-model-loaded
    - name: cuda-ort-rnn-agx-orin-active-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-rnn-agx-orin-idle-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: idle-model-loaded
    - name: cuda-ort-rnn-orin-nano-active-v1
      deviceClass: jetson-orin-nano-8g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-rnn-orin-nano-idle-v1
      deviceClass: jetson-orin-nano-8g
      executionPath: firstfloor-ort-cuda-rnn-arm64
      workloadMode: idle-model-loaded
    # SmolVLM fp32 has its own arm64 CUDA path: CUDA allocations on Jetson share
    # the board memory outside the container limit, and the 8 GB boards
    # (jetson-xavier-nx-8g, jetson-orin-nano-8g) run out while loading it.
    - name: cuda-ort-vlm-agx-orin-active-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-vlm-arm64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-vlm-agx-orin-idle-v1
      deviceClass: jetson-agx-orin-64g
      executionPath: firstfloor-ort-cuda-vlm-arm64
      workloadMode: idle-model-loaded
    - name: cuda-ort-edge-server-active-v1
      deviceClass: edge-server-rtx-2080-ti-64g
      executionPath: firstfloor-ort-cuda-amd64
      workloadMode: saturated-serial-fixed-batch
    - name: cuda-ort-edge-server-idle-v1
      deviceClass: edge-server-rtx-2080-ti-64g
      executionPath: firstfloor-ort-cuda-amd64
      workloadMode: idle-model-loaded
    - name: rknnlite-active-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: firstfloor-rknnlite
      workloadMode: saturated-serial-fixed-batch
    - name: rknnlite-idle-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: firstfloor-rknnlite
      workloadMode: idle-model-loaded

# Each entry is a mode the Node actuator has applied and independently read
# back on the testbed Node of that class. For Xavier NX and Orin Nano the
# host's online CPUs and CPU and GPU clock caps also match the mode's nvpmodel
# configuration. Every Xavier NX mode changes in place within a second. The
# Orin Nano 15W, 25W and MAXN_SUPER share one GPU power-gating mask and change
# in place within half a second; 7W gates more of the GPU, so a transition into
# or out of it restarts the Node (about 75 seconds to read-back) and every Orin
# Nano duration below covers a boot.
powerActuation:
  policies:
    - name: xavier-nvpmodel-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_15W_6CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-20w-6core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_20W_6CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-15w-2core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_15W_2CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-15w-4core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_15W_4CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-10w-2core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_10W_2CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-10w-4core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_10W_4CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-10w-desktop-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_10W_DESKTOP
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-20w-2core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_20W_2CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: xavier-mode-20w-4core-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_20W_4CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: nano-maxn-native-v1
      deviceClass: jetson-nano-4g
      powerMode: MAXN
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: nano-5w-v1
      deviceClass: jetson-nano-4g
      powerMode: 5W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-nano-25w-native-v1
      deviceClass: jetson-orin-nano-8g
      powerMode: 25W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-nano-15w-v1
      deviceClass: jetson-orin-nano-8g
      powerMode: 15W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-nano-maxn-super-v1
      deviceClass: jetson-orin-nano-8g
      powerMode: MAXN_SUPER
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-nano-7w-v1
      deviceClass: jetson-orin-nano-8g
      powerMode: 7W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-mode-50w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_50W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-maxn-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MAXN
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    # The device establishes these two at boot, so a transition into either one
    # restarts the Node and the duration below has to cover a boot.
    - name: orin-mode-30w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_30W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-mode-15w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_15W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900

console:
  enabled: false
  replicaCount: 1
  image:
    repository: daclab/chill-console
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    name: ""

# Single HTTPS management/inference gateway. Native Pods supply backend addresses;
# completed selected campaigns supply real profiles. No serving capacity is created.
servingEntrypoint:
  enabled: false
  image:
    repository: daclab/chill-serving-entrypoint
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  # Empty namespaces use the Helm release namespace. Namespaces must already exist.
  namespace: ""
  # Empty configMap disables the scheduler. The existing ConfigMap must be in
  # namespace above and contain the deployment configuration JSON under key.
  scheduler:
    configMap: ""
    key: scheduler.json
  # Namespaces whose completed measurements the scheduler derives profiles and
  # costs from, and where measurements are listed, created and deleted; empty
  # uses the serving namespace. Measurement deletion also removes owned evidence.
  profileNamespaces: []
  tls:
    # Required only when enabled; existing kubernetes.io/tls Secret in release namespace.
    secretName: ""
  observationStorage:
    # ObservationLog path inside the retained PVC; select a fresh path for a stored-contract cutover.
    directory: /data
    size: 1Gi
    # null uses the cluster default; "" explicitly requests no StorageClass.
    storageClassName: null
  queueLimit: 1024
  requestTimeout: 30s
  drainTimeout: 2m
  # Must exceed drainTimeout plus HTTP shutdown overhead.
  terminationGracePeriodSeconds: 150
  sourceInterval: 1s
  profileInterval: 1m
  profileConfidenceLevel: 0.95
  observationDefinitions: []
  observationOutcomes: []
  maxRequestBytes: 8388608
  maxEvidenceBytes: 67108864
  maxQueryEvents: 1000
  kubeAPI:
    apiServer: ""
    tokenFile: ""
    caFile: ""
    qps: 50
    burst: 100
  service:
    type: ClusterIP
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Image of the load Job a DispatchOccupancyMeasurement runs.
loadGenerator:
  image:
    repository: daclab/chill-load-generator
    tag: ""

# Independent web process; the caller's bearer is never a pod credential.
dashboard:
  enabled: false
  replicaCount: 1
  image:
    repository: daclab/chill-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  port: 3000
  # Empty uses the enabled serving entrypoint's HTTPS Service.
  baseURL: ""
  namespace: ""
  systemName: ""
  # Optional trusted owner CA, mounted for native Node TLS verification.
  caSecretName: ""
  caSecretKey: ca.crt
  queryTimeoutMilliseconds: 10000
  mutationTimeoutMilliseconds: 60000
  inferTimeoutMilliseconds: 30000
  maxRequestBytes: 8388608
  pageSize: 50
  maxPageSize: 200
  maxWindowHours: 24
  pollIntervalMilliseconds: 5000
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""
    annotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

uninstallCleanup:
  enabled: true
  timeout: 120s
  backoffLimit: 0
  image:
    repository: registry.k8s.io/kubectl
    tag: "v1.31.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 65532
    capabilities:
      drop:
        - ALL

nodeSelection:
  labelSelector: kubernetes.io/os=linux
  nodeSelector:
    kubernetes.io/os: linux

discovery:
  enabled: true
  labelKey: edge.dacs.io/device-class
  overwriteManualLabels: false
  nodeLabelSelector: ""
  requireCatalogMatch: true
  fallbackPowerModes:
    - name: fixed
      actuator: {kind: Fixed}
  catalog:
    enabled: true
    name: ""
    key: catalog.yaml
    classes:
      - name: jetson-agx-orin-64g
        matchLabels:
          edge.dacs.io/device-vendor: nvidia
          edge.dacs.io/device-family: jetson
          edge.dacs.io/device-model: agx-orin
        architecture: arm64
        memory: 64Gi
        accelerator: nvidia-jetson-agx-orin
        powerModes:
          - name: MAXN
