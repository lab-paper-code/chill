  configMapKey: config.yaml
  image:
    repository: daclab/chill-profiler
    tag: ""
    pullPolicy: IfNotPresent
  metricsBindAddress: "0"
  healthProbePort: 8081
  leaderElection: true
  leaderElectionID: profiler.edge.dacs.io
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podSecurityContext:
