      create: true
      name: ""
    kubernetesClient:
      apiServer: ""
      discoverFromDefaultEndpoint: true
  transitionObserver:
    observerNodeName: ""
    activeDeadlineOverheadSeconds: 180
    maximumObjectBytes: 67108864
    serviceAccount:
      create: true
      name: ""
  factSource:
    executionFactsKey: execution-facts.yaml
    metricSourcesKey: metric-sources.yaml
    workloadObservationKey: workload-observation.yaml
    admissionPoliciesKey: admission-policies.yaml
    executionPoliciesKey: execution-policies.yaml
    actuationPoliciesKey: actuation-policies.yaml

profiling:
  metricObserverImage: ""
  workloadObserverImage: ""
  executionDeclarations: []
  metricSources: []
  admissionPolicies:
    - name: wall-power-v2
      workloadMode: saturated-serial-fixed-batch
      minimumSamples: 20
      maximumGapSeconds: 1.5
      maximumBoundaryDistanceSeconds: 1.0
      minimumCoverage: 0.95
      allowReceiptTimestamps: true
      rejectConcurrentCHILLWorkloads: true
      rejectExternalWorkloadChanges: true
    - name: idle-wall-power-v1
      workloadMode: idle-model-loaded
      minimumSamples: 20
      maximumGapSeconds: 1.5
      maximumBoundaryDistanceSeconds: 1.0
      minimumCoverage: 0.95
      allowReceiptTimestamps: true
      rejectConcurrentCHILLWorkloads: true
      rejectExternalWorkloadChanges: true
  additionalAdmissionPolicies: []
  executionPolicyDefaults:
    activeDeadlineOverheadSeconds: 180
    attemptTimeoutOverheadSeconds: 150
    observerReadyTimeoutSeconds: 30
    observerStartOverheadSeconds: 120
    metricResultOverheadSeconds: 30
    workloadEndFenceTimeoutSeconds: 15
    workloadResultTimeoutSeconds: 30
    maxLatencySamples: 1000000
    maxInputBytes: 67108864
    maxRuntimeResultBytes: 33554432
    maxMetricResultBytes: 8388608
    maxMetricEvents: 50000
    maxWorkloadEvents: 10000
    maxWorkloadResultBytes: 8388608
    runtimeMemoryRequestBytes: 134217728
    runtimeMemoryLimitBytes: 1073741824
    observerCPURequest: 5m
    observerCPULimit: 100m
    observerMemoryRequestBytes: 16777216
    observerMemoryLimitBytes: 67108864
    workloadObserverCPURequest: 5m
    workloadObserverCPULimit: 100m
    workloadObserverMemoryRequestBytes: 33554432
    workloadObserverMemoryLimitBytes: 134217728
    coordinationReserveBytes: 1048576
    workspaceBytes: 134217728
  executionPolicies:
    - name: cpu-ort-active-v1
      deviceClass: "*"
      executionPath: ort-cpu
      workloadMode: saturated-serial-fixed-batch
    - name: cpu-ort-idle-v1
      deviceClass: "*"
      executionPath: ort-cpu
      workloadMode: idle-model-loaded
    - name: rknnlite-active-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: rknnlite
      workloadMode: saturated-serial-fixed-batch
    - name: rknnlite-idle-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: rknnlite
      workloadMode: idle-model-loaded
    - name: rknnlite-bs2-active-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: rknnlite-bs2
      workloadMode: saturated-serial-fixed-batch
    - name: rknnlite-bs2-idle-v1
      deviceClass: orangepi-5-plus-16g
      executionPath: rknnlite-bs2
      workloadMode: idle-model-loaded

powerActuation:
  policies:
    - name: xavier-nvpmodel-v1
      deviceClass: jetson-xavier-nx-8g
      powerMode: MODE_15W_6CORE
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-mode-50w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_50W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-maxn-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MAXN
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    # The device establishes these two at boot, so a transition into either one
    # restarts the Node and the duration below has to cover a boot.
    - name: orin-mode-30w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_30W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900
    - name: orin-mode-15w-v1
      deviceClass: jetson-agx-orin-64g
      powerMode: MODE_15W
      actuatorKind: JetsonNVPModel
      settlingDurationSeconds: 60
      maxActuationDurationSeconds: 900

nodeActuator:
  enabled: false
  configMapKey: config.yaml
  image:
    repository: daclab/chill-node-actuator
    tag: ""
    pullPolicy: IfNotPresent
  metricsBindAddress: "0"
  healthProbePort: 8081
  leaseDurationSeconds: 30
  kubernetesClient:
    apiServer: ""
    discoverFromDefaultEndpoint: true
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  allowedNamespaces:
    - kube-system
  jetsonNVPModel:
    command:
      - /host/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
      - --library-path
      - /host/lib/aarch64-linux-gnu:/host/usr/lib/aarch64-linux-gnu/tegra
      - /host/usr/sbin/nvpmodel
    commandTimeout: 30s
    hostPaths:
      - name: host-nvpmodel
        hostPath: /usr/sbin/nvpmodel
        mountPath: /host/usr/sbin/nvpmodel
        type: File
        readOnly: true
      - name: host-lib
        hostPath: /lib/aarch64-linux-gnu
        mountPath: /host/lib/aarch64-linux-gnu
        type: Directory
        readOnly: true
      - name: host-tegra-lib
        hostPath: /usr/lib/aarch64-linux-gnu/tegra
        mountPath: /host/usr/lib/aarch64-linux-gnu/tegra
        type: Directory
        readOnly: true
      - name: host-nvpmodel-config-dir
        hostPath: /etc/nvpmodel
        mountPath: /etc/nvpmodel
        type: Directory
        readOnly: true
      - name: host-nvpmodel-config
        hostPath: /etc/nvpmodel.conf
        mountPath: /etc/nvpmodel.conf
        type: File
        readOnly: true
      - name: host-nvpmodel-state
        hostPath: /var/lib/nvpmodel
        mountPath: /var/lib/nvpmodel
        type: Directory
        readOnly: false
      - name: host-sys
        hostPath: /sys
        mountPath: /sys
        type: Directory
        readOnly: false
  nodeSelector:
    edge.dacs.io/node-actuation: enabled
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podSecurityContext:
    runAsUser: 0
    runAsNonRoot: false
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      # A power mode the device establishes at boot is reached by restarting the
      # Node. This is the only capability the actuator may hold.
      add:
        - SYS_BOOT
  serviceAccount:
    create: true
    name: ""

console:
  enabled: false
  replicaCount: 1
  image:
    repository: daclab/chill-console
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
