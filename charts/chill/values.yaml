          - name: MODE_15W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 1}}
          - name: MODE_30W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 2}}
          - name: MODE_50W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 3}}
      - name: jetson-orin-nano-8g
        matchLabels:
          edge.dacs.io/device-vendor: nvidia
          edge.dacs.io/device-family: jetson
          edge.dacs.io/device-model: orin-nano
        architecture: arm64
        memory: 8Gi
        accelerator: nvidia-jetson-orin-nano
        powerModes:
          - name: 15W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 0}}
          - name: 25W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 1}}
          - name: MAXN_SUPER
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 2}}
          - name: 7W
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 3}}
      - name: jetson-xavier-nx-8g
        matchLabels:
          edge.dacs.io/device-vendor: nvidia
          edge.dacs.io/device-family: jetson
          edge.dacs.io/device-model: xavier-nx
        architecture: arm64
        memory: 8Gi
        accelerator: nvidia-jetson-xavier-nx
        powerModes:
          - name: MODE_15W_2CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 0}}
          - name: MODE_15W_4CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 1}}
          - name: MODE_15W_6CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 2}}
          - name: MODE_10W_2CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 3}}
          - name: MODE_10W_4CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 4}}
          - name: MODE_10W_DESKTOP
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 5}}
          - name: MODE_20W_2CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 6}}
          - name: MODE_20W_4CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 7}}
          - name: MODE_20W_6CORE
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 8}}
      - name: jetson-nano-4g
        matchLabels:
          edge.dacs.io/device-vendor: nvidia
          edge.dacs.io/device-family: jetson
          edge.dacs.io/device-model: jetson-nano
        architecture: arm64
        memory: 4Gi
        accelerator: nvidia-jetson-nano
        powerModes:
          - name: MAXN
            actuator: {kind: JetsonNVPModel, jetsonNVPModel: {id: 0}}
