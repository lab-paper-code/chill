apiVersion: batch/v1
kind: Job
metadata:
  generateName: chill-evidence-store-put-
  namespace: chill-system
  labels:
    app.kubernetes.io/name: chill-evidence-store-writer
    app.kubernetes.io/component: evidence-store
    app.kubernetes.io/part-of: chill
    app.kubernetes.io/managed-by: evidence-store-spike
spec:
  activeDeadlineSeconds: 90
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chill-evidence-store-writer
        app.kubernetes.io/component: evidence-store
        app.kubernetes.io/part-of: chill
        app.kubernetes.io/managed-by: evidence-store-spike
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: lattepanda
      restartPolicy: Never
      tolerations:
        - key: node-role.kubernetes.io/edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: writer
          image: 155.230.35.213:5000/chill/spike-s3-client@sha256:e73ec12f2bf15c397e3346264bcb7a8299c832692a96ef211968ad4d07a64dfb
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              actual_digest="$(sha256sum /fixture/evidence.json | awk '{print $1}')"
              actual_size="$(wc -c < /fixture/evidence.json | tr -d ' ')"
              test "$actual_digest" = "$EXPECTED_DIGEST"
              test "$actual_size" = "$EXPECTED_SIZE"

              if aws --endpoint-url "$STORE_ENDPOINT" s3api put-object \
                  --bucket "$STORE_BUCKET" \
                  --key "$STORE_KEY" \
                  --body /fixture/evidence.json \
                  --if-none-match '*' >/dev/null 2>/tmp/put-error; then
                outcome=created
              else
                aws --endpoint-url "$STORE_ENDPOINT" s3api get-object \
                  --bucket "$STORE_BUCKET" \
                  --key "$STORE_KEY" \
                  /tmp/existing.json >/dev/null
                existing_digest="$(sha256sum /tmp/existing.json | awk '{print $1}')"
                existing_size="$(wc -c < /tmp/existing.json | tr -d ' ')"
                if [ "$existing_digest" != "$actual_digest" ] || \
                   [ "$existing_size" != "$actual_size" ]; then
                  echo "immutable object conflict: existing bytes differ" >&2
                  cat /tmp/put-error >&2
                  exit 42
                fi
                outcome=existing-exact-match
              fi

              printf '%s\n' \
                "receipt:" \
                "  bucket: $STORE_BUCKET" \
                "  key: $STORE_KEY" \
                "  sha256: $actual_digest" \
                "  size: $actual_size" \
                "  outcome: $outcome"
          env:
            - name: STORE_ENDPOINT
              value: http://chill-evidence-store-spike.chill-system.svc.cluster.local:9000
            - name: STORE_BUCKET
              value: chill-profiling-evidence
            - name: STORE_KEY
              value: runs/sha256-165d50e316de2b3d7da0728df1245aaf56f8f5a407668db1c24a756b6ba3fe42.json
            - name: EXPECTED_DIGEST
              value: 165d50e316de2b3d7da0728df1245aaf56f8f5a407668db1c24a756b6ba3fe42
            - name: EXPECTED_SIZE
              value: "389364"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_PAGER
              value: ""
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: fixture
          configMap:
            name: chill-evidence-store-spike-fixture
        - name: tmp
          emptyDir: {}
