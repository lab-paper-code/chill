apiVersion: batch/v1
kind: Job
metadata:
  generateName: chill-evidence-store-clusterip-probe-
  namespace: chill-system
  labels:
    app.kubernetes.io/name: chill-evidence-store-probe
    app.kubernetes.io/component: evidence-store
    app.kubernetes.io/part-of: chill
    app.kubernetes.io/managed-by: evidence-store-spike
spec:
  activeDeadlineSeconds: 60
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chill-evidence-store-probe
        app.kubernetes.io/component: evidence-store
        app.kubernetes.io/part-of: chill
        app.kubernetes.io/managed-by: evidence-store-spike
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: true
      nodeSelector:
        kubernetes.io/hostname: lattepanda
      restartPolicy: Never
      tolerations:
        - key: node-role.kubernetes.io/edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: probe
          image: 155.230.35.213:5000/chill/spike-ort-runtime:cpu-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: STORE_CLUSTER_IP
              value: __STORE_CLUSTER_IP__
          command:
            - python3
            - -c
            - |
              import os
              import time
              import urllib.request

              host = os.environ["STORE_CLUSTER_IP"]
              targets = (
                  ("cluster-ip", f"http://{host}:9000/_/health"),
                  (
                      "service-dns",
                      "http://chill-evidence-store-spike.chill-system.svc.cluster.local:9000/_/health",
                  ),
              )

              failed_targets = []
              for name, url in targets:
                  print(f"TARGET {name}", flush=True)
                  successes = 0
                  for attempt in range(1, 6):
                      started = time.monotonic()
                      try:
                          with urllib.request.urlopen(url, timeout=3) as response:
                              response.read()
                              successes += 1
                              result = f"status={response.status}"
                      except Exception as error:
                          result = f"error={type(error).__name__}:{error}"
                      finally:
                          elapsed_ms = (time.monotonic() - started) * 1000
                          print(
                              f"  attempt={attempt} {result} "
                              f"elapsed_ms={elapsed_ms:.1f}",
                              flush=True,
                          )
                      time.sleep(1)
                  if successes == 0:
                      failed_targets.append(name)

              if failed_targets:
                  raise SystemExit(
                      "unreachable targets: " + ", ".join(failed_targets)
                  )
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
