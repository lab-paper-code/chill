apiVersion: batch/v1
kind: Job
metadata:
  generateName: chill-evidence-store-verify-
  namespace: chill-system
  labels:
    app.kubernetes.io/name: chill-evidence-store-verifier
    app.kubernetes.io/component: evidence-store
    app.kubernetes.io/part-of: chill
    app.kubernetes.io/managed-by: evidence-store-spike
spec:
  activeDeadlineSeconds: 60
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chill-evidence-store-verifier
        app.kubernetes.io/component: evidence-store
        app.kubernetes.io/part-of: chill
        app.kubernetes.io/managed-by: evidence-store-spike
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: verifier
          image: 155.230.35.213:5000/chill/evidence-store-client@sha256:5df44fc881a8e3e155aaa316c5714f483ef029593a0ed2730c021374135bdd8d
          imagePullPolicy: IfNotPresent
          args:
            - verify
          env:
            - name: STORE_ENDPOINT
              value: http://chill-evidence-store-spike.chill-system.svc.cluster.local:9000
            - name: STORE_BUCKET
              value: chill-profiling-evidence
            - name: STORE_KEY
              value: runs/internal-plan1/sha256-165d50e316de2b3d7da0728df1245aaf56f8f5a407668db1c24a756b6ba3fe42.json
            - name: EXPECTED_DIGEST
              value: sha256:165d50e316de2b3d7da0728df1245aaf56f8f5a407668db1c24a756b6ba3fe42
            - name: EXPECTED_SIZE
              value: "389364"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
