apiVersion: apps/v1
kind: Deployment
metadata:
  name: chill-evidence-store-spike
  labels:
    app.kubernetes.io/name: chill-evidence-store
    app.kubernetes.io/instance: spike
    app.kubernetes.io/component: evidence-store
    app.kubernetes.io/part-of: chill
    app.kubernetes.io/managed-by: evidence-store-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chill-evidence-store
      app.kubernetes.io/instance: spike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chill-evidence-store
        app.kubernetes.io/instance: spike
        app.kubernetes.io/component: evidence-store
        app.kubernetes.io/part-of: chill
        app.kubernetes.io/managed-by: evidence-store-spike
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: store
          image: docker.io/versity/versitygw@sha256:ce219220afa631b77d60a6f9edcb1e94febb16a8c6450991986bff8508423138
          imagePullPolicy: IfNotPresent
          env:
            - name: VGW_BACKEND
              value: posix
            - name: VGW_BACKEND_ARGS
              value: /data
            - name: VGW_PORT
              value: :9000
            - name: VGW_REGION
              value: us-east-1
            - name: VGW_HEALTH
              value: /_/health
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: access-key
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chill-evidence-store-spike-credentials
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_/health
              port: s3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_/health
              port: s3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chill-evidence-store-spike
