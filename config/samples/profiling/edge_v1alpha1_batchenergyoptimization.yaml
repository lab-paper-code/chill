apiVersion: edge.dacs.io/v1alpha1
kind: BatchEnergyOptimization
metadata:
  name: example-batch-energy-optimization
  namespace: chill-system
spec:
  state:
    candidate:
      modelSpec: mobilenet-v2-050
      deviceClass: example-device-class
      executionPath: ort-cpu
      powerMode: fixed
    targetNode: example-node
    cpuRequest: 100m
  activeProtocol:
    admissionPolicy: wall-power-v2
    warmupIterations: 20
    durationSeconds: 30
    inputGenerator: numpy-default-rng-seed-0-fp32-v1
    outputValidation: nonempty-shape-batch-v1
    metricObservation:
      intervalMilliseconds: 1000
      timeoutMilliseconds: 500
      durationSeconds: 31
  idleProtocol:
    admissionPolicy: idle-wall-power-v1
    settlingDurationSeconds: 60
    durationSeconds: 30
    metricObservation:
      intervalMilliseconds: 1000
      timeoutMilliseconds: 500
      durationSeconds: 31
  trialsPerBatch: 3
  batchSizes: [1, 2, 4, 8, 16]
  retryLimit: 2
