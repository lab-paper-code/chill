apiVersion: edge.dacs.io/v1alpha1
kind: BatchEnergyOptimization
metadata:
  name: example-batch-energy-optimization
  namespace: chill-system
spec:
  state:
    candidate:
      modelSpec: mobilenet-v2-050
      deviceClass: example-device-class
      executionPath: firstfloor-ort-cpu-arm64
      preprocessor: mobilenet-imagenet
      powerMode: fixed
    targetNode: example-node
  activeProtocol:
    workload: mobilenet
    warmupIterations: 20
    durationSeconds: 150
    dataset: vqav2-val-subset
    operatingPoints:
      utilizations: [0.25, 0.5, 0.75]
      sparseMeanGapMilliseconds: 1000
      phaseDurationSeconds: 30
      requestLifetimeSeconds: 30
      deliveryMarginMilliseconds: 100
      framedDecodedRequestUpperBytes: 2097152
    metricObservation:
      intervalMilliseconds: 1000
      timeoutMilliseconds: 500
      durationSeconds: 151
  idleProtocol:
    settlingDurationSeconds: 60
    durationSeconds: 30
    metricObservation:
      intervalMilliseconds: 1000
      timeoutMilliseconds: 500
      durationSeconds: 31
  trialsPerBatch: 3
  retryLimit: 2
