# CampaignOps only. First retain an admitted GPU_1500 CUDA runner profile and
# Complete exact-state model-loaded-idle baselines for BOTH GPU_1500/GPU_900.
# Submit in the serving namespace; measurement admission creates the real
# runner and the uniquely named Service below. Select the environment document
# for the actual Node, class and runner (../README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: PowerModeTransitionCost
metadata:
  name: example-nvidia-gpu-1500-900
  namespace: chill-system
spec:
  targetNode: example-transition-node
  deviceClass: example-nvidia-device-class
  modelSpec: mobilenet-v2-050
  executionPath: firstfloor-ort-cuda-amd64
  modes:
    - powerMode: GPU_1500
    - powerMode: GPU_900
  servingService: example-serving
  servingContainer: firstfloor
  acceptedCountTarget: 5
  attemptLimit: 8
  settlingSeconds: 60
  observationPolicy:
    powerIntervalMilliseconds: 1000
    powerTimeoutMilliseconds: 500
    maximumTransitionDurationSeconds: 900
    factPollIntervalMilliseconds: 250
    maximumBoundaryDistanceMilliseconds: 1000
    minimumCoverage: "0.95"
    maximumSampleGapMilliseconds: 2000
    maximumBoundaryUncertaintyMilliseconds: 1000
    maximumReadyObservationDelayMilliseconds: 5000
