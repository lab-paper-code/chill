apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: mobilenet-v2-050
spec:
  artifacts:
  - name: canonical-onnx
    format: onnx
  - name: mobilenet-v2-050-rk3588-bs1
    format: rknn
    derivation:
      sourceArtifact: canonical-onnx
      targetPlatform: rk3588
      fixedBatch: 1
      input:
        shape: [1, 224, 224, 3]
        layout: NHWC
        dataType: float32
      conversion:
        tool: rknn-toolkit2
        version: 2.3.2
  - name: mobilenet-v2-050-rk3588-bs2
    format: rknn
    derivation:
      sourceArtifact: canonical-onnx
      targetPlatform: rk3588
      fixedBatch: 2
      input:
        shape: [2, 224, 224, 3]
        layout: NHWC
        dataType: float32
      conversion:
        tool: rknn-toolkit2
        version: 2.3.2
  executionPaths:
  - name: ort-cpu
    artifact: canonical-onnx
    runtime:
      family: onnxruntime
      backend: CPUExecutionProvider
  - name: rknnlite
    artifact: mobilenet-v2-050-rk3588-bs1
    runtime:
      family: rknnlite
      backend: not-applicable
  - name: rknnlite-bs2
    artifact: mobilenet-v2-050-rk3588-bs2
    runtime:
      family: rknnlite
      backend: not-applicable
