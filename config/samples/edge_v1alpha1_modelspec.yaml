apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: mobilenet-v2-050
spec:
  artifacts:
  - name: canonical-onnx
    format: onnx
  - name: mobilenet-v2-050-rk3588
    format: rknn
    derivation:
      sourceArtifact: canonical-onnx
      targetPlatform: rk3588
      batchProfiles: [1, 2, 4, 8, 16]
      input:
        nonBatchShape: [224, 224, 3]
        layout: NHWC
        dataType: float32
      conversion:
        tool: rknn-toolkit2
        version: 2.3.2
  executionPaths:
  - name: ort-cpu
    artifact: canonical-onnx
    runtime:
      family: onnxruntime
      backend: CPUExecutionProvider
  - name: rknnlite
    artifact: mobilenet-v2-050-rk3588
    runtime:
      family: rknnlite
      backend: not-applicable
