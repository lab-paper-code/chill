# Use metadata.name and spec as serving management API input, not kubectl apply.
# Example registry locations; select the environment document for registration (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: Preprocessor
metadata:
  name: plc-extruder-anomaly
spec:
  input:
    fields:
    - {name: records, format: UTF8, maxBytes: 65536}
  output:
    fields:
    - {name: score, format: UTF8}
    - {name: anomaly, format: UTF8}
  artifacts:
  - target: {model: plc-lstm-ae, artifact: onnx-fp32-arm64}
    source:
      image: "registry.example.invalid/chill/chill-plc-extruder-anomaly-preprocessor@sha256:b401741de336ef745607054b1ef6ea8d0d020ebe64fd4ecacb5ed1c85e411a28"
      architecture: arm64
      path: /artifact/plc-extruder-anomaly
  - target: {model: plc-lstm-ae, artifact: onnx-fp32-amd64}
    source:
      image: "registry.example.invalid/chill/chill-plc-extruder-anomaly-preprocessor@sha256:b401741de336ef745607054b1ef6ea8d0d020ebe64fd4ecacb5ed1c85e411a28"
      architecture: amd64
      path: /artifact/plc-extruder-anomaly
