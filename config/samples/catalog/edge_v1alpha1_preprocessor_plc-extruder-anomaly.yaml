# Use metadata.name and spec as serving management API input, not kubectl apply.
# Replace PUSHED_DIGEST with the digest of the pushed carrier (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: Preprocessor
metadata:
  name: plc-extruder-anomaly
spec:
  input:
    fields:
    - {name: records, format: UTF8, maxBytes: 65536}
  output:
    fields:
    - {name: score, format: UTF8}
    - {name: anomaly, format: UTF8}
  artifacts:
  - target: {model: plc-lstm-ae, artifact: onnx-fp32}
    source:
      image: "155.230.35.213:5000/chill/chill-plc-extruder-anomaly-preprocessor@sha256:PUSHED_DIGEST"
      architecture: arm64
      path: /artifact/plc-extruder-anomaly
