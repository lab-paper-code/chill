# Use metadata.name and spec as serving management API input, not kubectl apply.
# Example registry locations; select the environment document for registration (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: mobilenet-v2-050
spec:
  artifacts:
  - name: canonical-onnx-arm64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-mobilenet-v2-050-artifact@sha256:a6a670b244d5d93987160f62e52da97a09fdcb731ded67c1123e614276aee406"
      architecture: arm64
      files:
      - /artifact/mobilenet-v2-050.onnx
  - name: canonical-onnx-amd64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-mobilenet-v2-050-artifact@sha256:a6a670b244d5d93987160f62e52da97a09fdcb731ded67c1123e614276aee406"
      architecture: amd64
      files:
      - /artifact/mobilenet-v2-050.onnx
  - name: mobilenet-v2-050-rk3588
    format: rknn
    source:
      image: "registry.example.invalid/chill/chill-mobilenet-v2-050-rknn-artifact@sha256:c9eb4abc86b376f43c419cd01782bc3709fd14d8452a4953ea8f396fd3b702a5"
      architecture: arm64
      files:
      - /artifact/mobilenet-v2-050-rk3588.rknn
    input:
      tensors:
      - name: input
        datatype: FP32
        sampleShape: [224, 224, 3]
    derivation:
      sourceArtifact: canonical-onnx-arm64
      targetPlatform: rk3588
      declaredBatchSizes: [1, 2, 4, 8, 16]
      conversion:
        tool: rknn-toolkit2
        version: 2.3.2
  executionPaths:
