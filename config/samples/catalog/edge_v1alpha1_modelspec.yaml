    artifact: canonical-onnx-arm64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 16
          maxQueueSize: 256
          deadlinePolicy: keep
  - name: firstfloor-ort-cuda-arm64
