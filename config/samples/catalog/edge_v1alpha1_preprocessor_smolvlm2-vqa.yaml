# Use metadata.name and spec as serving management API input, not kubectl apply.
# Images pin the pushed multi-arch carrier index digest (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: Preprocessor
metadata:
  name: smolvlm2-vqa
spec:
  input:
    fields:
    - {name: image, format: JPEG, maxBytes: 4194304}
    - {name: question, format: UTF8, maxBytes: 1024}
  output:
    fields:
    - {name: answer, format: UTF8}
  maxNewTokens: 16
  artifacts:
  - target: {model: smolvlm2-500m-video-instruct, artifact: onnx-fp32-arm64}
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-vqa-preprocessor@sha256:832d492053f6515795e44179c1ce6c54894762170553adb8d5c30f9a3f5099db"
      architecture: arm64
      path: /artifact/smolvlm2-vqa
  - target: {model: smolvlm2-500m-video-instruct, artifact: onnx-fp32-amd64}
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-vqa-preprocessor@sha256:832d492053f6515795e44179c1ce6c54894762170553adb8d5c30f9a3f5099db"
      architecture: amd64
      path: /artifact/smolvlm2-vqa
  - target: {model: smolvlm2-500m-video-instruct, artifact: onnx-int8-arm64}
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-vqa-preprocessor@sha256:832d492053f6515795e44179c1ce6c54894762170553adb8d5c30f9a3f5099db"
      architecture: arm64
      path: /artifact/smolvlm2-vqa-1tile
  - target: {model: smolvlm2-500m-video-instruct, artifact: onnx-int8-amd64}
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-vqa-preprocessor@sha256:832d492053f6515795e44179c1ce6c54894762170553adb8d5c30f9a3f5099db"
      architecture: amd64
      path: /artifact/smolvlm2-vqa-1tile
