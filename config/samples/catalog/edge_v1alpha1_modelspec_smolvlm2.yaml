# Use metadata.name and spec as serving management API input, not kubectl apply.
# Example registry locations; select the environment document for registration (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: smolvlm2-500m-video-instruct
spec:
  artifacts:
  - name: onnx-fp32-arm64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-smolvlm2-500m-onnx@sha256:c227f6f7f256e878dc7b8a20910c1bfceb74b8e82c25fa1828e67d0225b4e7ba"
      architecture: arm64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  - name: onnx-fp32-amd64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-smolvlm2-500m-onnx@sha256:c227f6f7f256e878dc7b8a20910c1bfceb74b8e82c25fa1828e67d0225b4e7ba"
      architecture: amd64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  - name: onnx-int8-arm64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-smolvlm2-500m-onnx-int8@sha256:2c4306131b02560e8c36c9b9031eed3711cbaa754ef57472042652d4e5994983"
      architecture: arm64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  - name: onnx-int8-amd64
    format: onnx
    source:
      image: "registry.example.invalid/chill/chill-smolvlm2-500m-onnx-int8@sha256:2c4306131b02560e8c36c9b9031eed3711cbaa754ef57472042652d4e5994983"
      architecture: amd64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  executionPaths:
  - name: firstfloor-ort-cpu-arm64
    artifact: onnx-fp32-arm64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cuda-vlm-arm64
    artifact: onnx-fp32-arm64
    runtime:
      family: firstfloor
      backend: ort-cuda
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cpu-amd64
    artifact: onnx-fp32-amd64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cuda-amd64
    artifact: onnx-fp32-amd64
    runtime:
      family: firstfloor
      backend: ort-cuda
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cpu-int8-arm64
    artifact: onnx-int8-arm64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cpu-int8-amd64
    artifact: onnx-int8-amd64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
