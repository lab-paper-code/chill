# Use metadata.name and spec as serving management API input, not kubectl apply.
# Images pin the pushed multi-arch carrier index digest (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: smolvlm2-500m-video-instruct
spec:
  artifacts:
  - name: onnx-fp32-arm64
    format: onnx
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-500m-onnx@sha256:c227f6f7f256e878dc7b8a20910c1bfceb74b8e82c25fa1828e67d0225b4e7ba"
      architecture: arm64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  - name: onnx-fp32-amd64
    format: onnx
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-500m-onnx@sha256:c227f6f7f256e878dc7b8a20910c1bfceb74b8e82c25fa1828e67d0225b4e7ba"
      architecture: amd64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  executionPaths:
  - name: firstfloor-ort-cpu-arm64
    artifact: onnx-fp32-arm64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cuda-arm64
    artifact: onnx-fp32-arm64
    runtime:
      family: firstfloor
      backend: ort-cuda
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cpu-amd64
    artifact: onnx-fp32-amd64
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
  - name: firstfloor-ort-cuda-amd64
    artifact: onnx-fp32-amd64
    runtime:
      family: firstfloor
      backend: ort-cuda
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
