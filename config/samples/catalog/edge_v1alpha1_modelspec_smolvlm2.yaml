# Use metadata.name and spec as serving management API input, not kubectl apply.
# Replace PUSHED_DIGEST with the digest of the pushed carrier (README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: ModelSpec
metadata:
  name: smolvlm2-500m-video-instruct
spec:
  artifacts:
  - name: onnx-fp32
    format: onnx
    source:
      image: "155.230.35.213:5000/chill/chill-smolvlm2-500m-onnx@sha256:PUSHED_DIGEST"
      architecture: arm64
      files:
      - /artifact/vision_encoder.onnx
      - /artifact/embed_tokens.onnx
      - /artifact/decoder_model_merged.onnx
  executionPaths:
  - name: firstfloor-ort-cpu
    artifact: onnx-fp32
    runtime:
      family: firstfloor
      backend: ort-cpu
      settings:
        firstfloor:
          maxBatchSize: 4
          maxQueueSize: 64
          deadlinePolicy: keep
