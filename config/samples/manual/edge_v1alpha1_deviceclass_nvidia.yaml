# Example hardware only; select the complete environment document (../README.md).
apiVersion: edge.dacs.io/v1alpha1
kind: DeviceClass
metadata:
  name: example-nvidia-device-class
spec:
  nodeSelector:
    edge.dacs.io/device-class: example-nvidia-device-class
  architecture: amd64
  memory: 8Gi
  accelerator: example-nvidia-gpu
  powerModes:
    - name: fixed
      actuator: {kind: Fixed}
    # GPU-only modes preserve each Node's online CPUs (no class-wide mask).
    - name: GPU_1500
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 1500, maxMHz: 1500}
    - name: GPU_1200
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 1200, maxMHz: 1200}
    - name: GPU_900
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 900, maxMHz: 900}
