apiVersion: edge.dacs.io/v1alpha1
kind: DeviceClass
metadata:
  name: edge-server-rtx-2080-ti-64g
spec:
  nodeSelector:
    edge.dacs.io/device-class: edge-server-rtx-2080-ti-64g
  architecture: amd64
  memory: 64Gi
  accelerator: nvidia-geforce-rtx-2080-ti
  powerModes:
    - name: fixed
      actuator: {kind: Fixed}
    - name: GPU_1500
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 1500, maxMHz: 1500}
    - name: GPU_1200
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 1200, maxMHz: 1200}
    - name: GPU_900
      actuator:
        kind: NvidiaLockedGPUClock
        nvidiaLockedGPUClock: {minMHz: 900, maxMHz: 900}
