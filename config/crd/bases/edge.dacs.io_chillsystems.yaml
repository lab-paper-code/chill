---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: chillsystems.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: ChillSystem
    listKind: ChillSystemList
    plural: chillsystems
    shortNames:
    - csys
    singular: chillsystem
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ChillSystem is the cluster-scoped root resource for a CHILL installation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChillSystemSpec defines one CHILL system instance managed
              by the operator.
            properties:
              deviceDiscovery:
                description: DeviceDiscovery configures node-based DeviceClass discovery.
                properties:
                  catalog:
                    description: Catalog references the ConfigMap containing the DeviceClass
                      catalog.
                    properties:
                      key:
                        description: Key is the ConfigMap data key.
                        type: string
                      name:
                        description: Name is the ConfigMap name.
                        type: string
                      namespace:
                        description: Namespace is the ConfigMap namespace. When omitted,
                          managementNamespace is used.
                        type: string
                    type: object
                  enabled:
                    description: Enabled controls whether the operator should derive
                      DeviceClasses from Nodes.
                    type: boolean
                  fallbackPowerModes:
                    description: |-
                      FallbackPowerModes are used for inferred DeviceClasses when catalog matching is not required
                      and a Node does not match a catalog entry.
                    items:
                      description: PowerMode binds a stable scheduler-facing name
                        to one typed actuator target.
                      properties:
                        actuator:
                          description: Actuator declares how a node agent applies
                            and verifies this mode.
                          properties:
                            jetsonNVPModel:
                              description: JetsonNVPModel is the target for the Jetson
                                nvpmodel actuator.
                              properties:
                                id:
                                  description: ID is passed to the platform nvpmodel
                                    interface.
                                  format: int32
                                  minimum: 0
                                  type: integer
                              required:
                              - id
                              type: object
                            kind:
                              description: Kind selects the typed actuator contract.
                              enum:
                              - Fixed
                              - JetsonNVPModel
                              - NvidiaLockedGPUClock
                              type: string
                            nvidiaLockedGPUClock:
                              description: NvidiaLockedGPUClock is the target for
                                the NVIDIA locked GPU clock actuator.
                              properties:
                                maxMHz:
                                  description: MaxMHz is the maximum requested locked
                                    GPU clock.
                                  format: int32
                                  minimum: 1
                                  type: integer
                                minMHz:
                                  description: MinMHz is the minimum requested locked
                                    GPU clock.
                                  format: int32
                                  minimum: 1
                                  type: integer
                                mode:
                                  description: Mode selects the NVIDIA clock-locking
                                    algorithm when declared.
                                  enum:
                                  - 0
                                  - 1
                                  format: int32
                                  type: integer
                              required:
                              - maxMHz
                              - minMHz
                              type: object
                              x-kubernetes-validations:
                              - message: minMHz must not exceed maxMHz
                                rule: self.minMHz <= self.maxMHz
                          required:
                          - kind
                          type: object
                          x-kubernetes-validations:
                          - message: Fixed actuator must not declare a target
                            rule: 'self.kind == ''Fixed'' ? !has(self.jetsonNVPModel)
                              && !has(self.nvidiaLockedGPUClock) : true'
                          - message: JetsonNVPModel actuator requires only jetsonNVPModel
                            rule: 'self.kind == ''JetsonNVPModel'' ? has(self.jetsonNVPModel)
                              && !has(self.nvidiaLockedGPUClock) : !has(self.jetsonNVPModel)'
                          - message: NvidiaLockedGPUClock actuator requires only nvidiaLockedGPUClock
                            rule: 'self.kind == ''NvidiaLockedGPUClock'' ? has(self.nvidiaLockedGPUClock)
                              && !has(self.jetsonNVPModel) : !has(self.nvidiaLockedGPUClock)'
                        name:
                          description: Name is the stable mode identity consumed by
                            CHILL scheduling and profiling.
                          minLength: 1
                          type: string
                      required:
                      - actuator
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  labelKey:
                    description: LabelKey is the Node label key used to bind Nodes
                      to DeviceClasses.
                    type: string
                  nodeLabelSelector:
                    description: NodeLabelSelector limits which Nodes participate
                      in discovery.
                    type: string
                  overwriteManualLabels:
                    description: |-
                      OverwriteManualLabels allows discovery to replace existing non-CHILL device-class labels.
                      When omitted, the operator default is used.
                    type: boolean
                  requireCatalogMatch:
                    description: |-
                      RequireCatalogMatch controls whether Nodes must match the catalog before a DeviceClass is created.
                      When omitted, the operator uses the safe default of true.
                    type: boolean
                type: object
              evidenceStore:
                description: EvidenceStore configures the operator-managed immutable
                  evidence store.
                properties:
                  configRef:
                    description: ConfigRef references the evidence-store configuration
                      in the CHILL management namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  enabled:
                    description: Enabled controls whether the operator should run
                      the evidence store.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: configRef.name is required when evidenceStore is enabled
                  rule: '!has(self.enabled) || !self.enabled || (has(self.configRef)
                    && self.configRef.name.size() > 0)'
              managementNamespace:
                description: |-
                  ManagementNamespace contains the namespaced CHILL support resources for this system.
                  When omitted, the operator namespace is used.
                type: string
              nodeDiscovery:
                description: NodeDiscovery configures the operator-managed node-discovery
                  DaemonSet.
                properties:
                  configMapKey:
                    description: ConfigMapKey is the data key containing node-discovery
                      config.
                    type: string
                  configMapName:
                    description: ConfigMapName overrides the generated node-discovery
                      config ConfigMap name.
                    type: string
                  daemonSetName:
                    description: DaemonSetName overrides the generated node-discovery
                      DaemonSet name.
                    type: string
                  enabled:
                    description: Enabled controls whether the operator should run
                      node-discovery.
                    type: boolean
                type: object
              profiler:
                description: Profiler configures the operator-managed Profiler controller.
                properties:
                  configRef:
                    description: ConfigRef references the Profiler workload configuration
                      in the CHILL release namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  enabled:
                    description: Enabled controls whether the operator should run
                      the Profiler controller.
                    type: boolean
                type: object
            type: object
          status:
            description: ChillSystemStatus defines the observed state of one CHILL
              system instance.
            properties:
              conditions:
                description: Conditions follow the Kubernetes status condition convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest spec generation observed
                  by the operator.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
