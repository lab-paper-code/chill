---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: batchenergyoptimizations.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: BatchEnergyOptimization
    listKind: BatchEnergyOptimizationList
    plural: batchenergyoptimizations
    shortNames:
    - beo
    singular: batchenergyoptimization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.outcome
      name: Outcome
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BatchEnergyOptimization searches one batch-size space for the minimum
          incremental energy per completed item by owning the ProfilingRun objects it
          creates.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              activeProtocol:
                properties:
                  dataset:
                    description: |-
                      Dataset names the cluster-scoped Dataset whose profiling records every
                      active child Run samples.
                    type: string
                  warmupIterations:
                    format: int32
                    minimum: 0
                    type: integer
                  workload:
                    description: Workload supplies the actual SLO percentile and latency
                      for this sweep.
                    type: string
                required:
                - dataset
                - warmupIterations
                - workload
                type: object
              session:
                description: Session holds the settings of a ChillServer measurement
                  session.
                properties:
                  confidenceLevel:
                    description: |-
                      ConfidenceLevel, a decimal in [0.5, 1), is the level of every statistical
                      decision the derivation makes.
                    type: string
                  deliveryMarginMilliseconds:
                    format: int32
                    minimum: 1
                    type: integer
                  framedDecodedRequestUpperBytes:
                    format: int64
                    minimum: 1
                    type: integer
                  levelDurationLimitSeconds:
                    description: LevelDurationLimitSeconds is the longest predicted
                      duration of one level.
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                  meterLagSeconds:
                    description: MeterLagSeconds is the power meter lag discarded
                      at each level start.
                    minimum: 0
                    type: number
                  midLevelRatio:
                    description: MidLevelRatio is the mid level arrival rate as a
                      ratio of saturation throughput.
                    exclusiveMaximum: true
                    exclusiveMinimum: true
                    maximum: 1
                    minimum: 0
                    type: number
                  minimumPowerWindowSeconds:
                    description: MinimumPowerWindowSeconds is the shortest power observation
                      of a level.
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                  observation:
                    description: |-
                      Observation is how the session's power, prepare and remove operations
                      are measured, as in a stand-alone operation-cost measurement.
                    properties:
                      intervalMilliseconds:
                        format: int32
                        minimum: 1
                        type: integer
                      maximumGapMilliseconds:
                        description: |-
                          MaximumGapMilliseconds flags full original long gaps for missing correction,
                          rather than rejecting their coverage.
                        format: int32
                        minimum: 1
                        type: integer
                      maximumOperationSeconds:
                        description: MaximumOperationSeconds bounds the physical action,
                          excluding pre/post capture.
                        format: int32
                        minimum: 1
                        type: integer
                      requestTimeoutMilliseconds:
                        format: int32
                        minimum: 1
                        type: integer
                      timing:
                        description: Timing freezes the required empirical observation
                          inputs.
                        properties:
                          changeIntervalP95Seconds:
                            pattern: ^[0-9]+(\.[0-9]+)?$
                            type: string
                          maximumReceiptGapSeconds:
                            pattern: ^[0-9]+(\.[0-9]+)?$
                            type: string
                          maximumRequestSeconds:
                            pattern: ^[0-9]+(\.[0-9]+)?$
                            type: string
                          source:
                            description: Source identifies the completed observation
                              and any device transfer.
                            minLength: 1
                            type: string
                        required:
                        - changeIntervalP95Seconds
                        - maximumReceiptGapSeconds
                        - maximumRequestSeconds
                        - source
                        type: object
                    required:
                    - intervalMilliseconds
                    - maximumGapMilliseconds
                    - maximumOperationSeconds
                    - requestTimeoutMilliseconds
                    - timing
                    type: object
                    x-kubernetes-validations:
                    - message: requestTimeoutMilliseconds must be less than intervalMilliseconds
                      rule: self.requestTimeoutMilliseconds < self.intervalMilliseconds
                  postLoadWindowSeconds:
                    description: PostLoadWindowSeconds observes the loaded actor without
                      inference after the last level.
                    type: number
                  requestLifetimeSeconds:
                    format: int32
                    type: integer
                  sparseMeanGapSeconds:
                    description: SparseMeanGapSeconds is the sparse level's mean idle
                      gap.
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                required:
                - confidenceLevel
                - deliveryMarginMilliseconds
                - framedDecodedRequestUpperBytes
                - levelDurationLimitSeconds
                - meterLagSeconds
                - midLevelRatio
                - minimumPowerWindowSeconds
                - observation
                - requestLifetimeSeconds
                - sparseMeanGapSeconds
                type: object
                x-kubernetes-validations:
                - message: requestLifetimeSeconds must exceed deliveryMarginMilliseconds
                  rule: self.requestLifetimeSeconds * 1000 > self.deliveryMarginMilliseconds
              state:
                description: |-
                  MeasurementStateSpec fixes the execution state every trial of one
                  measurement shares.
                properties:
                  candidate:
                    description: Candidate selects one static catalog execution path.
                    properties:
                      deviceClass:
                        description: DeviceClass names the cluster-scoped DeviceClass.
                        maxLength: 253
                        minLength: 1
                        type: string
                      executionPath:
                        description: ExecutionPath selects one path declared by ModelSpec.
                        maxLength: 128
                        minLength: 1
                        type: string
                      modelSpec:
                        description: ModelSpec names the cluster-scoped ModelSpec.
                        maxLength: 253
                        minLength: 1
                        type: string
                      powerMode:
                        description: |-
                          PowerMode selects one mode declared by DeviceClass. Fixed Runs may execute
                          directly; a non-fixed selection requires a selected configured actuation
                          policy and a completed transition that confirms the required state.
                        maxLength: 128
                        minLength: 1
                        type: string
                      preprocessor:
                        description: |-
                          Preprocessor names the cluster-scoped Preprocessor whose artifact for the
                          selected model artifact runs beside the model.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - deviceClass
                    - executionPath
                    - modelSpec
                    - powerMode
                    - preprocessor
                    type: object
                  targetNode:
                    description: TargetNode names the Kubernetes Node on which the
                      Run is requested.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - candidate
                - targetNode
                type: object
            required:
            - activeProtocol
            - session
            - state
            type: object
            x-kubernetes-validations:
            - message: BatchEnergyOptimization spec is immutable
              rule: self == oldSelf
          status:
            properties:
              completedBatches:
                description: CompletedBatches counts the batch sizes a session measured.
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              outcome:
                type: string
              phase:
                type: string
              result:
                properties:
                  key:
                    description: Key is opaque to API consumers.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  schemaVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  store:
                    description: Store is the logical CHILL-managed store identity,
                      not an endpoint.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - schemaVersion
                - size
                - store
                type: object
            type: object
        required:
        - spec
        type: object
