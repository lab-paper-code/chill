---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: profilingruns.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: ProfilingRun
    listKind: ProfilingRunList
    plural: profilingruns
    shortNames:
    - prun
    singular: profilingrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="ExecutionComplete")].status
      name: Execution
      type: string
    - jsonPath: .status.conditions[?(@.type=="EvidenceVerified")].status
      name: Evidence
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProfilingRun requests and reports one immutable profiling execution.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProfilingRunSpec requests exactly one immutable profiling execution.
              Materially different inputs require a new ProfilingRun.
            properties:
              candidate:
                description: Candidate selects one static catalog execution path.
                properties:
                  deviceClass:
                    description: DeviceClass names the cluster-scoped DeviceClass.
                    maxLength: 253
                    minLength: 1
                    type: string
                  executionPath:
                    description: ExecutionPath selects one path declared by ModelSpec.
                    maxLength: 128
                    minLength: 1
                    type: string
                  modelSpec:
                    description: ModelSpec names the cluster-scoped ModelSpec.
                    maxLength: 253
                    minLength: 1
                    type: string
                  powerMode:
                    description: |-
                      PowerMode selects one mode declared by DeviceClass. Fixed Runs may execute
                      directly; a non-fixed selection requires a selected configured actuation
                      policy and a completed transition that confirms the required state.
                    maxLength: 128
                    minLength: 1
                    type: string
                  preprocessor:
                    description: |-
                      Preprocessor names the cluster-scoped Preprocessor whose artifact for the
                      selected model artifact runs beside the model.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - deviceClass
                - executionPath
                - modelSpec
                - powerMode
                - preprocessor
                type: object
              cpuRequest:
                anyOf:
                - type: integer
                - type: string
                description: CPURequest is the non-exclusive scheduling request for
                  the runtime container.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              measurement:
                description: Measurement fixes the single-Run workload and measurement
                  window.
                properties:
                  batch:
                    format: int32
                    minimum: 1
                    type: integer
                  cpuAffinity:
                    description: |-
                      CPUAffinity optionally selects explicit Linux CPU IDs for firstfloor execution.
                      It does not reserve CPUs or claim exclusivity.
                    items:
                      format: int32
                      minimum: 0
                      type: integer
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  cpuQuota:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      CPUQuota optionally selects a configured whole-core runtime quota. It is
                      consumed while freezing the Run and is not duplicated in MeasurementContract.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  dataset:
                    description: |-
                      Dataset names the cluster-scoped Dataset whose profiling records active
                      measurement samples. Idle measurement has none.
                    maxLength: 253
                    minLength: 1
                    type: string
                  durationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                  settlingDurationSeconds:
                    description: |-
                      SettlingDurationSeconds is required only for model-loaded idle. The
                      runtime loads the model before this observer-independent settling period.
                    format: int32
                    minimum: 1
                    type: integer
                  warmupIterations:
                    format: int32
                    minimum: 0
                    type: integer
                  workloadMode:
                    enum:
                    - saturated-serial-fixed-batch
                    - idle-model-loaded
                    type: string
                required:
                - batch
                - durationSeconds
                - warmupIterations
                - workloadMode
                type: object
                x-kubernetes-validations:
                - message: measurement fields must match the selected workloadMode
                  rule: 'self.workloadMode == ''idle-model-loaded'' ? self.warmupIterations
                    == 0 && has(self.settlingDurationSeconds) && !has(self.dataset)
                    : !has(self.settlingDurationSeconds) && has(self.dataset)'
                - message: cpuQuota must be positive
                  rule: '!has(self.cpuQuota) || quantity(self.cpuQuota).compareTo(quantity(''0''))
                    > 0'
                - message: cpuQuota must be a whole number of CPU cores
                  rule: '!has(self.cpuQuota) || quantity(self.cpuQuota).isInteger()'
              metricObservation:
                description: MetricObservation fixes polling behavior. The source
                  is resolved from TargetNode.
                properties:
                  durationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                  intervalMilliseconds:
                    format: int32
                    minimum: 1
                    type: integer
                  timeoutMilliseconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - durationSeconds
                - intervalMilliseconds
                - timeoutMilliseconds
                type: object
                x-kubernetes-validations:
                - message: timeoutMilliseconds must be less than intervalMilliseconds
                  rule: self.timeoutMilliseconds < self.intervalMilliseconds
              targetNode:
                description: TargetNode names the Kubernetes Node on which the Run
                  is requested.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - candidate
            - cpuRequest
            - measurement
            - metricObservation
            - targetNode
            type: object
            x-kubernetes-validations:
            - message: ProfilingRun spec is immutable
              rule: self == oldSelf
            - message: metricObservation.durationSeconds must cover measurement.durationSeconds
              rule: self.metricObservation.durationSeconds >= self.measurement.durationSeconds
            - message: cpuRequest must be positive
              rule: quantity(self.cpuRequest).compareTo(quantity('0')) > 0
            - message: cpuRequest must not exceed measurement.cpuQuota
              rule: '!has(self.measurement.cpuQuota) || quantity(self.cpuRequest).compareTo(quantity(self.measurement.cpuQuota))
                <= 0'
          status:
            description: ProfilingRunStatus contains compact, reconstructable Run
              outcomes.
            properties:
              actualExecution:
                description: Records the Pod and Node identities observed after the
                  Run was scheduled.
                properties:
                  node:
                    description: ProfilingRunObjectReference is deliberately smaller
                      than corev1.ObjectReference.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  pod:
                    description: ProfilingRunObjectReference is deliberately smaller
                      than corev1.ObjectReference.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                required:
                - node
                - pod
                type: object
              conditions:
                description: Conditions separately report execution and evidence verification.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidence:
                description: Evidence identifies independently verified immutable
                  execution evidence.
                properties:
                  key:
                    description: Key is opaque to API consumers.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  schemaVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  store:
                    description: Store is the logical CHILL-managed store identity,
                      not an endpoint.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - schemaVersion
                - size
                - store
                type: object
              evidenceStore:
                description: EvidenceStore retains the frozen delivery binding after
                  native Job cleanup.
                properties:
                  bucket:
                    minLength: 1
                    type: string
                  credentialsSecretName:
                    minLength: 1
                    type: string
                  endpoint:
                    minLength: 1
                    type: string
                  region:
                    minLength: 1
                    type: string
                  store:
                    minLength: 1
                    type: string
                required:
                - bucket
                - credentialsSecretName
                - endpoint
                - region
                - store
                type: object
              job:
                description: Job identifies the one owned native Job after creation.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              jobCleanup:
                description: JobCleanup records whether terminal native Job cleanup
                  remains pending.
                enum:
                - Pending
                - Done
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest spec generation processed
                  by the Profiler.
                format: int64
                type: integer
              runtimeTermination:
                description: |-
                  RuntimeTermination keeps the failed runtime container's exit code and
                  log tail, so the cause of a failed Job outlives its Pod.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  logTail:
                    description: |-
                      LogTail is the runtime termination message, which Kubernetes fills
                      with the last 80 lines or 2 KiB of the container log on failure.
                    maxLength: 4096
                    type: string
                required:
                - exitCode
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
