---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: profilingruns.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: ProfilingRun
    listKind: ProfilingRunList
    plural: profilingruns
    shortNames:
    - prun
    singular: profilingrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="ExecutionComplete")].status
      name: Execution
      type: string
    - jsonPath: .status.conditions[?(@.type=="EvidenceVerified")].status
      name: Evidence
      type: string
    - jsonPath: .status.conditions[?(@.type=="EvidenceAdmitted")].status
      name: Admitted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProfilingRun requests and reports one immutable profiling execution.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProfilingRunSpec requests exactly one immutable profiling execution.
              Materially different inputs require a new ProfilingRun.
            properties:
              admissionPolicy:
                description: AdmissionPolicy identifies the configured single-Run
                  scientific admission policy.
                enum:
                - wall-power-v1
                maxLength: 128
                minLength: 1
                type: string
              candidate:
                description: Candidate selects one static catalog execution path.
                properties:
                  deviceClass:
                    description: DeviceClass names the cluster-scoped DeviceClass.
                    maxLength: 253
                    minLength: 1
                    type: string
                  executionPath:
                    description: ExecutionPath selects one path declared by ModelSpec.
                    maxLength: 128
                    minLength: 1
                    type: string
                  modelSpec:
                    description: ModelSpec names the cluster-scoped ModelSpec.
                    maxLength: 253
                    minLength: 1
                    type: string
                  powerMode:
                    description: |-
                      PowerMode selects one mode declared by DeviceClass. The first supported
                      CPU path accepts only the non-actuated "fixed" mode.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - deviceClass
                - executionPath
                - modelSpec
                - powerMode
                type: object
              cpuRequest:
                anyOf:
                - type: integer
                - type: string
                description: CPURequest is the non-exclusive scheduling request for
                  the runtime container.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              measurement:
                description: Measurement fixes the single-Run workload and measurement
                  window.
                properties:
                  batch:
                    format: int32
                    minimum: 1
                    type: integer
                  durationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                  inputGenerator:
                    maxLength: 128
                    minLength: 1
                    type: string
                  outputValidation:
                    maxLength: 128
                    minLength: 1
                    type: string
                  repetitions:
                    description: The first path treats each ProfilingRun as one independent
                      trial.
                    format: int32
                    maximum: 1
                    minimum: 1
                    type: integer
                  warmupIterations:
                    format: int32
                    minimum: 0
                    type: integer
                  workloadMode:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - batch
                - durationSeconds
                - inputGenerator
                - outputValidation
                - repetitions
                - warmupIterations
                - workloadMode
                type: object
              powerObservation:
                description: PowerObservation fixes polling behavior. The source is
                  resolved from TargetNode.
                properties:
                  durationSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                  intervalMilliseconds:
                    format: int32
                    minimum: 1
                    type: integer
                  timeoutMilliseconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - durationSeconds
                - intervalMilliseconds
                - timeoutMilliseconds
                type: object
                x-kubernetes-validations:
                - message: timeoutMilliseconds must be less than intervalMilliseconds
                  rule: self.timeoutMilliseconds < self.intervalMilliseconds
              targetNode:
                description: TargetNode names the Kubernetes Node on which the Run
                  is requested.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - admissionPolicy
            - candidate
            - cpuRequest
            - measurement
            - powerObservation
            - targetNode
            type: object
            x-kubernetes-validations:
            - message: ProfilingRun spec is immutable
              rule: self == oldSelf
            - message: powerObservation.durationSeconds must cover measurement.durationSeconds
              rule: self.powerObservation.durationSeconds >= self.measurement.durationSeconds
            - message: cpuRequest must be positive
              rule: quantity(self.cpuRequest).compareTo(quantity('0')) > 0
          status:
            description: ProfilingRunStatus contains compact, reconstructable Run
              outcomes.
            properties:
              actualExecution:
                description: ActualExecution records the Pod and Node identities observed
                  after scheduling.
                properties:
                  node:
                    description: ProfilingRunObjectReference is deliberately smaller
                      than corev1.ObjectReference.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  pod:
                    description: ProfilingRunObjectReference is deliberately smaller
                      than corev1.ObjectReference.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                required:
                - node
                - pod
                type: object
              admission:
                description: Admission records the evaluated scientific verdict without
                  raw evidence.
                properties:
                  policyVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  reasonCodes:
                    description: ReasonCodes contains stable typed codes, not raw
                      diagnostic messages.
                    items:
                      maxLength: 128
                      minLength: 1
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  verdict:
                    enum:
                    - Accepted
                    - Rejected
                    - Insufficient
                    type: string
                required:
                - policyVersion
                - verdict
                type: object
              conditions:
                description: Conditions separately report execution, evidence verification,
                  and admission.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidence:
                description: Evidence identifies independently verified immutable
                  execution evidence.
                properties:
                  digest:
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  key:
                    description: Key is opaque to API consumers.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  schemaVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  store:
                    description: Store is the logical CHILL-managed store identity,
                      not an endpoint.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - digest
                - key
                - schemaVersion
                - size
                - store
                type: object
              intentDigest:
                description: IntentDigest identifies the exact frozen execution intent.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              job:
                description: Job identifies the one owned native Job after creation.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              observedGeneration:
                description: ObservedGeneration is the latest spec generation processed
                  by the Profiler.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
