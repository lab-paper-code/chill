---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: deviceclasses.edge.dacs.io
spec:
  group: edge.dacs.io
  names:
    kind: DeviceClass
    listKind: DeviceClassList
    plural: deviceclasses
    singular: deviceclass
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DeviceClass is the Schema for the deviceclasses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeviceClassSpec defines the desired state of DeviceClass
            properties:
              accelerator:
                description: Accelerator names the accelerator family exposed by this
                  class, or "none".
                type: string
              architecture:
                description: Architecture is the CPU architecture exposed by Kubernetes
                  for this class.
                minLength: 1
                type: string
              memory:
                anyOf:
                - type: integer
                - type: string
                description: MemoryBytes is the total unified or system memory available
                  on this class.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector selects nodes that belong to this device class.
                  Discovery starts as explicit label matching; automatic node feature
                  discovery is intentionally outside this resource's first schema.
                minProperties: 1
                type: object
              powerModes:
                description: PowerModes lists the power modes supported by this class.
                items:
                  description: PowerMode binds a stable scheduler-facing name to one
                    typed actuator target.
                  properties:
                    actuator:
                      description: Actuator declares how a node agent applies and
                        verifies this mode.
                      properties:
                        jetsonNVPModel:
                          description: JetsonNVPModel is the target for the Jetson
                            nvpmodel actuator.
                          properties:
                            id:
                              description: ID is passed to the platform nvpmodel interface.
                              format: int32
                              minimum: 0
                              type: integer
                          required:
                          - id
                          type: object
                        kind:
                          description: Kind selects the typed actuator contract.
                          enum:
                          - Fixed
                          - JetsonNVPModel
                          - NvidiaLockedGPUClock
                          type: string
                        nvidiaLockedGPUClock:
                          description: NvidiaLockedGPUClock is the target for the
                            NVIDIA locked GPU clock actuator.
                          properties:
                            maxMHz:
                              description: MaxMHz is the maximum requested locked
                                GPU clock.
                              format: int32
                              minimum: 1
                              type: integer
                            minMHz:
                              description: MinMHz is the minimum requested locked
                                GPU clock.
                              format: int32
                              minimum: 1
                              type: integer
                            mode:
                              description: Mode selects the NVIDIA clock-locking algorithm
                                when declared.
                              enum:
                              - 0
                              - 1
                              format: int32
                              type: integer
                          required:
                          - maxMHz
                          - minMHz
                          type: object
                          x-kubernetes-validations:
                          - message: minMHz must not exceed maxMHz
                            rule: self.minMHz <= self.maxMHz
                      required:
                      - kind
                      type: object
                      x-kubernetes-validations:
                      - message: Fixed actuator must not declare a target
                        rule: 'self.kind == ''Fixed'' ? !has(self.jetsonNVPModel)
                          && !has(self.nvidiaLockedGPUClock) : true'
                      - message: JetsonNVPModel actuator requires only jetsonNVPModel
                        rule: 'self.kind == ''JetsonNVPModel'' ? has(self.jetsonNVPModel)
                          && !has(self.nvidiaLockedGPUClock) : !has(self.jetsonNVPModel)'
                      - message: NvidiaLockedGPUClock actuator requires only nvidiaLockedGPUClock
                        rule: 'self.kind == ''NvidiaLockedGPUClock'' ? has(self.nvidiaLockedGPUClock)
                          && !has(self.jetsonNVPModel) : !has(self.nvidiaLockedGPUClock)'
                    name:
                      description: Name is the stable mode identity consumed by CHILL
                        scheduling and profiling.
                      minLength: 1
                      type: string
                  required:
                  - actuator
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - architecture
            - memory
            - nodeSelector
            - powerModes
            type: object
          status:
            description: DeviceClassStatus defines the observed state of DeviceClass
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
