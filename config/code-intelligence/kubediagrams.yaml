nodes:
  ChillSystem/edge.dacs.io/v1alpha1:
    scope: Cluster
    diagram_node_classname: diagrams.k8s.others.CRD
    edges: |
      management_namespace = query_path(resource, "spec.managementNamespace")

      node_agent_config = query_path(resource, "spec.nodeAgent.configRef.name")
      if node_agent_config:
        edges.add_edge_to(
          "spec.nodeAgent.configRef.name",
          node_agent_config,
          management_namespace,
          "ConfigMap",
          "v1",
          "REFERENCE"
        )

      profiler_config = query_path(resource, "spec.profiler.configRef.name")
      if profiler_config:
        edges.add_edge_to(
          "spec.profiler.configRef.name",
          profiler_config,
          management_namespace,
          "ConfigMap",
          "v1",
          "REFERENCE"
        )

      catalog_name = query_path(resource, "spec.deviceDiscovery.catalog.name")
      catalog_namespace = query_path(resource, "spec.deviceDiscovery.catalog.namespace")
      if catalog_name:
        edges.add_edge_to(
          "spec.deviceDiscovery.catalog.name",
          catalog_name,
          catalog_namespace,
          "ConfigMap",
          "v1",
          "REFERENCE"
        )
