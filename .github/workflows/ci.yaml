name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        # Match NUMPY_VERSION in build/docker/firstfloor.Dockerfile.
        run: python3 -m pip install numpy==2.2.6

      - name: Check generated artifacts
        run: |
          make manifests generate
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Check package architecture
        run: make arch-check

      - name: Run linter
        run: make lint

      - name: Run tests
        run: make test

      - name: Check Helm chart
        run: |
          make helm-lint
          make helm-template
          helm lint charts/chill --set profiler.enabled=true
          helm template chill charts/chill --namespace chill-system --set profiler.enabled=true >/dev/null
