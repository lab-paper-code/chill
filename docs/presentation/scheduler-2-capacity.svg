<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="NanumSquare, 'Noto Sans CJK KR', sans-serif"><defs>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<style>.t{font-size:18px;font-weight:800;fill:#0F172A;text-anchor:middle;dominant-baseline:middle}
.s{font-size:14px;fill:#475569;text-anchor:middle;dominant-baseline:middle}
.h{font-size:16px;font-weight:800;fill:#334155;dominant-baseline:middle}
.n{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}
.lb{font-size:14px;font-weight:800;dominant-baseline:middle}
.tag{font-size:12px;font-weight:800;dominant-baseline:middle}</style></defs>
<text x="60" y="38" class="h" style="text-anchor:start;fill:#0F172A;font-size:24px">스케줄러 ② 1단계: 처리 한도표는 어떻게 만드나</text>
<rect x="1560" y="14" width="320" height="56" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
<rect x="1568" y="22" width="60" height="40" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="1598" y="43" class="tag" style="text-anchor:middle;fill:#94A3B8">입력</text>
<rect x="1636" y="22" width="150" height="18" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
<text x="1711" y="32" class="tag" style="text-anchor:middle;fill:#1D4ED8">1단계</text>
<rect x="1636" y="44" width="150" height="18" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
<text x="1711" y="54" class="tag" style="text-anchor:middle;fill:#C4B5FD">2단계</text>
<rect x="1794" y="22" width="78" height="40" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
<text x="1833" y="43" class="tag" style="text-anchor:middle;fill:#86EFAC">결과</text>
<text x="1550" y="43" class="s" style="text-anchor:end;font-size:13px">전체 그림에서 이 부분</text>
<text x="60" y="88" class="h" style="text-anchor:start">후보 하나에 들어가는 것</text>
<rect x="80" y="104" width="410" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="285.0" y="134" class="t" style="font-size:17px">후보 조합</text>
<text x="285.0" y="162" class="s">장비 + 전력 모드 +</text>
<text x="285.0" y="182" class="s">실행 방식 + 묶음 크기 상한</text>
<path d="M285.0,214 V276" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
<rect x="530" y="104" width="410" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="735.0" y="134" class="t" style="font-size:17px">측정된 실행 시간</text>
<text x="735.0" y="162" class="s">묶음 크기별 실측 표본</text>
<text x="735.0" y="182" class="s">(측정 결과 저장소)</text>
<path d="M735.0,214 V276" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
<rect x="980" y="104" width="410" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="1185.0" y="134" class="t" style="font-size:17px">요청 사이 점유 시간</text>
<text x="1185.0" y="162" class="s">묶음 실행 밖에서 쓰는 시간</text>
<text x="1185.0" y="182" class="s">실측값 · 없으면 계산 불가</text>
<path d="M1185.0,214 V276" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
<rect x="1430" y="104" width="410" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="1635.0" y="134" class="t" style="font-size:17px">응답 시간 약속</text>
<text x="1635.0" y="162" class="s">예: 95%가 1초 안</text>
<text x="1635.0" y="182" class="s">− 서버 · 네트워크 몫(완료 여유)</text>
<path d="M1635.0,214 V276" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
<rect x="60" y="278" width="1800" height="232" rx="14" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
<text x="80" y="300" class="h" style="text-anchor:start;fill:#1D4ED8">후보 하나마다 · 후보끼리는 동시에 계산</text>
<rect x="80" y="320" width="320" height="170" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="98" cy="338" r="12" fill="#1D4ED8"/>
<text x="98" y="339" class="n">1</text>
<text x="240.0" y="366" class="t">최대 처리량 계산</text>
<text x="240.0" y="398" class="s">묶음을 꽉 채워 쉬지 않고</text>
<text x="240.0" y="419" class="s">돌릴 때의 초당 건수</text>
<path d="M400,405.0 H438" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="440" y="320" width="320" height="170" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="458" cy="338" r="12" fill="#1D4ED8"/>
<text x="458" y="339" class="n">2</text>
<text x="600.0" y="366" class="t">애초에 안 되는 후보 거르기</text>
<text x="600.0" y="398" class="s">가장 빨리 처리돼도 약속 시간을</text>
<text x="600.0" y="419" class="s">넘는다면? (예: 실행만 1.2초, 약속 1초)</text>
<text x="600.0" y="460" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:13px">→ 한도 0 · 시험 없이 바로 결정</text>
<path d="M760,405.0 H798" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="800" y="320" width="320" height="170" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="818" cy="338" r="12" fill="#1D4ED8"/>
<text x="818" y="339" class="n">3</text>
<text x="960.0" y="366" class="t">요청률 단계별 판정</text>
<text x="960.0" y="398" class="s">최대 처리량의 5%, 10% … 100%</text>
<text x="960.0" y="419" class="s">20단계를 모두 가상 재생</text>
<text x="960.0" y="460" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:12px">실패 뒤 더 높은 요청률에서 통과 → 제외</text>
<path d="M1120,405.0 H1158" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="1160" y="320" width="320" height="170" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="1178" cy="338" r="12" fill="#1D4ED8"/>
<text x="1178" y="339" class="n">4</text>
<text x="1320.0" y="366" class="t">경계 좁히기</text>
<text x="1320.0" y="398" class="s">마지막 통과와 첫 실패 사이를</text>
<text x="1320.0" y="419" class="s">최대 처리량의 0.5% 이하 폭까지</text>
<path d="M1480,405.0 H1518" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="1520" y="320" width="320" height="170" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<circle cx="1538" cy="338" r="12" fill="#1D4ED8"/>
<text x="1538" y="339" class="n">5</text>
<text x="1680.0" y="366" class="t">처리 한도 기록</text>
<text x="1680.0" y="398" class="s">약속을 지키는</text>
<text x="1680.0" y="419" class="s">최대 요청률 (초당 건수)</text>
<rect x="60" y="560" width="1100" height="410" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="80" y="584" class="h" style="text-anchor:start">③ · ④ · ⑤ 를 그림으로: 요청률을 올리면 지연이 어느 순간 급격히 늘어난다</text>
<line x1="150" y1="880" x2="1070" y2="880" stroke="#334155" stroke-width="2"/>
<line x1="150" y1="880" x2="150" y2="615" stroke="#334155" stroke-width="2"/>
<text x="140" y="626" class="lb" style="text-anchor:end;fill:#475569;font-size:13px">지연</text>
<text x="140" y="646" class="s" style="text-anchor:end;font-size:12px">(95%)</text>
<text x="1070" y="920" class="lb" style="text-anchor:end;fill:#475569;font-size:13px">요청률 → (최대 처리량의 %)</text>
<path d="M150,700 H1052" fill="none" stroke="#B91C1C" stroke-width="2" stroke-dasharray="8 5"/>
<text x="158" y="688" class="lb" style="text-anchor:start;fill:#B91C1C;font-size:13px">약속 시간</text>
<rect x="156.75" y="855.5" width="31.499999999999996" height="24.5" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<text x="172.5" y="898" class="s" style="font-size:12px">5%</text>
<rect x="201.75" y="853.05" width="31.499999999999996" height="26.95" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="246.75" y="853.05" width="31.499999999999996" height="26.95" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="291.75" y="850.6" width="31.499999999999996" height="29.4" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="336.75" y="848.15" width="31.499999999999996" height="31.849999999999998" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<text x="352.5" y="898" class="s" style="font-size:12px">25%</text>
<rect x="381.75" y="845.7" width="31.499999999999996" height="34.3" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="426.75" y="843.25" width="31.499999999999996" height="36.75" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="471.75" y="840.8" width="31.499999999999996" height="39.2" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="516.75" y="835.9" width="31.499999999999996" height="44.1" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="561.75" y="831.0" width="31.499999999999996" height="49.0" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<text x="577.5" y="898" class="s" style="font-size:12px">50%</text>
<rect x="606.75" y="826.1" width="31.499999999999996" height="53.9" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="651.75" y="818.75" width="31.499999999999996" height="61.25" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="696.75" y="808.95" width="31.499999999999996" height="71.05" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="741.75" y="796.7" width="31.499999999999996" height="83.3" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="786.75" y="779.55" width="31.499999999999996" height="100.45" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<text x="802.5" y="898" class="s" style="font-size:12px">75%</text>
<rect x="831.75" y="757.5" width="31.499999999999996" height="122.5" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<rect x="876.75" y="728.1" width="31.499999999999996" height="151.9" rx="3" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2.5"/>
<rect x="921.75" y="669.3" width="31.499999999999996" height="210.7" rx="3" fill="#FECACA" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="966.75" y="642.35" width="31.499999999999996" height="237.65" rx="3" fill="#FECACA" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="1011.75" y="635.0" width="31.499999999999996" height="245.0" rx="3" fill="#FECACA" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1027.5" y="898" class="s" style="font-size:12px">100%</text>
<path d="M915.0,620 V880" fill="none" stroke="#1D4ED8" stroke-width="3"/>

<rect x="150" y="925" width="18" height="18" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
<text x="176" y="934" class="s" style="text-anchor:start;font-size:13px">통과</text>
<rect x="480" y="925" width="18" height="18" rx="3" fill="#FECACA" stroke="#B91C1C" stroke-width="1.5"/>
<text x="506" y="934" class="s" style="text-anchor:start;font-size:13px">실패</text>
<rect x="580" y="925" width="18" height="18" rx="3" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="618" y="934" class="s" style="text-anchor:start;font-size:13px">마지막 통과 = 처리 한도</text>








<rect x="1220" y="560" width="640" height="215" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="1240" y="584" class="h" style="text-anchor:start;fill:#15803D">후보마다 결과는 세 가지</text>
<rect x="1240" y="606" width="150" height="32" rx="16" fill="#fff" stroke="#15803D" stroke-width="2"/>
<text x="1315" y="622" class="lb" style="text-anchor:middle;fill:#15803D;font-size:14px">처리 한도</text>
<text x="1408" y="622" class="s" style="text-anchor:start">초당 건수 · 2단계에서 사용</text>
<rect x="1240" y="654" width="150" height="32" rx="16" fill="#fff" stroke="#B91C1C" stroke-width="2"/>
<text x="1315" y="670" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:14px">한도 0</text>
<text x="1408" y="670" class="s" style="text-anchor:start">가장 빨리 처리돼도 약속 시간을 넘음</text>
<rect x="1240" y="702" width="150" height="32" rx="16" fill="#fff" stroke="#64748B" stroke-width="2"/>
<text x="1315" y="718" class="lb" style="text-anchor:middle;fill:#64748B;font-size:14px">계산 제외</text>
<text x="1408" y="718" class="s" style="text-anchor:start">점유 시간 측정 없음 · 결과가 불규칙</text>
<path d="M1680.0,490 V558" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#g)"/>
<rect x="1220" y="795" width="640" height="175" rx="14" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/>
<text x="1240" y="819" class="h" style="text-anchor:start">언제 다시 계산하나</text>
<text x="1244" y="853" class="s" style="text-anchor:start;font-size:14px">• CHILL 서버가 시작할 때: 표 전체</text>
<text x="1244" y="881" class="s" style="text-anchor:start;font-size:14px">• 서비스 자동 제어를 켤 때</text>
<text x="1244" y="909" class="s" style="text-anchor:start;font-size:14px">• 약속 · 측정 결과 · 점유 시간 · 설정이 바뀔 때: 해당 후보만</text>
<text x="1244" y="937" class="s" style="text-anchor:start;fill:#64748B;font-size:14px">※ 요청량이 바뀌는 것만으로는 다시 계산하지 않음</text>
<rect x="176" y="720" width="490" height="112" rx="8" fill="#fff" stroke="#93C5FD" stroke-width="1.5"/>
<text x="192" y="742" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">막대 하나는 어떻게 통과·실패를 정하나</text>
<text x="192" y="768" class="s" style="text-anchor:start;font-size:13px">무작위 도착 요청을 재생해 최대 20번 시험 (포아송 도착)</text>
<text x="192" y="791" class="s" style="text-anchor:start;font-size:13px">각 최소 1,000건 · 60초 도착량과 꼬리 지연 표본 수를 반영</text>
<text x="192" y="814" class="s" style="text-anchor:start;font-size:13px">19번 이상 약속 충족이면 통과 · 판정이 정해지면 조기 종료</text>
<circle cx="560" cy="655" r="11" fill="#1D4ED8"/><text x="560" y="656" class="n">3</text><text x="578" y="655" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">20단계 요청률을 차례로 시험</text><circle cx="640" cy="606" r="11" fill="#1D4ED8"/><text x="640" y="607" class="n">4</text><text x="658" y="606" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">통과·실패 사이를 반씩 좁힘 →</text><circle cx="932" cy="606" r="11" fill="#1D4ED8"/><text x="932" y="607" class="n">5</text><text x="950" y="606" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">처리 한도</text></svg>