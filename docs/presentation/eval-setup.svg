<text x="100" y="912" class="s" style="text-anchor:start;font-size:13px">· genesis1: CHILL 서버 · 입구 전용</text>
<text x="100" y="936" class="s" style="text-anchor:start;font-size:13px">· genesis2: GPU 오류(Xid 79) 반복</text>
<text x="100" y="960" class="s" style="text-anchor:start;font-size:13px">· orin-nano: 실험 대상 외</text>
