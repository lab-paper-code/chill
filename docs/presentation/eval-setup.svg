<text x="710" y="884" class="s" style="text-anchor:start;font-size:13px">· 이미지 분류: 이미지 1장</text>
<text x="710" y="908" class="s" style="text-anchor:start;font-size:13px">· PLC 이상탐지: 압출기 센서 구간 데이터</text>
<text x="710" y="932" class="s" style="text-anchor:start;font-size:13px">· 영상 질의응답: VQAv2 질문 · 이미지</text>
