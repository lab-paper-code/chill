<text x="694" y="780" class="s" style="text-anchor:start;fill:#0F172A;font-size:13px">R: 장비 7대를 그 서비스에만 쓸 때의 처리 한도 합</text>
<text x="694" y="804" class="s" style="text-anchor:start;font-size:13px">세 서비스의 R을 동시에 낼 수 있다는 뜻은 아님</text>
