<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="NanumSquare, 'Noto Sans CJK KR', sans-serif"><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
<style>.t{font-size:18px;font-weight:800;fill:#0F172A;text-anchor:middle;dominant-baseline:middle}
.s{font-size:14px;fill:#475569;text-anchor:middle;dominant-baseline:middle}
.h{font-size:17px;font-weight:800;fill:#334155;dominant-baseline:middle}
.n{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle}
.lb{font-size:14px;font-weight:800;dominant-baseline:middle}
.big{font-size:30px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs>
<text x="60" y="40" class="h" style="text-anchor:start;fill:#0F172A;font-size:26px">초기 실험 예시: Raspberry Pi 5 처리 한도 (요청 사이 점유 시간 반영 전)</text>
<text x="60" y="76" class="s" style="text-anchor:start;font-size:16px">이미지 분류 (MobileNetV2-0.50) · 95%가 1초 안 · 1건씩 처리 · ③④의 시험 경로는 최종 결과로 재구성</text>
<rect x="60" y="110" width="340" height="300" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="80" cy="132" r="12" fill="#1D4ED8"/>
<text x="80" y="133" class="n">1</text>
<text x="230.0" y="162" class="t">최대 처리량 계산</text>
<path d="M400,260.0 H423" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="425" y="110" width="340" height="300" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="445" cy="132" r="12" fill="#1D4ED8"/>
<text x="445" y="133" class="n">2</text>
<text x="595.0" y="162" class="t">애초에 안 되는 후보 거르기</text>
<path d="M765,260.0 H788" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="790" y="110" width="340" height="300" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="810" cy="132" r="12" fill="#1D4ED8"/>
<text x="810" y="133" class="n">3</text>
<text x="960.0" y="162" class="t">20단계 요청률 시험</text>
<path d="M1130,260.0 H1153" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="1155" y="110" width="340" height="300" rx="10" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
<circle cx="1175" cy="132" r="12" fill="#1D4ED8"/>
<text x="1175" y="133" class="n">4</text>
<text x="1325.0" y="162" class="t">경계 좁히기</text>
<path d="M1495,260.0 H1518" fill="none" stroke="#1D4ED8" stroke-width="3" marker-end="url(#b)"/>
<rect x="1520" y="110" width="340" height="300" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<circle cx="1540" cy="132" r="12" fill="#1D4ED8"/>
<text x="1540" y="133" class="n">5</text>
<text x="1690.0" y="162" class="t">처리 한도 기록</text>
<text x="230.0" y="210" class="s">측정된 실행 시간: 1건에 평균 27.8ms</text>
<text x="230.0" y="234" class="s">쉬지 않고 돌리면</text>
<text x="230.0" y="290" class="big" style="fill:#1D4ED8">초당 36.0건</text>
<text x="230.0" y="335" class="s" style="font-size:13px">= 요청 사이 점유 시간 미반영 추정값</text>
<text x="230.0" y="359" class="s" style="fill:#64748B;font-size:13px">(100%)</text>
<text x="595.0" y="210" class="s">가장 빨리 처리돼도 걸리는 시간</text>
<rect x="455" y="238" width="280" height="64" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="595.0" y="258" class="s" style="font-size:13px">실행 수십 ms + 서버·네트워크 몫 139ms</text>
<text x="595.0" y="282" class="s" style="font-size:13px">→ 약속 1초보다 훨씬 짧음</text>
<rect x="505.0" y="325" width="180" height="26" rx="13" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
<text x="595.0" y="339" class="lb" style="text-anchor:middle;fill:#15803D;font-size:13px">통과 → 시험 진행</text>
<text x="960.0" y="210" class="s">최대치의 5%씩 올려 가며 시험</text>
<text x="960.0" y="234" class="s" style="font-size:13px">(1.8 → 3.6 → … → 36.0건/초)</text>
<text x="820" y="280" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">1.8 ~ 34.2건/초</text>
<rect x="1020" y="267" width="90" height="26" rx="13" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
<text x="1065.0" y="281" class="lb" style="text-anchor:middle;fill:#15803D;font-size:13px">모두 통과</text>
<text x="820" y="324" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">36.0건/초</text>
<rect x="1020" y="311" width="90" height="26" rx="13" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1065.0" y="325" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:13px">실패</text>
<text x="960.0" y="372" class="s" style="fill:#1D4ED8;font-size:13px">→ 경계는 34.2 와 36.0 사이</text>
<text x="1325.0" y="210" class="s">사이를 반씩 나눠 다시 시험</text>
<text x="1225" y="252" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">35.1건/초</text>
<rect x="1345" y="239" width="70" height="26" rx="13" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1380.0" y="253" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:13px">실패</text>
<text x="1225" y="286" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">34.65건/초</text>
<rect x="1345" y="273" width="70" height="26" rx="13" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1380.0" y="287" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:13px">실패</text>
<text x="1225" y="320" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">34.43건/초</text>
<rect x="1345" y="307" width="70" height="26" rx="13" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1380.0" y="321" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:13px">실패</text>
<text x="1225" y="354" class="lb" style="text-anchor:start;fill:#475569;font-size:14px">34.31건/초</text>
<rect x="1345" y="341" width="70" height="26" rx="13" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
<text x="1380.0" y="355" class="lb" style="text-anchor:middle;fill:#15803D;font-size:13px">통과</text>
<text x="1325.0" y="390" class="s" style="fill:#64748B;font-size:13px">최대 처리량의 0.5% 이하 폭이면 멈춤</text>
<text x="1690.0" y="220" class="s">약속을 지키는 최대 요청률</text>
<text x="1690.0" y="280" class="big" style="fill:#1D4ED8">초당 34.3건</text>
<text x="1690.0" y="325" class="s" style="font-size:14px">최대치 36.0의 95%</text>
<text x="1690.0" y="360" class="s" style="fill:#64748B;font-size:13px">2단계에서 이 값을 씀</text>
<rect x="60" y="450" width="1060" height="560" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="80" y="478" class="h" style="text-anchor:start">정말 34.3이 경계일까? 새 시험 20번씩으로 다시 확인한 실제 결과</text>
<line x1="190" y1="890" x2="1010" y2="890" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="890" x2="190" y2="530" stroke="#334155" stroke-width="2"/>
<text x="178" y="544" class="lb" style="text-anchor:end;fill:#475569;font-size:13px">95% 응답</text>
<text x="178" y="564" class="s" style="text-anchor:end;font-size:12px">시간 (중앙값)</text>
<text x="178" y="890.0" class="s" style="text-anchor:end;font-size:12px">0ms</text>
<text x="178" y="762.7272727272727" class="s" style="text-anchor:end;font-size:12px">500ms</text>
<text x="178" y="635.4545454545455" class="s" style="text-anchor:end;font-size:12px">1,000ms</text>
<path d="M190,635.4545454545455 H1010" fill="none" stroke="#B91C1C" stroke-width="2" stroke-dasharray="8 5"/>
<text x="198" y="621.4545454545455" class="lb" style="text-anchor:start;fill:#B91C1C;font-size:13px">약속 1초</text>
<rect x="232.5" y="811.6" width="120" height="78.39999999999999" rx="4" fill="#BBF7D0" stroke="#15803D" stroke-width="2"/>
<text x="292.5" y="795.6" class="lb" style="text-anchor:middle;fill:#15803D;font-size:15px">308ms</text>
<text x="292.5" y="912" class="lb" style="text-anchor:middle;fill:#0F172A;font-size:14px">27.4건/초</text>
<text x="292.5" y="932" class="s" style="font-size:12px">한도의 80%</text>
<text x="292.5" y="958" class="lb" style="text-anchor:middle;fill:#15803D;font-size:12px">20번 중 20번 통과</text>
<rect x="437.5" y="790.2181818181818" width="120" height="99.78181818181817" rx="4" fill="#BBF7D0" stroke="#15803D" stroke-width="2"/>
<text x="497.5" y="774.2181818181818" class="lb" style="text-anchor:middle;fill:#15803D;font-size:15px">392ms</text>
<text x="497.5" y="912" class="lb" style="text-anchor:middle;fill:#0F172A;font-size:14px">30.9건/초</text>
<text x="497.5" y="932" class="s" style="font-size:12px">한도의 90%</text>
<text x="497.5" y="958" class="lb" style="text-anchor:middle;fill:#15803D;font-size:12px">20번 중 20번 통과</text>
<rect x="642.5" y="729.3818181818182" width="120" height="160.6181818181818" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2.5"/>
<text x="702.5" y="713.3818181818182" class="lb" style="text-anchor:middle;fill:#1D4ED8;font-size:15px">631ms</text>
<text x="702.5" y="912" class="lb" style="text-anchor:middle;fill:#0F172A;font-size:14px">34.3건/초</text>
<text x="702.5" y="932" class="s" style="font-size:12px">한도 그대로</text>
<text x="702.5" y="958" class="lb" style="text-anchor:middle;fill:#1D4ED8;font-size:12px">20번 중 16번 통과</text>
<rect x="847.5" y="530" width="120" height="360" rx="4" fill="#FECACA" stroke="#B91C1C" stroke-width="2"/>
<rect x="841.5" y="590" width="132" height="14" fill="#fff"/>
<path d="M841.5,590 L973.5,584" fill="none" stroke="#B91C1C" stroke-width="2"/>
<path d="M841.5,604 L973.5,598" fill="none" stroke="#B91C1C" stroke-width="2"/>
<text x="907.5" y="514" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:15px">6,473ms</text>
<text x="907.5" y="912" class="lb" style="text-anchor:middle;fill:#0F172A;font-size:14px">41.2건/초</text>
<text x="907.5" y="932" class="s" style="font-size:12px">한도의 120%</text>
<text x="907.5" y="958" class="lb" style="text-anchor:middle;fill:#B91C1C;font-size:12px">20번 중 0번 통과</text>
<text x="190" y="988" class="s" style="text-anchor:start;fill:#0F172A;font-size:14px">요청이 한도를 넘기 시작하면 대기 줄이 쌓여 응답 시간이 10배로 뛴다 → 그래서 한도에서 멈춘다</text>
<rect x="1160" y="450" width="700" height="560" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="1180" y="478" class="h" style="text-anchor:start;fill:#15803D">같은 방법, 다른 후보 (약속: 95%가 1초 안)</text>
<text x="1184" y="522" class="lb" style="text-anchor:start;fill:#0F172A;font-size:15px">Jetson AGX Orin</text>
<text x="1184" y="542" class="s" style="text-anchor:start;font-size:12px">최대 전력 모드</text>
<rect x="1390" y="516" width="365.56" height="28" rx="5" fill="#E0E7FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="1765.56" y="530" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">초당 48.1건</text>
<text x="1184" y="586" class="lb" style="text-anchor:start;fill:#0F172A;font-size:15px">Raspberry Pi 5</text>
<rect x="1390" y="572" width="260.67999999999995" height="28" rx="5" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="1660.6799999999998" y="586" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">초당 34.3건</text>
<text x="1184" y="634" class="lb" style="text-anchor:start;fill:#0F172A;font-size:15px">Jetson Nano</text>
<text x="1184" y="654" class="s" style="text-anchor:start;font-size:12px">최대 전력 모드</text>
<rect x="1390" y="628" width="84.36" height="28" rx="5" fill="#E0E7FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="1484.36" y="642" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">초당 11.1건</text>
<text x="1184" y="698" class="lb" style="text-anchor:start;fill:#0F172A;font-size:15px">Orange Pi 5 Plus</text>
<rect x="1390" y="684" width="61.56" height="28" rx="5" fill="#E0E7FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="1461.56" y="698" class="lb" style="text-anchor:start;fill:#1D4ED8;font-size:14px">초당 8.1건</text>
<text x="1184" y="768" class="s" style="text-anchor:start;fill:#0F172A;font-size:14px">→ 같은 서비스라도 장비마다 한도가 6배까지 다르다</text>
<path d="M1180,796 H1840" fill="none" stroke="#BBF7D0" stroke-width="1.5"/>
<text x="1184" y="828" class="lb" style="text-anchor:start;fill:#B91C1C;font-size:15px">한도 0이 되는 경우</text>
<text x="1184" y="858" class="s" style="text-anchor:start;font-size:14px">약속이 "99%가 0.1초 안"인 서비스</text>
<text x="1184" y="884" class="s" style="text-anchor:start;font-size:14px">서버·네트워크 몫(139ms)만으로 약속을 넘는다</text>
<text x="1184" y="910" class="lb" style="text-anchor:start;fill:#B91C1C;font-size:14px">→ 모든 장비에서 한도 0 · 시험 없이 바로 결정 (②)</text>
<path d="M1180,938 H1840" fill="none" stroke="#BBF7D0" stroke-width="1.5"/>
<text x="1184" y="964" class="lb" style="text-anchor:start;fill:#15803D;font-size:15px">아주 빠른 장비 (x86 + GPU)</text>
<text x="1184" y="990" class="s" style="text-anchor:start;font-size:14px">초기 시험의 짧은 창(14~21초)에서는 한도가 최대치 138.8에 붙었음</text>
<text x="1860" y="1056" class="s" style="text-anchor:end;fill:#64748B;font-size:12px">출처: 초기 실험의 측정 기반 처리 한도표 · 요청 사이 점유 시간 반영 전 값 (반영 후 Raspberry Pi 5 한도는 약 25건/초) · ③④의 단계별 통과·실패 경로는 결과로부터 재구성한 예시</text>
</svg>