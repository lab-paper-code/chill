<text x="990.0" y="369" class="lb" style="text-anchor:middle;fill:#7C3AED;font-size:14px">비우기</text>
<text x="230" y="420" class="lb" style="text-anchor:end;fill:#0F172A;font-size:15px">orangepi</text>
<rect x="260" y="402" width="260" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="390.0" y="421" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">그대로</text>
