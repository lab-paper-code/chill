<text x="690.0" y="317" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">그대로</text>
<rect x="860" y="298" width="260" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="990.0" y="317" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">그대로</text>
<text x="230" y="368" class="lb" style="text-anchor:end;fill:#0F172A;font-size:15px">rasp5</text>
