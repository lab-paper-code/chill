<rect x="860" y="454" width="260" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="990.0" y="473" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">15W · 이미지</text>
<text x="230" y="524" class="lb" style="text-anchor:end;fill:#0F172A;font-size:15px">jetsonx</text>
<rect x="260" y="506" width="260" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="390.0" y="525" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">그대로</text>
