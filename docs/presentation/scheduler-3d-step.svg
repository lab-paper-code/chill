<text x="390.0" y="369" class="s" style="text-anchor:middle;fill:#64748B;font-size:13px">CPU · 이미지</text>
<rect x="560" y="350" width="260" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
