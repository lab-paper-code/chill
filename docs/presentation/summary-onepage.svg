<circle cx="552" cy="338" r="4" fill="#7C3AED"/>
<text x="566" y="338" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">① 측정</text>
<text x="566" y="368" class="s" style="text-anchor:start;font-size:15px">장비 × 모델 × 전력 설정별 실측</text>
<circle cx="552" cy="432" r="4" fill="#7C3AED"/>
<text x="566" y="432" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">② 선택</text>
<text x="566" y="462" class="s" style="text-anchor:start;font-size:15px">목표 만족 배치 중 에너지 최소</text>
