<rect x="540" y="840" width="380" height="116" rx="14" fill="#fff" stroke="#1D4ED8" stroke-width="2.2"/>
<text x="730.0" y="886" class="lb" style="text-anchor:middle;fill:#1D4ED8;font-size:22px">처리 한도표</text>
<text x="730.0" y="922" class="s" style="text-anchor:middle;font-size:16px">목표 만족 최대 요청률</text>
