<circle cx="1012" cy="338" r="4" fill="#1D4ED8"/>
<text x="1026" y="338" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">실제 장비 10대</text>
<text x="1026" y="368" class="s" style="text-anchor:start;font-size:15px">x86 서버 3 · Jetson 4 · Orange Pi · LattePanda · RPi 5</text>
<circle cx="1012" cy="432" r="4" fill="#1D4ED8"/>
<text x="1026" y="432" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">서비스 3개</text>
<text x="1026" y="462" class="s" style="text-anchor:start;font-size:15px">이미지 분류 · PLC 이상탐지 · 영상 질의응답</text>
<circle cx="1012" cy="526" r="4" fill="#1D4ED8"/>
<text x="1026" y="526" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">장비별 전력계</text>
<text x="1026" y="556" class="s" style="text-anchor:start;font-size:15px">콘센트 단위 실측 (Shelly)</text>
<circle cx="1012" cy="620" r="4" fill="#1D4ED8"/>
<text x="1026" y="620" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">Kubernetes 기반</text>
<text x="1026" y="650" class="s" style="text-anchor:start;font-size:15px">엣지 장비는 KubeEdge로 연결</text>
<path d="M1404,476 H1436" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#s)"/>
<rect x="1440" y="226" width="420" height="500" rx="16" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="1466" y="272" class="h" style="text-anchor:start;fill:#15803D;font-size:26px">현재 위치</text>
<circle cx="1472" cy="338" r="4" fill="#15803D"/>
<text x="1486" y="338" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">실제 클러스터 실험으로 검증</text>
<text x="1486" y="368" class="s" style="text-anchor:start;font-size:15px">요청 증가 · 여유 구간에서 자동 재배치 확인</text>
<circle cx="1472" cy="432" r="4" fill="#15803D"/>
<text x="1486" y="432" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">사례: 요청 급증</text>
<text x="1486" y="462" class="s" style="text-anchor:start;font-size:15px">판단 후 10초 내 장비 1대 추가</text>
<circle cx="1472" cy="526" r="4" fill="#15803D"/>
<text x="1486" y="526" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">사례: 여유 구간</text>
<text x="1486" y="556" class="s" style="text-anchor:start;font-size:15px">6대 재배치 · 예상 에너지 −3.6%</text>
<circle cx="1472" cy="620" r="4" fill="#15803D"/>
<text x="1486" y="620" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">남은 과제</text>
<text x="1486" y="650" class="s" style="text-anchor:start;font-size:15px">부하 증가 후반 처리 용량 부족 · 에너지 절감 일관성 미확인</text>
<rect x="60" y="764" width="1800" height="260" rx="16" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
