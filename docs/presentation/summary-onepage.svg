<text x="566" y="526" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">③ 적용</text>
<text x="566" y="556" class="s" style="text-anchor:start;font-size:15px">전력 모드 · 실행 Pod · 요청 분배 자동 변경</text>
<circle cx="552" cy="620" r="4" fill="#7C3AED"/>
<text x="566" y="620" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">10초 주기 반복</text>
<text x="566" y="650" class="s" style="text-anchor:start;font-size:15px">요청량 변화 시 재판단</text>
