<rect x="980" y="840" width="380" height="116" rx="14" fill="#fff" stroke="#7C3AED" stroke-width="2.2"/>
<text x="1170.0" y="886" class="lb" style="text-anchor:middle;fill:#7C3AED;font-size:22px">배치 선택</text>
<text x="1170.0" y="922" class="s" style="text-anchor:middle;font-size:16px">목표 만족 · 에너지 최소</text>
<path d="M1364,898 H1416" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#s)"/>
<rect x="1420" y="840" width="380" height="116" rx="14" fill="#fff" stroke="#15803D" stroke-width="2.2"/>
<text x="1610.0" y="886" class="lb" style="text-anchor:middle;fill:#15803D;font-size:22px">적용</text>
<text x="1610.0" y="922" class="s" style="text-anchor:middle;font-size:16px">전력 · Pod · 분배 변경</text>
<path d="M1610.0,958 V990 H290.0 V960" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#p)"/>
<text x="960" y="1006" class="s" style="text-anchor:middle;fill:#7C3AED;font-size:14px">적용 결과는 다음 주기 상태 수집에 반영</text>
<text x="1840" y="1066" class="s" style="text-anchor:end;fill:#64748B;font-size:12px">사례 수치: 실제 클러스터 실험 기록 · 과제: 실험 결과 보고서</text>
