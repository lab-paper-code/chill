<text x="60" y="54" class="h" style="text-anchor:start;fill:#0F172A;font-size:32px">CHILL 한 장 요약</text>
<rect x="60" y="90" width="1800" height="100" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="960" y="128" class="lb" style="text-anchor:middle;fill:#0F172A;font-size:22px">이기종 엣지 장비에서 AI 추론 서비스를 운영하는 환경에서</text>
<text x="960" y="164" class="lb" style="text-anchor:middle;fill:#7C3AED;font-size:25px">응답 시간 목표를 만족하는 배치 중 에너지가 가장 적은 배치를 자동 선택</text>
<rect x="60" y="226" width="420" height="500" rx="16" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="86" y="272" class="h" style="text-anchor:start;fill:#B91C1C;font-size:26px">문제</text>
<circle cx="92" cy="338" r="4" fill="#B91C1C"/>
<text x="106" y="338" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">장비 이질성</text>
<text x="106" y="368" class="s" style="text-anchor:start;font-size:15px">x86+GPU · Jetson · RK3588 · Raspberry Pi</text>
<circle cx="92" cy="432" r="4" fill="#B91C1C"/>
<text x="106" y="432" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">동일 모델도 장비 · 전력 설정별로</text>
<text x="106" y="462" class="s" style="text-anchor:start;font-size:15px">속도 · 에너지 차이 큼 (최대 약 6배)</text>
<circle cx="92" cy="526" r="4" fill="#B91C1C"/>
<text x="106" y="526" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">사양만으로 최적 배치 판단 불가</text>
<text x="106" y="556" class="s" style="text-anchor:start;font-size:15px"></text>
<circle cx="92" cy="620" r="4" fill="#B91C1C"/>
<text x="106" y="620" class="lb" style="text-anchor:start;fill:#0F172A;font-size:19px">요청량 변동</text>
<text x="106" y="650" class="s" style="text-anchor:start;font-size:15px">고정 배치로는 부하 변화 대응 불가</text>
<path d="M484,476 H516" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#s)"/>
