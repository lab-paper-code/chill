version: 3
workdir: .

# Phase 2 governs CHILL-internal production package direction. Third-party
# dependency policy remains owned by go.mod, vulnerability checks, and review.
allow:
  depOnAnyVendor: true
  # Keep the merge gate on source import edges. Advanced DI inference assigns
  # composition-root wiring back to concrete packages and creates false edges.
  deepScan: false
  ignoreNotFoundComponents: false

# Tests are intentionally outside the merge-blocking architecture policy.
# hack/ contains the negative-test fixture. Test imports are still measured by
# hack/architecture-coverage.sh.
exclude:
  - test
  - hack
  # Independent Node application; installed npm packages may contain Go examples.
  - chill-dashboard
excludeFiles:
  - "^.*_test\\.go$"

# Every api/, cmd/, and internal/ production package belongs to exactly one
# component. Keep this mapping synchronized with architecture-coverage.sh.
components:
  api: { in: api/v1alpha1 }
  batch-energy-optimization-core: { in: internal/profiling/campaign }
  batch-energy-optimization-controller: { in: internal/profiling/campaign/controller }
  idle-baseline-core: { in: internal/profiling/idlebaseline }
  idle-baseline-controller: { in: internal/profiling/idlebaseline/controller }
  entrypoints: { in: [cmd, cmd/**] }
  platform-core:
    in:
      - internal/component
      - internal/kubeconfig
      - internal/metadata
      - internal/nodeprobe
  device-class: { in: internal/deviceclass }
  operator-console: { in: internal/operatorconsole }
  operator-console-readapi: { in: internal/operatorconsole/readapi }
  operator-console-kube: { in: internal/operatorconsole/kube }
  operator: { in: internal/operator/** }
  evidence-core: { in: internal/evidencestore }
  evidence-kube: { in: internal/evidencestore/kube }
  evidence-s3: { in: internal/evidencestore/s3 }
  metric-core: { in: internal/metricobserver }
  metric-edgemetrics: { in: internal/metricobserver/edgemetrics }
  workload-core: { in: internal/workloadobserver }
  workload-kube: { in: internal/workloadobserver/kube }
  model-compat: { in: internal/modelcompat }
  model-catalog: { in: internal/modelcatalog }
  node-actuator-core: { in: internal/nodeactuator }
  node-actuator-controller: { in: internal/nodeactuator/controller }
  node-actuator-jetson: { in: internal/nodeactuator/jetson }
  profile-derivation: { in: internal/profiling/derivation }
  power-window: { in: internal/profiling/powerwindow }
  transition-cost-core: { in: internal/profiling/transitioncost }
  transition-cost-controller: { in: internal/profiling/transitioncost/controller }
  transition-cost-kube: { in: internal/profiling/transitioncost/kube }
  transition-cost-worker: { in: internal/profiling/transitioncost/worker }
  profiling-run: { in: internal/profiling/run }
  profiler-app: { in: internal/profiling/profiler }
  profiler-controller: { in: internal/profiling/profiler/controller }
  profiler-projection: { in: internal/profiling/profiler/projection }
  profiler-evidence: { in: internal/profiling/profiler/evidence }
  profiler-evidence-kube: { in: internal/profiling/profiler/evidence/kube }
  profiler-kube: { in: internal/profiling/profiler/kube }
  profiler-worker: { in: internal/profiling/profiler/worker }
  serving-core: { in: internal/serving }
  serving-httpapi: { in: internal/serving/httpapi }
  serving-kube: { in: internal/serving/kube }
  firstfloor: { in: internal/firstfloor }
  serving-firstfloor: { in: internal/serving/firstfloor }

deps:
  # Executables are composition roots. Their job is to assemble any internal
  # implementation; domain packages below retain strict directional rules.
  entrypoints:
    anyProjectDeps: true

  api:
    anyVendorDeps: true

  batch-energy-optimization-core:
    anyVendorDeps: true

  batch-energy-optimization-controller:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - evidence-core
      - profile-derivation
      - profiler-app
      - profiler-projection
      - profiler-controller
      - profiler-evidence
      - profiling-run
      - model-catalog

  idle-baseline-core:
    mayDependOn:
      - profile-derivation

  idle-baseline-controller:
    mayDependOn:
      - api
      - evidence-core
      - idle-baseline-core
      - profile-derivation
      - profiler-projection
      - profiler-app
      - profiler-controller
      - profiler-evidence

  # These small support packages may collaborate within this reviewed group,
  # but cannot reach upward into operators or profiler orchestration.
  platform-core:
    mayDependOn:
      - platform-core

  device-class:
    mayDependOn:
      - api
      - platform-core

  operator-console-kube:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - device-class
      - evidence-core
      - operator-console
      - profile-derivation
      - profiler-evidence

  operator-console-readapi:
    mayDependOn:
      - api
      - operator-console

  operator-console:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - device-class
      - evidence-core
      - metric-core
      - profile-derivation
      - profiler-evidence
      - profiling-run
      - workload-core

  operator:
    mayDependOn:
      - api
      - platform-core
      - device-class
      - node-actuator-core
      - node-actuator-jetson
      - operator
      - profiling-run

  evidence-core:
    anyVendorDeps: true
  evidence-kube:
    mayDependOn:
      - platform-core
  evidence-s3:
    mayDependOn:
      - evidence-core

  metric-core:
    anyVendorDeps: true
  metric-edgemetrics:
    mayDependOn:
      - metric-core
  workload-core:
    anyVendorDeps: true
  workload-kube:
    mayDependOn:
      - workload-core

  model-compat:
    anyVendorDeps: true
  model-catalog:
    mayDependOn:
      - api
      - model-compat
  node-actuator-core:
    anyVendorDeps: true
  node-actuator-controller:
    mayDependOn:
      - api
      - node-actuator-core
  node-actuator-jetson:
    mayDependOn:
      - node-actuator-core
  profile-derivation:
    anyVendorDeps: true
    mayDependOn:
      - power-window
      - model-compat
  power-window:
    anyVendorDeps: true
  transition-cost-core:
    mayDependOn:
      - power-window
      - firstfloor
      - metric-core
      - workload-core
  transition-cost-controller:
    mayDependOn:
      - api
      - device-class
      - evidence-core
      - evidence-kube
      - idle-baseline-core
      - metric-core
      - platform-core
      - profiler-app
      - profiling-run
      - transition-cost-core
  transition-cost-kube:
    mayDependOn:
      - api
      - transition-cost-core
      - firstfloor
      - profiling-run
      - workload-core
      - workload-kube
  transition-cost-worker:
    mayDependOn:
      - evidence-core
      - metric-core
      - transition-cost-core
  profiling-run:
    anyVendorDeps: true
    mayDependOn:
      - model-compat
      - firstfloor

  profiler-app:
    mayDependOn:
      - evidence-core
      - node-actuator-core
      - profiling-run

  profiler-evidence:
    mayDependOn:
      - evidence-core
      - metric-core
      - profiling-run
      - workload-core

  profiler-evidence-kube:
    mayDependOn:
      - api
      - evidence-core
      - evidence-kube
      - profiler-evidence
      - profiling-run

  profiler-projection:
    mayDependOn:
      - evidence-core
      - metric-core
      - profile-derivation
      - profiler-evidence
      - profiling-run
      - workload-core
      - model-compat

  profiler-worker:
    mayDependOn:
      - evidence-core
      - metric-core
      - profiler-evidence
      - profiling-run
      - workload-core
      - model-compat

  serving-httpapi:
    mayDependOn:
      - serving-core
      - api
      - serving-kube

  serving-core:
    mayDependOn:
      - model-compat
      - evidence-core
      - profile-derivation
      - firstfloor
      - metric-core
      - power-window

  firstfloor:
    anyVendorDeps: true
  serving-firstfloor:
    mayDependOn:
      - serving-core
      - firstfloor

  serving-kube:
    mayDependOn:
      - api
      - device-class
      - model-catalog
      - model-compat
      - evidence-core
      - batch-energy-optimization-core
      - profile-derivation
      - profiler-evidence
      - profiler-projection
      - profiling-run
      - serving-core
      - serving-firstfloor
      - firstfloor
      - evidence-kube
      - metric-core
      - metric-edgemetrics
      - transition-cost-core
      - power-window
      # Configured actuation policies decide which DeviceClass modes are requestable.
      - node-actuator-core
      - platform-core
      - workload-core
      - workload-kube

  profiler-controller:
    mayDependOn:
      - api
      - platform-core
      - evidence-core
      - evidence-kube
      - profiler-app
      - profiler-projection
      - profiler-evidence
      - profiler-evidence-kube
      - profiling-run

  profiler-kube:
    mayDependOn:
      - api
      - platform-core
      - device-class
      - evidence-kube
      - metric-edgemetrics
      - model-compat
      - model-catalog
      - profiler-app
      - profiler-projection
      - profiling-run
