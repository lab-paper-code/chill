version: 3
workdir: .

# Phase 2 governs CHILL-internal production package direction. Third-party
# dependency policy remains owned by go.mod, vulnerability checks, and review.
allow:
  depOnAnyVendor: true
  # Keep the merge gate on source import edges. Advanced DI inference assigns
  # composition-root wiring back to concrete packages and creates false edges.
  deepScan: false
  ignoreNotFoundComponents: false

# Tests are intentionally outside the merge-blocking architecture policy.
# hack/ contains the negative-test fixture. Test imports are still measured by
# hack/architecture-coverage.sh.
exclude:
  # Local tool outputs and nested deployment worktrees are outside production source.
  - bin
  - test
  - hack
  # Independent Node application; installed npm packages may contain Go examples.
  - chill-dashboard
excludeFiles:
  - "^.*_test\\.go$"

# Every api/, cmd/, and internal/ production package belongs to exactly one
# component. Keep this mapping synchronized with architecture-coverage.sh.
components:
  api: { in: api/v1alpha1 }
  batch-energy-optimization-core: { in: internal/profiling/campaign }
  batch-energy-optimization-controller: { in: internal/profiling/campaign/controller }
  campaign-evidence: { in: internal/profiling/campaign/evidence }
  idle-baseline-core: { in: internal/profiling/idlebaseline }
  idle-baseline-controller: { in: internal/profiling/idlebaseline/controller }
  entrypoints: { in: [cmd, cmd/**] }
  platform-core:
    in:
      - internal/component
      - internal/kubeconfig
      - internal/metadata
      - internal/nodeprobe
  device-class: { in: internal/deviceclass }
  query-api: { in: internal/queryapi }
  query-api-readapi: { in: internal/queryapi/readapi }
  query-api-kube: { in: internal/queryapi/kube }
  operator: { in: internal/operator/** }
  evidence-core: { in: internal/evidencestore }
  evidence-kube: { in: internal/evidencestore/kube }
  evidence-s3: { in: internal/evidencestore/s3 }
  evaluation-controller: { in: internal/evaluation/controller }
  evaluation-service: { in: internal/evaluation/service }
  metric-core: { in: internal/metricobserver }
  metric-edgemetrics: { in: internal/metricobserver/edgemetrics }
  workload-core: { in: internal/workloadobserver }
  workload-kube: { in: internal/workloadobserver/kube }
  model-compat: { in: internal/modelcompat }
  model-catalog: { in: internal/modelcatalog }
  node-actuator-core: { in: internal/nodeactuator }
  node-actuator-controller: { in: internal/nodeactuator/controller }
  node-actuator-jetson: { in: internal/nodeactuator/jetson }
  node-actuator-nvidia: { in: internal/nodeactuator/nvidia }
  profile-derivation: { in: internal/profiling/derivation }
  power-window: { in: internal/profiling/powerwindow }
  transition-cost-core: { in: internal/profiling/transitioncost }
  transition-cost-controller: { in: internal/profiling/transitioncost/controller }
  transition-cost-kube: { in: internal/profiling/transitioncost/kube }
  transition-cost-worker: { in: internal/profiling/transitioncost/worker }
  profiling-run: { in: internal/profiling/run }
  profiler-app: { in: internal/profiling/profiler }
  profiler-controller: { in: internal/profiling/profiler/controller }
  profiler-projection: { in: internal/profiling/profiler/projection }
  profiler-evidence: { in: internal/profiling/profiler/evidence }
  profiler-evidence-kube: { in: internal/profiling/profiler/evidence/kube }
  profiler-kube: { in: internal/profiling/profiler/kube }
  profiler-worker: { in: internal/profiling/profiler/worker }
  scheduler-root: { in: internal/scheduler }
  scheduler-protocol: { in: internal/scheduler/protocol }
  scheduler-v1: { in: internal/scheduler/v1 }
  scheduler-v2: { in: internal/scheduler/v2 }
  serving-core: { in: internal/serving }
  serving-observation: { in: internal/serving/observation }
  serving-httpapi: { in: internal/serving/httpapi }
  serving-application: { in: internal/serving/application }
  serving-live: { in: internal/serving/live }
  serving-kube: { in: internal/serving/kube }
  serving-management: { in: internal/serving/management }
  serving-state: { in: internal/serving/state }
  serving-operations: { in: internal/serving/operations }
  serving-measurement: { in: internal/serving/measurement }
  firstfloor: { in: internal/firstfloor }
  serving-firstfloor: { in: internal/serving/firstfloor }

deps:
  # Executables are composition roots. Their job is to assemble any internal
  # implementation; domain packages below retain strict directional rules.
  entrypoints:
    anyProjectDeps: true

  api:
    anyVendorDeps: true

  batch-energy-optimization-core:
    anyVendorDeps: true
    mayDependOn:
      # The terminal-status predicate reads the native campaign status and the
      # Run's terminal resolution reasons; its controller and the deletion
      # owner both call it.
      - api
      - profile-derivation
      - profiling-run

  batch-energy-optimization-controller:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - evidence-core
      - profile-derivation
      - profiler-app
      - profiler-projection
      - profiler-controller
      - profiler-evidence
      - profiling-run
      # Node power-mode label and generation.
      - platform-core
      - model-catalog

  campaign-evidence:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - evidence-core
      - profile-derivation
      - profiler-evidence
      - profiling-run

  idle-baseline-core:
    mayDependOn:
      - profile-derivation

  idle-baseline-controller:
    mayDependOn:
      - api
      - evidence-core
      - idle-baseline-core
      - profile-derivation
      - profiler-projection
      - profiler-app
      - profiler-controller
      - profiler-evidence
      # Waits for ChillServer's measurement admission annotation.
      - profiling-run
      # Node power-mode label and generation.
      - platform-core

  # These small support packages may collaborate within this reviewed group,
  # but cannot reach upward into operators or profiler orchestration.
  platform-core:
    mayDependOn:
      - platform-core

  device-class:
    mayDependOn:
      - api
      - platform-core

  query-api-kube:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - device-class
      - evidence-core
      - query-api
      - profile-derivation
      - profiler-evidence

  query-api-readapi:
    mayDependOn:
      - api
      - query-api

  query-api:
    mayDependOn:
      - api
      - batch-energy-optimization-core
      - campaign-evidence
      - device-class
      - evidence-core
      - metric-core
      - profile-derivation
      - profiler-evidence
      - profiling-run
      - workload-core

  operator:
    mayDependOn:
      - api
      - platform-core
      - device-class
      - node-actuator-core
      - node-actuator-jetson
      - node-actuator-nvidia
      - operator
      - profiling-run

  evidence-core:
    anyVendorDeps: true
  evidence-kube:
    mayDependOn:
      - platform-core
  evidence-s3:
    mayDependOn:
      - evidence-core

  evaluation-controller:
    mayDependOn:
      - api
      - evidence-core
      - evidence-kube
      - evidence-s3

  evaluation-service:
    mayDependOn:
      - api
      - evidence-core
      - serving-core

  metric-core:
    anyVendorDeps: true
  metric-edgemetrics:
    mayDependOn:
      - metric-core
  workload-core:
    anyVendorDeps: true
  workload-kube:
    mayDependOn:
      - workload-core

  model-compat:
    anyVendorDeps: true
  model-catalog:
    mayDependOn:
      - api
      - model-compat
  node-actuator-core:
    anyVendorDeps: true
  node-actuator-controller:
    mayDependOn:
      - api
      - node-actuator-core
      # The read-back annotation key.
      - platform-core
  node-actuator-jetson:
    mayDependOn:
      - node-actuator-core
  node-actuator-nvidia:
    mayDependOn:
      - node-actuator-core
  profile-derivation:
    anyVendorDeps: true
    mayDependOn:
      - firstfloor
      - power-window
      - model-compat
  power-window:
    anyVendorDeps: true
  transition-cost-core:
    mayDependOn:
      - power-window
      - firstfloor
      - metric-core
      - workload-core
  transition-cost-controller:
    mayDependOn:
      - api
      - device-class
      - evidence-core
      - evidence-kube
      - idle-baseline-core
      - metric-core
      - platform-core
      - profiler-app
      - profiling-run
      - transition-cost-core
  transition-cost-kube:
    mayDependOn:
      - api
      - transition-cost-core
      - firstfloor
      - profiling-run
      - workload-core
      # Node power-mode transition annotation.
      - platform-core
      - workload-kube
  transition-cost-worker:
    mayDependOn:
      - evidence-core
      - metric-core
      - transition-cost-core
  profiling-run:
    anyVendorDeps: true
    mayDependOn:
      - model-compat
      - firstfloor

  profiler-app:
    mayDependOn:
      - evidence-core
      - metric-core
      - node-actuator-core
      - profiling-run
      - firstfloor

  profiler-evidence:
    mayDependOn:
      - evidence-core
      - metric-core
      - profiling-run
      - workload-core

  profiler-evidence-kube:
    mayDependOn:
      - api
      - evidence-core
      - evidence-kube
      - profiler-evidence
      - profiling-run

  profiler-projection:
    mayDependOn:
      - evidence-core
      - firstfloor
      - metric-core
      - profile-derivation
      - profiler-evidence
      - profiling-run
      - workload-core
      - model-compat

  profiler-worker:
    mayDependOn:
      - evidence-core
      - metric-core
      - profiler-evidence
      - profiling-run
      - workload-core
      - model-compat

  serving-application:
    mayDependOn:
      - serving-core
      - serving-state
      - serving-operations
      - serving-observation
      - serving-measurement
      - serving-kube
      - evidence-core
      - evidence-kube
      - evidence-s3
      - firstfloor
      - metric-core
      - metric-edgemetrics
      - node-actuator-core
      - power-window
      - profiler-app
      - profiler-kube

  serving-httpapi:
    mayDependOn:
      - serving-core
      - firstfloor
      - serving-state
      - serving-operations
      - serving-observation
      - api
      - serving-kube
      - serving-live
      - evaluation-service
      - serving-measurement
      - serving-application
      - serving-management

  serving-live:
    anyVendorDeps: true


  serving-measurement:
    mayDependOn:
      - api
      - evidence-core
      - firstfloor
      - batch-energy-optimization-core
      - profiling-run
      - query-api
      - serving-core
      - serving-state
      - serving-kube

  # Scheduler algorithms consume neutral contracts only. CHILL numerical and
  # physical admission adapters stay in serving-core; no reverse edge is allowed.
  scheduler-protocol:
    anyVendorDeps: true
  scheduler-v1:
    mayDependOn:
      - scheduler-protocol
  scheduler-v2:
    mayDependOn:
      - scheduler-protocol
  scheduler-root:
    mayDependOn:
      - scheduler-protocol
      - scheduler-v1
      - scheduler-v2

  serving-core:
    mayDependOn:
      - scheduler-root
      - scheduler-protocol
      - model-compat
      - evidence-core
      - profile-derivation
      - firstfloor
      - metric-core

  serving-observation:
    mayDependOn:
      - serving-core
      - evidence-core
      - metric-core
      - power-window

  firstfloor:
    anyVendorDeps: true
  serving-firstfloor:
    mayDependOn:
      - serving-core
      - firstfloor

  serving-management:
    mayDependOn:
      - api
      - model-catalog
      - serving-core
      - evidence-core
      - profile-derivation
      - serving-observation

  serving-state:
    mayDependOn:
      - serving-core
      - api
      - platform-core
      - evidence-core
      - evidence-kube
      - firstfloor
      - workload-core

  serving-operations:
    mayDependOn:
      - api
      - platform-core
      - evidence-core
      - firstfloor
      - metric-core
      - power-window
      - profiling-run
      - serving-core
      - serving-firstfloor
      - serving-state
      - workload-core
      - workload-kube

  serving-kube:
    mayDependOn:
      - api
      - device-class
      - model-catalog
      - model-compat
      - evidence-core
      - batch-energy-optimization-core
      - campaign-evidence
      - profile-derivation
      - profiler-evidence
      - profiler-projection
      - profiling-run
      - serving-core
      - serving-state
      - serving-operations
      - serving-observation
      - serving-management
      - serving-firstfloor
      - firstfloor
      - evidence-kube
      - metric-core
      - metric-edgemetrics
      - transition-cost-core
      - power-window
      # Configured actuation policies decide which DeviceClass modes are requestable.
      - node-actuator-core
      - platform-core
      - workload-core
      - workload-kube

  profiler-controller:
    mayDependOn:
      - firstfloor
      - api
      - platform-core
      - evidence-core
      # Executable children authenticate the recorded campaign identity and plan.
      - batch-energy-optimization-core
      - profile-derivation
      - evidence-kube
      - profiler-app
      - profiler-projection
      - profiler-evidence
      - profiler-evidence-kube
      - profiling-run

  profiler-kube:
    mayDependOn:
      - api
      - platform-core
      - device-class
      - evidence-kube
      - evidence-core
      - firstfloor
      - metric-edgemetrics
      - model-compat
      - model-catalog
      - profiler-app
      - profiler-projection
      - profiling-run
